name: CI

on:
  push:
    branches: [main, upgrade/*]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ims-user/backend/requirements.txt
      - name: Run Backend Tests
        run: |
          PYTHONPATH=. pytest apps/ims-user/backend/tests apps/ims-admin/backend/tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build Frontends
        run: |
          pnpm --filter @zolexora/ims-user-frontend build
          pnpm --filter @zolexora/ims-admin-frontend build
