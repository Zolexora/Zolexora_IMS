name = "zolexora-ims-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

routes = [
  { pattern = "ims.zolexora.com/*", zone_name = "zolexora.com" }
]

# KV Namespace binding for edge-cached session storage
[[kv_namespaces]]
binding = "SESSION_KV"
id = "zolexora_sessions_kv"
preview_id = "zolexora_sessions_kv_preview"

# Environment Variables
[vars]
GAS_EXEC_URL = "https://script.google.com/macros/s/AKfycbyQpkaxpQrmcDyFtROLp4PNRGVxTFpBzg7KkNBiqPOxSOtxijB8VUarYIpTuprSB7f3/exec"
SESSION_TTL_SECONDS = "604800"
