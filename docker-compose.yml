version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Zolexora IMS User API (FastAPI Backend for POS & Inventory)
  # ----------------------------------------------------------------------------
  user-backend:
    build:
      context: ./apps/ims-user/backend
      dockerfile: Dockerfile
    container_name: zolexora-user-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - JWT_SECRET=${JWT_SECRET:-zolexora_jwt_secret_dev_key_only}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_D1_DATABASE_ID=${CLOUDFLARE_D1_DATABASE_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - zolexora-network

  # ----------------------------------------------------------------------------
  # 2. Zolexora IMS Admin API (FastAPI Backend for SuperAdmin Portal)
  # ----------------------------------------------------------------------------
  admin-backend:
    build:
      context: ./apps/ims-admin/backend
      dockerfile: Dockerfile
    container_name: zolexora-admin-backend
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - ENVIRONMENT=production
      - JWT_SECRET=${JWT_SECRET:-zolexora_jwt_secret_dev_key_only}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-admin@zolexora.internal}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_D1_DATABASE_ID=${CLOUDFLARE_D1_DATABASE_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - zolexora-network

  # ----------------------------------------------------------------------------
  # 3. Zolexora IMS User Frontend (POS Terminal + Inventory Operations Portal)
  # ----------------------------------------------------------------------------
  user-frontend:
    build:
      context: ./apps/ims-user/frontend
      dockerfile: Dockerfile
    container_name: zolexora-user-frontend
    ports:
      - "3000:3000"
    depends_on:
      user-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - zolexora-network

  # ----------------------------------------------------------------------------
  # 4. Zolexora IMS Admin Frontend (SuperAdmin Control Center)
  # ----------------------------------------------------------------------------
  admin-frontend:
    build:
      context: ./apps/ims-admin/frontend
      dockerfile: Dockerfile
    container_name: zolexora-admin-frontend
    ports:
      - "3001:3001"
    depends_on:
      admin-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - zolexora-network

networks:
  zolexora-network:
    driver: bridge
