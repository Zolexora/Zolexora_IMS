<script>
/**
 * Zolexora IMS — Platform SuperAdmin Control Plane Client
 */

const adminApp = {
  state: {
    activeTab: 'overview',
    currentUser: null,
    overview: {},
    organizations: [],
    users: [],
    diagnostics: {},
    auditLogs: [],
    settings: {},
    chartInstances: {},
    sqlHistory: []
  },

  async init() {
    this.updateClock();
    setInterval(() => this.updateClock(), 1000);

    // Initial check session
    await this.checkAuth();
    await this.loadAllPlatformData();
    this.switchTab('overview');
  },

  updateClock() {
    const el = document.getElementById('liveEdgeClock');
    if (el) {
      const now = new Date();
      el.innerText = now.toUTCString().replace('GMT', 'UTC');
    }
  },

  async checkAuth() {
    try {
      const res = await fetch('/api/auth/session');
      const data = await res.json();
      if (data.authenticated && data.user) {
        this.state.currentUser = data.user;
        this.renderUserProfile();
      } else {
        this.state.currentUser = {
          name: 'Abhishek Sharma',
          email: 'abhishekofficial4577@gmail.com',
          role: 'Platform SuperAdmin'
        };
        this.renderUserProfile();
      }
    } catch (e) {
      console.warn('Auth check fallback to root persona:', e);
      this.state.currentUser = {
        name: 'Abhishek Sharma',
        email: 'abhishekofficial4577@gmail.com',
        role: 'Platform SuperAdmin'
      };
      this.renderUserProfile();
    }
  },

  renderUserProfile() {
    const u = this.state.currentUser;
    if (!u) return;
    const nameEl = document.getElementById('superAdminName');
    const emailEl = document.getElementById('superAdminEmail');
    const badgeEl = document.getElementById('superAdminRoleBadge');
    if (nameEl) nameEl.innerText = u.name;
    if (emailEl) emailEl.innerText = u.email;
    if (badgeEl) badgeEl.innerText = u.role;
  },

  async loadAllPlatformData() {
    await Promise.all([
      this.fetchOverview(),
      this.fetchOrganizations(),
      this.fetchUsers(),
      this.fetchDatabase(),
      this.fetchAuditLogs()
    ]);
  },

  // ================================================================
  // TAB NAVIGATION
  // ================================================================
  switchTab(tabId) {
    this.state.activeTab = tabId;

    // Update Nav items
    document.querySelectorAll('.admin-nav-item').forEach(el => {
      el.className = 'admin-nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-white/5 transition cursor-pointer';
    });
    const activeBtn = document.getElementById('nav-' + tabId);
    if (activeBtn) {
      activeBtn.className = 'admin-nav-item flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-white bg-indigo-600/90 shadow-lg shadow-indigo-600/25 transition cursor-pointer';
    }

    // Toggle Panes
    document.querySelectorAll('.admin-tab-pane').forEach(el => el.classList.add('hidden'));
    const targetPane = document.getElementById('pane-' + tabId);
    if (targetPane) targetPane.classList.remove('hidden');

    if (tabId === 'overview') {
      setTimeout(() => this.renderOverviewCharts(), 150);
    }
    if (tabId === 'database') {
      this.renderDatabaseDiagnostics();
    }
  },

  // ================================================================
  // API FETCHERS
  // ================================================================
  async fetchOverview() {
    try {
      const res = await fetch('/api/platform/overview');
      const data = await res.json();
      if (data.success) {
        this.state.overview = data.overview;
        this.renderOverviewMetrics();
      }
    } catch (e) {
      console.error('Failed to load overview:', e);
    }
  },

  async fetchOrganizations() {
    try {
      const res = await fetch('/api/platform/organizations');
      const data = await res.json();
      if (data.success) {
        this.state.organizations = data.organizations || [];
        this.renderOrganizationsTable();
        this.updateTenantCounters();
      }
    } catch (e) {
      console.error('Failed to load organizations:', e);
    }
  },

  async fetchUsers() {
    try {
      const res = await fetch('/api/platform/users');
      const data = await res.json();
      if (data.success) {
        this.state.users = data.users || [];
        this.renderUsersTable();
        this.updateUserCounters();
      }
    } catch (e) {
      console.error('Failed to load users:', e);
    }
  },

  async fetchDatabase() {
    try {
      const res = await fetch('/api/platform/database');
      const data = await res.json();
      if (data.success) {
        this.state.diagnostics = data.diagnostics;
        this.renderDatabaseDiagnostics();
      }
    } catch (e) {
      console.error('Failed to load database stats:', e);
    }
  },

  async fetchAuditLogs() {
    try {
      const res = await fetch('/api/platform/audit-logs?limit=40');
      const data = await res.json();
      if (data.success) {
        this.state.auditLogs = data.logs || [];
        this.renderAuditLogsTable();
      }
    } catch (e) {
      console.error('Failed to load audit logs:', e);
    }
  },

  // ================================================================
  // OVERVIEW RENDERING
  // ================================================================
  renderOverviewMetrics() {
    const o = this.state.overview || {};
    const setTxt = (id, val) => {
      const el = document.getElementById(id);
      if (el) el.innerText = typeof val === 'number' ? val.toLocaleString() : (val || '0');
    };

    setTxt('kpiTotalOrgs', o.totalOrganizations);
    setTxt('kpiActiveOrgs', o.activeOrganizations);
    setTxt('kpiTotalStores', o.totalStores);
    setTxt('kpiTotalCounters', o.totalSellingPoints);
    setTxt('kpiTotalUsers', o.totalUsers);
    setTxt('kpiTotalSkus', o.totalProducts);
    setTxt('kpiTotalUnits', o.totalUnitsManaged);
    setTxt('kpiValuation', '₹' + Math.round(o.totalInventoryValuation || 0).toLocaleString());
    setTxt('kpiSalesRevenue', '₹' + Math.round(o.totalSalesRevenue || 0).toLocaleString());

    const latEl = document.getElementById('dbLatencyPill');
    if (latEl) {
      latEl.innerText = `${o.dbLatencyMs || 14}ms Latency (${o.edgeLocation || 'SIN'})`;
    }
  },

  renderOverviewCharts() {
    const orgs = this.state.organizations || [];

    // Chart 1: Tenant Status & Tier Doughnut
    const ctxTier = document.getElementById('chartTenantTiers');
    if (ctxTier) {
      if (this.state.chartInstances.tier) this.state.chartInstances.tier.destroy();
      const activeCount = orgs.filter(o => o.status === 'Active').length;
      const suspCount = orgs.filter(o => o.status === 'Suspended').length;

      this.state.chartInstances.tier = new Chart(ctxTier.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: ['Active Tenants', 'Suspended / Archived'],
          datasets: [{
            data: [activeCount || 1, suspCount || 0],
            backgroundColor: ['#10b981', '#ef4444'],
            borderWidth: 2,
            borderColor: '#121522'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: {
            legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 } } }
          }
        }
      });
    }

    // Chart 2: Inventory Valuation by Tenant Bar Chart
    const ctxVal = document.getElementById('chartTenantValuation');
    if (ctxVal) {
      if (this.state.chartInstances.val) this.state.chartInstances.val.destroy();
      const topOrgs = [...orgs].sort((a, b) => (b.valuation || 0) - (a.valuation || 0)).slice(0, 5);

      this.state.chartInstances.val = new Chart(ctxVal.getContext('2d'), {
        type: 'bar',
        data: {
          labels: topOrgs.map(o => o.name.length > 15 ? o.name.slice(0, 12) + '...' : o.name),
          datasets: [{
            label: 'Stock Value (₹)',
            data: topOrgs.map(o => o.valuation || 0),
            backgroundColor: '#6366f1',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } },
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }
  },

  // ================================================================
  // TENANT ORGANIZATIONS
  // ================================================================
  updateTenantCounters() {
    const badge = document.getElementById('badgeTotalOrgs');
    if (badge) badge.innerText = this.state.organizations.length;
  },

  renderOrganizationsTable(filter = '') {
    const tbody = document.getElementById('orgsTableBody');
    if (!tbody) return;

    let orgs = this.state.organizations || [];
    if (filter) {
      const q = filter.toLowerCase();
      orgs = orgs.filter(o => o.name.toLowerCase().includes(q) || o.id.toLowerCase().includes(q) || (o.ownerEmail && o.ownerEmail.toLowerCase().includes(q)));
    }

    if (orgs.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="text-center py-10 text-slate-500 text-xs">No tenant organizations found. Click "+ Provision Tenant" to create one.</td></tr>`;
      return;
    }

    tbody.innerHTML = orgs.map(org => {
      const isActive = org.status === 'Active';
      return `
        <tr class="hover:bg-white/[0.03] transition border-b border-white/5 text-slate-300">
          <td class="py-3.5 px-4 font-mono font-bold text-xs text-indigo-400">${org.id}</td>
          <td class="py-3.5 px-4">
            <div class="font-bold text-white text-xs flex items-center gap-2">
              <span>${org.name}</span>
              ${org.id === 'ORG_ZOLEXORA_001' ? '<span class="px-1.5 py-0.5 rounded text-[9px] bg-indigo-500/20 text-indigo-300 font-bold border border-indigo-500/30">Root Host</span>' : ''}
            </div>
            <div class="text-[11px] text-slate-500 mt-0.5">${org.industry} &bull; ${org.ownerEmail}</div>
          </td>
          <td class="py-3.5 px-3 text-center">
            <span class="font-bold text-white text-xs">${org.storeCount}</span>
            <span class="text-[10px] text-slate-500"> stores</span>
          </td>
          <td class="py-3.5 px-3 text-center">
            <span class="font-bold text-emerald-400 text-xs">${org.sellingPointCount}</span>
            <span class="text-[10px] text-slate-500"> registers</span>
          </td>
          <td class="py-3.5 px-3 text-center">
            <span class="font-bold text-slate-200 text-xs">${org.userCount}</span>
            <span class="text-[10px] text-slate-500"> staff</span>
          </td>
          <td class="py-3.5 px-4 text-right font-mono font-bold text-xs text-white">
            ₹${Math.round(org.valuation || 0).toLocaleString()}
          </td>
          <td class="py-3.5 px-3 text-center">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${isActive ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/15 text-rose-400 border border-rose-500/30'}">
              ${org.status}
            </span>
          </td>
          <td class="py-3.5 px-4 text-right space-x-1 whitespace-nowrap">
            <button onclick="adminApp.impersonateTenant('${org.id}', '${org.name.replace(/'/g, "\\'")}')" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-indigo-500/20 text-indigo-300 hover:bg-indigo-500/30 border border-indigo-500/30 transition cursor-pointer inline-flex items-center gap-1" title="Launch Tenant IMS Instance as SuperAdmin">
              <span class="material-symbols-outlined text-[13px]">rocket_launch</span>
              <span>Launch</span>
            </button>
            <button onclick="adminApp.openTenantModal('${org.id}')" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 transition cursor-pointer">Edit</button>
            <button onclick="adminApp.toggleTenantStatus('${org.id}', '${org.status}')" class="px-2.5 py-1 text-xs font-semibold rounded-lg ${isActive ? 'bg-amber-500/15 text-amber-300 hover:bg-amber-500/25' : 'bg-emerald-500/15 text-emerald-300 hover:bg-emerald-500/25'} transition cursor-pointer">${isActive ? 'Suspend' : 'Activate'}</button>
            ${org.id !== 'ORG_ZOLEXORA_001' ? `<button onclick="adminApp.confirmDeleteTenant('${org.id}', '${org.name.replace(/'/g, "\\'")}')" class="px-2 py-1 text-xs font-semibold rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 transition cursor-pointer">Delete</button>` : ''}
          </td>
        </tr>
      `;
    }).join('');
  },

  openTenantModal(orgId = null) {
    const modal = document.getElementById('tenantModal');
    if (!modal) return;
    const title = document.getElementById('tenantModalTitle');

    if (orgId) {
      const org = this.state.organizations.find(o => o.id === orgId);
      if (!org) return;
      title.innerText = 'Edit Tenant Organization: ' + org.name;
      document.getElementById('tenantModalId').value = org.id;
      document.getElementById('tenantNameInput').value = org.name;
      document.getElementById('tenantIndustryInput').value = org.industry;
      document.getElementById('tenantOwnerEmailInput').value = org.ownerEmail;
      document.getElementById('tenantCurrencyInput').value = org.currency || '₹';
      document.getElementById('tenantStatusInput').value = org.status;
    } else {
      title.innerText = 'Provision New Tenant Organization';
      document.getElementById('tenantModalId').value = 'NEW';
      document.getElementById('tenantNameInput').value = '';
      document.getElementById('tenantIndustryInput').value = 'Retail & Hospitality';
      document.getElementById('tenantOwnerEmailInput').value = '';
      document.getElementById('tenantCurrencyInput').value = '₹';
      document.getElementById('tenantStatusInput').value = 'Active';
    }

    modal.classList.remove('hidden');
  },

  closeTenantModal() {
    const modal = document.getElementById('tenantModal');
    if (modal) modal.classList.add('hidden');
  },

  async submitTenantForm(e) {
    if (e) e.preventDefault();
    const id = document.getElementById('tenantModalId').value;
    const name = document.getElementById('tenantNameInput').value.trim();
    const industry = document.getElementById('tenantIndustryInput').value;
    const ownerEmail = document.getElementById('tenantOwnerEmailInput').value.trim();
    const currency = document.getElementById('tenantCurrencyInput').value;
    const status = document.getElementById('tenantStatusInput').value;

    if (!name) {
      this.showToast('Tenant Name is required.', 'error');
      return;
    }

    try {
      const res = await fetch('/api/platform/organizations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, name, industry, ownerEmail, currency, status })
      });
      const data = await res.json();
      if (data.success) {
        this.showToast(`Tenant "${name}" successfully saved!`, 'success');
        this.closeTenantModal();
        this.state.organizations = data.organizations || [];
        this.renderOrganizationsTable();
        this.fetchOverview();
        this.fetchAuditLogs();
      } else {
        this.showToast(data.error || 'Failed to save tenant', 'error');
      }
    } catch (err) {
      this.showToast('Network error: ' + err.message, 'error');
    }
  },

  async toggleTenantStatus(orgId, currentStatus) {
    const newStatus = currentStatus === 'Active' ? 'Suspended' : 'Active';
    if (!confirm(`Are you sure you want to change status of Tenant [${orgId}] to ${newStatus}?`)) return;

    try {
      const res = await fetch(`/api/platform/organizations/${orgId}/toggle-status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      const data = await res.json();
      if (data.success) {
        this.showToast(`Tenant status updated to ${newStatus}`, 'success');
        this.state.organizations = data.organizations || [];
        this.renderOrganizationsTable();
        this.fetchOverview();
        this.fetchAuditLogs();
      } else {
        this.showToast(data.error || 'Failed to update status', 'error');
      }
    } catch (err) {
      this.showToast('Network error: ' + err.message, 'error');
    }
  },

  async confirmDeleteTenant(orgId, orgName) {
    if (!confirm(`CAUTION: Are you sure you want to PERMANENTLY DELETE Tenant "${orgName}" [${orgId}]?\n\nThis will remove all associated stores, selling points, and local user records.`)) return;

    try {
      const res = await fetch(`/api/platform/organizations/${orgId}`, {
        method: 'DELETE'
      });
      const data = await res.json();
      if (data.success) {
        this.showToast(`Tenant [${orgId}] permanently deleted`, 'success');
        this.state.organizations = data.organizations || [];
        this.renderOrganizationsTable();
        this.fetchOverview();
        this.fetchAuditLogs();
      } else {
        this.showToast(data.error || 'Failed to delete tenant', 'error');
      }
    } catch (err) {
      this.showToast('Network error: ' + err.message, 'error');
    }
  },

  async impersonateTenant(tenantId, tenantName) {
    try {
      const res = await fetch('/api/platform/impersonate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tenantId })
      });
      const data = await res.json();
      if (data.success && data.targetUrl) {
        this.showToast(`Launching IMS for tenant "${tenantName}"...`, 'info');
        window.open(data.targetUrl, '_blank');
      } else {
        this.showToast(data.error || 'Failed to generate impersonation token', 'error');
      }
    } catch (err) {
      this.showToast('Network error: ' + err.message, 'error');
    }
  },

  // ================================================================
  // GLOBAL USERS
  // ================================================================
  updateUserCounters() {
    const badge = document.getElementById('badgeTotalUsers');
    if (badge) badge.innerText = this.state.users.length;
  },

  renderUsersTable(filter = '') {
    const tbody = document.getElementById('usersTableBody');
    if (!tbody) return;

    let users = this.state.users || [];
    if (filter) {
      const q = filter.toLowerCase();
      users = users.filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || (u.orgName && u.orgName.toLowerCase().includes(q)) || (u.role && u.role.toLowerCase().includes(q)));
    }

    if (users.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-slate-500 text-xs">No users found.</td></tr>`;
      return;
    }

    tbody.innerHTML = users.map(u => {
      const isSuper = u.role === 'SuperAdmin' || u.role === 'PlatformAdmin';
      const roleColor = isSuper ? 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30' : u.role === 'Admin' ? 'bg-purple-500/20 text-purple-300 border-purple-500/30' : 'bg-slate-700/40 text-slate-300 border-slate-600/30';

      return `
        <tr class="hover:bg-white/[0.03] transition border-b border-white/5 text-slate-300 text-xs">
          <td class="py-3 px-4 font-mono font-bold text-slate-400">${u.id}</td>
          <td class="py-3 px-4">
            <div class="font-bold text-white">${u.name}</div>
            <div class="text-[11px] text-slate-500">${u.email}</div>
          </td>
          <td class="py-3 px-4 text-slate-300 font-semibold">
            ${u.orgName} <span class="font-mono text-[10px] text-slate-500">(${u.orgId})</span>
          </td>
          <td class="py-3 px-3 text-center">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${roleColor}">
              ${u.role}
            </span>
          </td>
          <td class="py-3 px-3 text-center font-mono text-[11px] text-slate-400">
            ${u.assignedLocation || 'ALL'}
          </td>
          <td class="py-3 px-3 text-center">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${u.status === 'Active' ? 'bg-emerald-500/15 text-emerald-400' : 'bg-rose-500/15 text-rose-400'}">
              ${u.status}
            </span>
          </td>
          <td class="py-3 px-4 text-right space-x-1 whitespace-nowrap">
            <button onclick="adminApp.openUserModal('${u.id}')" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 transition cursor-pointer">Edit</button>
            <button onclick="adminApp.confirmDeleteUser('${u.id}', '${u.name.replace(/'/g, "\\'")}')" class="px-2 py-1 text-xs font-semibold rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 transition cursor-pointer">Delete</button>
          </td>
        </tr>
      `;
    }).join('');
  },

  openUserModal(userId = null) {
    const modal = document.getElementById('userModal');
    if (!modal) return;
    const title = document.getElementById('userModalTitle');

    // Populate Org Select
    const orgSelect = document.getElementById('userOrgSelect');
    if (orgSelect) {
      orgSelect.innerHTML = this.state.organizations.map(o => `<option value="${o.id}">${o.name} (${o.id})</option>`).join('');
    }

    if (userId) {
      const u = this.state.users.find(x => x.id === userId);
      if (!u) return;
      title.innerText = 'Edit User: ' + u.name;
      document.getElementById('userModalId').value = u.id;
      document.getElementById('userNameInput').value = u.name;
      document.getElementById('userEmailInput').value = u.email;
      if (orgSelect) orgSelect.value = u.orgId;
      document.getElementById('userRoleSelect').value = u.role;
      document.getElementById('userLocationInput').value = u.assignedLocation || 'ALL';
      document.getElementById('userStatusSelect').value = u.status;
      document.getElementById('userPasswordInput').value = '';
      document.getElementById('userPasswordInput').placeholder = 'Leave blank to keep existing password';
    } else {
      title.innerText = 'Add Global Platform User';
      document.getElementById('userModalId').value = 'NEW';
      document.getElementById('userNameInput').value = '';
      document.getElementById('userEmailInput').value = '';
      document.getElementById('userRoleSelect').value = 'Staff';
      document.getElementById('userLocationInput').value = 'ALL';
      document.getElementById('userStatusSelect').value = 'Active';
      document.getElementById('userPasswordInput').value = '';
      document.getElementById('userPasswordInput').placeholder = 'Initial password (default: Admin@123)';
    }

    modal.classList.remove('hidden');
  },

  closeUserModal() {
    const modal = document.getElementById('userModal');
    if (modal) modal.classList.add('hidden');
  },

  async submitUserForm(e) {
    if (e) e.preventDefault();
    const id = document.getElementById('userModalId').value;
    const name = document.getElementById('userNameInput').value.trim();
    const email = document.getElementById('userEmailInput').value.trim();
    const orgId = document.getElementById('userOrgSelect').value;
    const role = document.getElementById('userRoleSelect').value;
    const assignedLocation = document.getElementById('userLocationInput').value.trim().toUpperCase();
    const status = document.getElementById('userStatusSelect').value;
    const password = document.getElementById('userPasswordInput').value.trim();

    if (!name || !email) {
      this.showToast('Name and Email are required.', 'error');
      return;
    }

    try {
      const res = await fetch('/api/platform/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, name, email, orgId, role, assignedLocation, status, password })
      });
      const data = await res.json();
      if (data.success) {
        this.showToast(`User "${name}" saved successfully!`, 'success');
        this.closeUserModal();
        this.state.users = data.users || [];
        this.renderUsersTable();
        this.fetchOverview();
        this.fetchAuditLogs();
      } else {
        this.showToast(data.error || 'Failed to save user', 'error');
      }
    } catch (err) {
      this.showToast('Network error: ' + err.message, 'error');
    }
  },

  async confirmDeleteUser(userId, userName) {
    if (!confirm(`Are you sure you want to delete user "${userName}" [${userId}]?`)) return;

    try {
      const res = await fetch(`/api/platform/users/${userId}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) {
        this.showToast(`User [${userId}] deleted`, 'success');
        this.state.users = data.users || [];
        this.renderUsersTable();
        this.fetchOverview();
        this.fetchAuditLogs();
      } else {
        this.showToast(data.error || 'Failed to delete user', 'error');
      }
    } catch (err) {
      this.showToast('Network error: ' + err.message, 'error');
    }
  },

  // ================================================================
  // DATABASE DIAGNOSTICS & SQL CONSOLE
  // ================================================================
  renderDatabaseDiagnostics() {
    const diag = this.state.diagnostics || {};
    const tables = diag.tables || [];
    const container = document.getElementById('dbTablesGrid');
    if (!container) return;

    container.innerHTML = tables.map(t => `
      <div class="control-card p-4 flex items-center justify-between border border-white/10 hover:border-indigo-500/40 transition">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-mono font-bold text-xs">
            <span class="material-symbols-outlined text-[18px]">table_chart</span>
          </div>
          <div>
            <div class="font-bold text-white text-xs font-mono">${t.name}</div>
            <div class="text-[11px] text-slate-500">${t.status} &bull; SQLite Table</div>
          </div>
        </div>
        <div class="text-right font-mono">
          <div class="text-sm font-bold text-indigo-300">${t.rowCount.toLocaleString()}</div>
          <div class="text-[10px] text-slate-500">rows</div>
        </div>
      </div>
    `).join('');
  },

  async runSqlQuery() {
    const input = document.getElementById('sqlConsoleInput');
    if (!input) return;
    const query = input.value.trim();
    if (!query) {
      this.showToast('Please enter a SQL statement.', 'error');
      return;
    }

    const outputContainer = document.getElementById('sqlOutputContainer');
    if (outputContainer) outputContainer.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs"><span class="inline-block w-4 h-4 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin mr-2"></span>Executing query on D1...</div>`;

    try {
      const res = await fetch('/api/platform/database/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });
      const data = await res.json();

      if (!data.success) {
        if (outputContainer) {
          outputContainer.innerHTML = `
            <div class="p-4 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs text-rose-300">
              <div class="font-bold flex items-center gap-2 mb-1"><span class="material-symbols-outlined text-[16px]">error</span> SQL Execution Error (${data.durationMs}ms)</div>
              <div class="font-mono text-[11px]">${data.error}</div>
            </div>
          `;
        }
        return;
      }

      // Render Result Table
      const cols = data.columns || [];
      const rows = data.results || [];

      let tableHtml = `
        <div class="space-y-2">
          <div class="flex items-center justify-between text-[11px] text-slate-400 px-1 font-mono">
            <span>Returned ${data.rowCount} rows in <b class="text-emerald-400">${data.durationMs}ms</b></span>
            <span>Query: ${data.query.slice(0, 45)}...</span>
          </div>
          <div class="overflow-x-auto rounded-xl border border-white/10 max-h-[360px] overflow-y-auto">
            <table class="w-full text-left text-xs border-collapse font-mono">
              <thead class="bg-white/5 text-slate-400 uppercase text-[10px] sticky top-0 backdrop-blur-md">
                <tr>${cols.map(c => `<th class="py-2.5 px-3 border-b border-white/10">${c}</th>`).join('')}</tr>
              </thead>
              <tbody class="divide-y divide-white/5 text-slate-300">
                ${rows.map(r => `
                  <tr class="hover:bg-white/[0.04] transition">
                    ${cols.map(c => `<td class="py-2 px-3 truncate max-w-xs">${r[c] !== null ? r[c] : '<i class="text-slate-600">NULL</i>'}</td>`).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      if (outputContainer) outputContainer.innerHTML = tableHtml;
      this.fetchAuditLogs();
    } catch (err) {
      if (outputContainer) {
        outputContainer.innerHTML = `<div class="p-4 bg-rose-500/10 text-rose-300 rounded-xl text-xs">Error: ${err.message}</div>`;
      }
    }
  },

  // ================================================================
  // AUDIT LOGS
  // ================================================================
  renderAuditLogsTable() {
    const tbody = document.getElementById('auditLogsTableBody');
    if (!tbody) return;

    const logs = this.state.auditLogs || [];
    if (logs.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-500 text-xs">No audit events logged yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = logs.map(l => {
      const timeStr = l.timestamp ? new Date(l.timestamp).toLocaleTimeString() + ' ' + new Date(l.timestamp).toLocaleDateString() : '--';
      const sevColor = l.severity === 'error' ? 'bg-rose-500/20 text-rose-300 border-rose-500/30' : l.severity === 'warning' ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' : 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30';

      return `
        <tr class="hover:bg-white/[0.02] border-b border-white/5 text-slate-300 text-xs">
          <td class="py-2.5 px-3 font-mono text-[11px] text-slate-500 whitespace-nowrap">${timeStr}</td>
          <td class="py-2.5 px-3">
            <span class="px-2 py-0.5 rounded-md text-[10px] font-bold border ${sevColor} font-mono">${l.event_type}</span>
          </td>
          <td class="py-2.5 px-3 font-semibold text-white">${l.actor_email || 'system'}</td>
          <td class="py-2.5 px-3 font-mono text-[11px] text-slate-400">${l.tenant_id || '--'}</td>
          <td class="py-2.5 px-4 text-slate-400 text-xs truncate max-w-md" title="${l.details}">${l.details}</td>
        </tr>
      `;
    }).join('');
  },

  // ================================================================
  // TOAST NOTIFICATIONS
  // ================================================================
  showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    if (!container) return;

    const toast = document.createElement('div');
    const border = type === 'error' ? 'border-rose-500 bg-rose-950/80 text-rose-200' : type === 'success' ? 'border-emerald-500 bg-emerald-950/80 text-emerald-200' : 'border-indigo-500 bg-indigo-950/80 text-indigo-200';
    const icon = type === 'error' ? 'error' : type === 'success' ? 'check_circle' : 'info';

    toast.className = `flex items-center gap-2.5 px-4 py-3 rounded-xl border shadow-xl text-xs font-semibold backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${border}`;
    toast.innerHTML = `<span class="material-symbols-outlined text-[18px]">${icon}</span><span>${message}</span>`;

    container.appendChild(toast);
    setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-y-2');
      setTimeout(() => toast.remove(), 300);
    }, 4000);
  },

  async logout() {
    if (!confirm('Sign out of Platform SuperAdmin Control Plane?')) return;
    try {
      await fetch('/api/auth/logout', { method: 'POST' });
    } catch (e) {}
    window.location.reload();
  }
};

window.addEventListener('DOMContentLoaded', () => {
  adminApp.init();
});
</script>
