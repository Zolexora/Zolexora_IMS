<style>
  @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200');

  html {
    font-size: 80% !important; /* Scaled up 5% from previous size proportionally */
    scroll-behavior: smooth;
  }

  @layer base {
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #e1e2ed;
      font-family: Cambria, 'Cambria Math', 'Calisto MT', Georgia, serif;
    }
    body {
      overscroll-behavior: none;
      font-family: Cambria, 'Cambria Math', 'Calisto MT', Georgia, serif;
    }
    button, input, select, textarea {
      font-family: inherit;
    }
  }

  /* Proportional scaling for explicit pixel font utility classes (+5%) */
  .text-\[9px\] { font-size: 7.1px !important; }
  .text-\[10px\] { font-size: 7.9px !important; }
  .text-\[11px\] { font-size: 8.7px !important; }
  .text-\[12px\] { font-size: 9.5px !important; }
  .text-\[13px\] { font-size: 10.25px !important; }
  .text-\[14px\] { font-size: 11px !important; }
  .text-\[15px\] { font-size: 11.8px !important; }
  .text-\[16px\] { font-size: 12.6px !important; }
  .text-\[18px\] { font-size: 14.2px !important; }
  .text-\[20px\] { font-size: 15.8px !important; }
  .text-\[22px\] { font-size: 17.3px !important; }
  .text-\[24px\] { font-size: 19px !important; }
  .text-\[28px\] { font-size: 22px !important; }
  .text-\[32px\] { font-size: 25.2px !important; }

  /* 5px gap between all card grid containers */
  .gap-\[5px\] {
    gap: 5px !important;
  }

  /* ============================================================== */
  /* DASHBOARD: DARK BLACK BACKGROUND, THIN WHITE BORDER & MEDIUM CONTRAST */
  /* ============================================================== */
  #appDashboardContainer {
    background-color: #000000 !important;
    color: #e5e7eb !important;
  }

  #appDashboardContainer aside {
    background-color: #050507 !important;
    border-right: 1px solid rgba(255, 255, 255, 0.12) !important;
  }

  #appDashboardContainer header {
    background-color: rgba(4, 4, 6, 0.95) !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12) !important;
    backdrop-filter: blur(12px) !important;
  }

  /* Main background inside dashboard */
  #appDashboardContainer .bg-surface,
  #appDashboardContainer .bg-surface-container,
  #appDashboardContainer .bg-surface-container-low,
  #appDashboardContainer .bg-surface-container-high,
  #appDashboardContainer .bg-surface-container-highest {
    background-color: #08080b !important;
  }

  #appDashboardContainer .bg-surface-container-lowest {
    background-color: #020203 !important;
  }

  /* Crisp thin white borders on all containers & cards in dashboard */
  #appDashboardContainer .border,
  #appDashboardContainer .border-t,
  #appDashboardContainer .border-b,
  #appDashboardContainer .border-l,
  #appDashboardContainer .border-r,
  #appDashboardContainer [class*="border-outline"] {
    border-color: rgba(255, 255, 255, 0.12) !important;
  }

  #appDashboardContainer .rounded-xl,
  #appDashboardContainer .rounded-2xl,
  #appDashboardContainer .rounded-lg {
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  /* Medium contrast text styling inside dashboard */
  #appDashboardContainer .text-on-surface {
    color: #f9fafb !important;
  }

  #appDashboardContainer .text-on-surface-variant {
    color: #9ca3af !important;
  }

  #appDashboardContainer .text-outline {
    color: #6b7280 !important;
  }

  /* Inputs, selects, and textareas inside dashboard */
  #appDashboardContainer input,
  #appDashboardContainer select,
  #appDashboardContainer textarea {
    background-color: #050507 !important;
    border: 1px solid rgba(255, 255, 255, 0.15) !important;
    color: #f3f4f6 !important;
  }

  #appDashboardContainer input:focus,
  #appDashboardContainer select:focus,
  #appDashboardContainer textarea:focus {
    border-color: rgba(255, 255, 255, 0.35) !important;
    outline: none !important;
  }

  /* Table styling inside dashboard with medium contrast and thin white borders */
  #appDashboardContainer table {
    border-collapse: separate;
    border-spacing: 0;
  }

  #appDashboardContainer th {
    background-color: #060608 !important;
    color: #d1d5db !important;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12) !important;
    font-weight: 600;
  }

  #appDashboardContainer td {
    border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    color: #e5e7eb !important;
  }

  #appDashboardContainer tr:hover td {
    background-color: rgba(255, 255, 255, 0.03) !important;
  }

  /* Modal boxes with dark black background & thin white border */
  .modal-box,
  #itemModal > div:last-child,
  #stockInModal > div:last-child,
  #stockOutModal > div:last-child,
  #transferModal > div:last-child,
  #barcodeModal > div:last-child,
  #scannerModal > div:last-child,
  #supplierModal > div:last-child,
  #orgModal > div:last-child {
    background-color: #07070a !important;
    border: 1px solid rgba(255, 255, 255, 0.16) !important;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9) !important;
  }

  /* Custom dark scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #11131b;
  }
  ::-webkit-scrollbar-thumb {
    background: #282a32;
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #434655;
  }

  /* Material Symbols icon sizing helper */
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    user-select: none;
  }
  .material-symbols-outlined.fill {
    font-variation-settings: 'FILL' 1;
  }

  /* Modal Backdrop */
  .modal-backdrop {
    background-color: rgba(12, 14, 22, 0.82);
    backdrop-filter: blur(8px);
    transition: opacity 0.2s ease-in-out;
  }

  /* Toast Animation */
  @keyframes slideInRight {
    from {
      transform: translateX(100%);
      opacity: 0;
    }
    to {
      transform: translateX(0);
      opacity: 1;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: scale(0.97);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .toast-enter {
    animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Print specific formatting for Barcode Labels */
  @media print {
    body * {
      visibility: hidden;
    }
    #printableBarcodeArea, #printableBarcodeArea * {
      visibility: visible;
    }
    #printableBarcodeArea {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: white !important;
      color: black !important;
    }
    .no-print {
      display: none !important;
    }
  }
</style>
