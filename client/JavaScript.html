  addTransferInvoiceRow: function(defaultItemId = null) {
    this.transferInvoiceCounter++;
    const rowId = 'ti_row_' + this.transferInvoiceCounter;
    const categories = this.getItemCategories();
    const items = this.state.items || [];
    const fromStoreCode = document.getElementById('tiFromStore') ? document.getElementById('tiFromStore').value : 'S_000';

    let targetItem = null;
    if (defaultItemId) {
      targetItem = items.find(i => i.id === defaultItemId || i.code === defaultItemId);
    }

    const selectedCategory = targetItem ? targetItem.category : 'ALL';
    const filteredItems = (selectedCategory && selectedCategory !== 'ALL')
      ? items.filter(i => String(i.category).trim() === selectedCategory)
      : items;

    const rowObj = {
      id: rowId,
      selectedCategory: selectedCategory,
      selectedItemCode: targetItem ? (targetItem.code || targetItem.id) : (filteredItems[0] ? (filteredItems[0].code || filteredItems[0].id) : ''),
      qty: 1
    };
    this.transferInvoiceRows.push(rowObj);

    const activeItem = items.find(i => (i.code || i.id) === rowObj.selectedItemCode) || filteredItems[0] || {};
    const rate = activeItem.rate || activeItem.cost || 0;
    const uom = activeItem.uom || activeItem.unit || 'Pcs';
    const code = activeItem.code || activeItem.id || '';

    let avail = 0;
    if (fromStoreCode.includes('S_001')) avail = activeItem.stockS001 || 0;
    else if (fromStoreCode.includes('S_002')) avail = activeItem.stockS002 || 0;
    else avail = activeItem.centralStock || 0;

    const tr = document.createElement('tr');
    tr.id = rowId;
    tr.className = 'border-b border-white/5 hover:bg-white/[0.02] transition';

    tr.innerHTML = `
      <td class="py-2 px-2 text-center text-on-surface-variant font-mono text-[11px] row-number">${this.transferInvoiceRows.length}</td>
      <td class="py-2 px-2">
        <select onchange="app.onTiCategoryChange('${rowId}')" class="ti-cat-select w-full px-2 py-1.5 bg-[#0a0a0e] border border-white/15 rounded text-xs text-white focus:border-primary outline-none">
          <option value="ALL">-- All Categories --</option>
          ${categories.map(c => `<option value="${c}" ${c === selectedCategory ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
      </td>
      <td class="py-2 px-2">
        <select onchange="app.onTiProductChange('${rowId}')" class="ti-prod-select w-full px-2 py-1.5 bg-[#0a0a0e] border border-white/15 rounded text-xs text-white focus:border-primary outline-none">
          ${filteredItems.map(i => `<option value="${i.code || i.id}" ${(i.code || i.id) === rowObj.selectedItemCode ? 'selected' : ''}>[${i.code || i.id}] ${i.name || i.description}</option>`).join('')}
        </select>
      </td>
      <td class="py-2 px-2">
        <input type="text" readonly value="${code}" class="ti-code-input w-full px-2 py-1.5 bg-[#040406] border border-white/10 rounded text-[11px] font-mono font-bold text-on-surface-variant outline-none">
      </td>
      <td class="py-2 px-2 text-center">
        <span class="ti-avail-badge inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-primary/10 text-primary border border-primary/20">${avail} ${uom}</span>
      </td>
      <td class="py-2 px-2">
        <input type="text" readonly value="${uom}" class="ti-uom-input w-full px-1.5 py-1.5 bg-[#040406] border border-white/10 rounded text-[11px] text-center text-on-surface-variant outline-none">
      </td>
      <td class="py-2 px-2">
        <input type="number" step="0.01" min="0" value="${rate}" oninput="app.recalcTiInvoice()" class="ti-rate-input w-full px-2 py-1.5 bg-[#0a0a0e] border border-white/15 rounded text-xs font-mono text-white text-right focus:border-primary outline-none">
      </td>
      <td class="py-2 px-2">
        <input type="number" min="1" value="1" oninput="app.recalcTiInvoice()" class="ti-qty-input w-full px-2 py-1.5 bg-[#0a0a0e] border border-primary/40 rounded text-xs font-mono font-bold text-primary text-right focus:border-primary outline-none">
      </td>
      <td class="py-2 px-2 text-right font-mono font-bold text-xs text-primary ti-total-display">₹0.00</td>
      <td class="py-2 px-2 text-center">
        <button type="button" onclick="app.removeTiRow('${rowId}')" title="Remove item" class="text-on-surface-variant hover:text-error transition font-bold px-1.5 py-0.5 rounded cursor-pointer">&times;</button>
      </td>
    `;

    const tbody = document.getElementById('tiTableBody');
    if (tbody) tbody.appendChild(tr);

    this.recalcTiInvoice();
  },

  onTiCategoryChange: function(rowId) {
    const tr = document.getElementById(rowId);
    if (!tr) return;
    const catSelect = tr.querySelector('.ti-cat-select');
    const prodSelect = tr.querySelector('.ti-prod-select');
    if (!catSelect || !prodSelect) return;

    const selectedCategory = catSelect.value;
    const items = this.state.items || [];
    const filtered = (selectedCategory && selectedCategory !== 'ALL')
      ? items.filter(i => String(i.category).trim() === selectedCategory)
      : items;

    if (filtered.length === 0) {
      prodSelect.innerHTML = `<option value="">-- No products in this category --</option>`;
    } else {
      prodSelect.innerHTML = filtered.map(i => `<option value="${i.code || i.id}">[${i.code || i.id}] ${i.name || i.description}</option>`).join('');
    }

    this.onTiProductChange(rowId);
  },

  onTiProductChange: function(rowId) {
    const tr = document.getElementById(rowId);
    if (!tr) return;
    const prodSelect = tr.querySelector('.ti-prod-select');
    const codeInput = tr.querySelector('.ti-code-input');
    const uomInput = tr.querySelector('.ti-uom-input');
    const rateInput = tr.querySelector('.ti-rate-input');
    const availBadge = tr.querySelector('.ti-avail-badge');
    const fromStoreCode = document.getElementById('tiFromStore') ? document.getElementById('tiFromStore').value : 'S_000';

    if (!prodSelect) return;
    const itemCode = prodSelect.value;
    const item = (this.state.items || []).find(i => (i.code || i.id) === itemCode);

    if (item) {
      if (codeInput) codeInput.value = item.code || item.id || '';
      const uom = item.uom || item.unit || 'Pcs';
      if (uomInput) uomInput.value = uom;
      if (rateInput) rateInput.value = item.rate || item.cost || 0;

      let avail = 0;
      if (fromStoreCode.includes('S_001')) avail = item.stockS001 || 0;
      else if (fromStoreCode.includes('S_002')) avail = item.stockS002 || 0;
      else avail = item.centralStock || 0;

      if (availBadge) availBadge.innerText = `${avail} ${uom}`;
    }

    this.recalcTiInvoice();
  },

  onTiFromStoreChange: function() {
    const tbody = document.getElementById('tiTableBody');
    if (!tbody) return;
    const rows = tbody.querySelectorAll('tr');
    rows.forEach(tr => {
      this.onTiProductChange(tr.id);
    });
  },

  recalcTiInvoice: function() {
    const tbody = document.getElementById('tiTableBody');
    if (!tbody) return;
    const rows = tbody.querySelectorAll('tr');

    let totalTransferVal = 0;
    let itemCount = 0;

    rows.forEach((tr, index) => {
      const numEl = tr.querySelector('.row-number');
      if (numEl) numEl.innerText = index + 1;

      const rateInput = tr.querySelector('.ti-rate-input');
      const qtyInput = tr.querySelector('.ti-qty-input');
      const totalEl = tr.querySelector('.ti-total-display');

      const rate = parseFloat(rateInput ? rateInput.value : 0) || 0;
      const qty = parseFloat(qtyInput ? qtyInput.value : 0) || 0;
      const total = rate * qty;

      if (totalEl) totalEl.innerText = app.formatCurrency(total);
      if (qty > 0) itemCount++;
      totalTransferVal += total;
    });

    const itemsCountEl = document.getElementById('tiTotalItems');
    if (itemsCountEl) itemsCountEl.innerText = `${itemCount} items`;

    const payableEl = document.getElementById('tiPayableAmount');
    if (payableEl) payableEl.innerText = app.formatCurrency(totalTransferVal);
  },

  removeTiRow: function(rowId) {
    const tr = document.getElementById(rowId);
    if (tr) tr.remove();
    this.transferInvoiceRows = this.transferInvoiceRows.filter(r => r.id !== rowId);

    const tbody = document.getElementById('tiTableBody');
    if (tbody && tbody.children.length === 0) {
      this.addTransferInvoiceRow();
    } else {
      this.recalcTiInvoice();
    }
  },

  saveTransferInvoice: function() {
    const invoiceNo = document.getElementById('tiInvoiceNo').value.trim();
    if (!invoiceNo) {
      this.showToast('Please enter a Transfer Invoice Number.', 'error');
      return;
    }
    if (!invoiceNo.startsWith('InvN_')) {
      this.showToast('Transfer Invoice Number must start with InvN_ prefix.', 'error');
      return;
    }

    const date = document.getElementById('tiDate').value;
    if (!date) {
      this.showToast('Please select a Transfer Date.', 'error');
      return;
    }

    const fromStoreSelect = document.getElementById('tiFromStore');
    const fromStoreCode = fromStoreSelect ? fromStoreSelect.value : 'S_000';
    const fromStoreName = fromStoreSelect && fromStoreSelect.options[fromStoreSelect.selectedIndex] ? fromStoreSelect.options[fromStoreSelect.selectedIndex].text : 'Central Depot';

    const spSelect = document.getElementById('tiSellingPoint');
    const toSellingPointCode = spSelect ? spSelect.value : 'SP_001';
    const toSellingPointName = spSelect && spSelect.options[spSelect.selectedIndex] ? spSelect.options[spSelect.selectedIndex].text : 'Selling Point';

    if (fromStoreCode === toSellingPointCode) {
      this.showToast('Source store and destination selling point cannot be the same store.', 'error');
      return;
    }

    const notes = document.getElementById('tiNotes').value.trim();
    const dispatcher = document.getElementById('tiDispatcher').value.trim() || 'Store Keeper';

    const tbody = document.getElementById('tiTableBody');
    const rows = tbody ? tbody.querySelectorAll('tr') : [];
    const items = [];

    for (let i = 0; i < rows.length; i++) {
      const tr = rows[i];
      const prodSelect = tr.querySelector('.ti-prod-select');
      const catSelect = tr.querySelector('.ti-cat-select');
      const codeInput = tr.querySelector('.ti-code-input');
      const uomInput = tr.querySelector('.ti-uom-input');
      const rateInput = tr.querySelector('.ti-rate-input');
      const qtyInput = tr.querySelector('.ti-qty-input');

      const itemCode = codeInput ? codeInput.value : (prodSelect ? prodSelect.value : '');
      const itemName = prodSelect && prodSelect.options[prodSelect.selectedIndex] ? prodSelect.options[prodSelect.selectedIndex].text : itemCode;
      const category = catSelect ? catSelect.value : '';
      const uom = uomInput ? uomInput.value : 'Pcs';
      const rate = parseFloat(rateInput ? rateInput.value : 0) || 0;
      const quantity = parseFloat(qtyInput ? qtyInput.value : 0) || 0;

      if (itemCode && quantity > 0) {
        // Validate stock availability
        const prodObj = (this.state.items || []).find(it => (it.code || it.id) === itemCode);
        if (prodObj) {
          let avail = 0;
          if (fromStoreCode.includes('S_001')) avail = prodObj.stockS001 || 0;
          else if (fromStoreCode.includes('S_002')) avail = prodObj.stockS002 || 0;
          else avail = prodObj.centralStock || 0;

          if (avail < quantity) {
            this.showToast(`Insufficient stock in ${fromStoreName} for ${prodObj.name || itemCode}. Available: ${avail}, Requested: ${quantity}`, 'error');
            return;
          }
        }

        items.push({
          itemCode: itemCode,
          itemName: itemName,
          category: category,
          uom: uom,
          rate: rate,
          quantity: quantity
        });
      }
    }

    if (items.length === 0) {
      this.showToast('Please add at least one item with transfer quantity greater than 0.', 'error');
      return;
    }

    const payload = {
      invoiceNo: invoiceNo,
      date: date,
      fromStoreCode: fromStoreCode,
      fromStoreName: fromStoreName,
      toSellingPointCode: toSellingPointCode,
      toSellingPointName: toSellingPointName,
      notes: notes,
      performedBy: dispatcher,
      items: items
    };

    this.showLoading('Saving Transfer Invoice...', `Recording ${items.length} items to database & updating store ledgers`);

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(res) {
          app.hideLoading();
          if (res && res.success) {
            app.closeModal('transferInvoiceModal');
            app.showToast(`Transfer Invoice ${res.invoiceNo} saved! Valuation: ${app.formatCurrency(res.payableAmount)}`);
            if (res.data) {
              app.showDashboard(res.data);
            } else {
              app.loadInitialData(true);
            }
          } else {
            app.showToast((res && res.message) ? res.message : 'Failed to save transfer invoice.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Transfer Save Error: ' + err.message, 'error');
        })
        .recordTransferInvoice(payload);
    } else {
      setTimeout(() => {
        app.hideLoading();
        app.closeModal('transferInvoiceModal');
        app.showToast(`Transfer Invoice ${payload.invoiceNo} saved (local mode)!`);
      }, 500);
    }
  },

  // ADJUSTMENT MODAL
  openAdjustmentModal: function(defaultItemId = null) {
    document.getElementById('adjustmentForm').reset();
    if (defaultItemId) {
      document.getElementById('adjItemId').value = defaultItemId;
    }
    this.updateAdjustmentItemInfo();
    this.openModal('adjustmentModal');
  },

  updateAdjustmentItemInfo: function() {
    const itemId = document.getElementById('adjItemId').value;
    const loc = document.getElementById('adjLocation').value;
    const item = this.state.items.find(i => i.id === itemId);
    const infoEl = document.getElementById('adjDiscrepancyInfo');

    if (!item || !infoEl) return;

    let current = 0;
    if (loc.includes('Central')) current = item.centralStock || 0;
    else if (loc.includes('S_001') || loc.includes('Store 1')) current = item.stockS001 || 0;
    else if (loc.includes('S_002') || loc.includes('Store 2')) current = item.stockS002 || 0;

    infoEl.innerHTML = `System recorded stock at <span class="font-bold text-slate-800">${loc}</span>: <span class="font-bold text-purple-700">${current} ${item.unit}</span>. Entering a physical count will recalculate discrepancy automatically.`;
  },

  handleAdjustmentSubmit: function(e) {
    e.preventDefault();
    const data = {
      type: 'ADJUSTMENT',
      itemId: document.getElementById('adjItemId').value,
      sourceLocation: document.getElementById('adjLocation').value,
      countedQuantity: Number(document.getElementById('adjCountedQty').value),
      reference: 'AUDIT-' + new Date().toISOString().slice(0, 10),
      performedBy: 'Internal Auditor',
      notes: document.getElementById('adjReason').value + ' | ' + document.getElementById('adjNotes').value.trim()
    };

    this.showLoading('Saving Audit Adjustment...', 'Calibrating stock records');

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(res) {
          app.hideLoading();
          app.closeModal('adjustmentModal');
          app.showToast('Physical audit count reconciled successfully.');
          app.loadInitialData(true);
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Adjustment error: ' + err.message, 'error');
        })
        .processStockTransaction(data);
    } else {
      this.hideLoading();
      this.closeModal('adjustmentModal');
      this.showToast('Adjustment saved (local mode)');
    }
  },

  // BARCODE LABEL MODAL & JSBARCODE
  openBarcodeModal: function(itemId) {
    const item = this.state.items.find(i => i.id === itemId);
    if (!item) return;

    document.getElementById('barcodeLabelName').innerText = item.name;
    document.getElementById('barcodeLabelCategory').innerText = item.category;
    document.getElementById('barcodeLabelSku').innerText = item.sku;
    document.getElementById('barcodeLabelCost').innerText = this.formatCurrency(item.unitCost);

    try {
      JsBarcode('#barcodeSvg', item.sku, {
        format: 'CODE128',
        lineColor: '#0f172a',
        width: 2,
        height: 55,
        displayValue: true,
        fontSize: 12,
        font: 'Plus Jakarta Sans',
        margin: 5
      });
    } catch (e) {
      console.error('Barcode generation error', e);
    }

    this.openModal('barcodeModal');
  },

  // LIVE CAMERA BARCODE SCANNER
  openScannerModal: function() {
    this.openModal('scannerModal');
    const viewport = document.getElementById('scannerViewport');

    if (typeof Html5Qrcode !== 'undefined') {
      try {
        if (!this.state.html5QrScanner) {
          this.state.html5QrScanner = new Html5Qrcode('scannerViewport');
        }

        const config = { fps: 10, qrbox: { width: 250, height: 160 } };
        this.state.html5QrScanner.start(
          { facingMode: 'environment' },
          config,
          (decodedText) => {
            app.handleScanSuccess(decodedText);
          },
          (error) => {
            // Scanning in progress
          }
        ).catch(err => {
          console.warn('Camera scan not started or permission denied', err);
          viewport.innerHTML = `<div class="p-4 text-center text-slate-300">Camera not accessible or permission denied. Please enter SKU manually below.</div>`;
        });
      } catch (err) {
        console.error('Scanner init error', err);
      }
    }
  },

  closeScannerModal: function() {
    if (this.state.html5QrScanner && this.state.html5QrScanner.isScanning) {
      this.state.html5QrScanner.stop().then(() => {
        app.closeModal('scannerModal');
      }).catch(() => {
        app.closeModal('scannerModal');
      });
    } else {
      this.closeModal('scannerModal');
    }
  },

  handleScanSuccess: function(decodedText) {
    this.closeScannerModal();
    this.processScannedCode(decodedText);
  },

  handleManualScanSubmit: function() {
    const input = document.getElementById('manualBarcodeInput');
    const val = (input ? input.value : '').trim();
    if (!val) return;
    this.closeScannerModal();
    this.processScannedCode(val);
  },

  processScannedCode: function(code) {
    const clean = code.trim().toUpperCase();
    const item = this.state.items.find(i => 
      (i.sku && i.sku.toUpperCase() === clean) || 
      (i.id && i.id.toUpperCase() === clean)
    );

    if (item) {
      this.showToast(`Found Item: ${item.name} (${item.sku})`);
      this.switchTab('inventory');
      const search = document.getElementById('catalogSearchInput');
      if (search) {
        search.value = item.sku;
        this.filterCatalog();
      }
    } else {
      if (confirm(`Scanned SKU "${code}" was not found in catalog. Would you like to create a new item with this SKU?`)) {
        this.openItemModal();
        document.getElementById('itemSku').value = clean;
      }
    }
  },

  // SUPPLIERS MODAL
  openSupplierModal: function(sup = null) {
    const form = document.getElementById('supplierForm');
    form.reset();

    if (sup) {
      document.getElementById('supplierId').value = sup.id;
      document.getElementById('supplierName').value = sup.name;
      document.getElementById('supplierContact').value = sup.contactPerson;
      document.getElementById('supplierPhone').value = sup.phone;
      document.getElementById('supplierEmail').value = sup.email;
      document.getElementById('supplierCategories').value = sup.categorySupplied;
      document.getElementById('supplierAddress').value = sup.address;
    } else {
      document.getElementById('supplierId').value = '';
    }

    this.openModal('supplierModal');
  },

  editSupplier: function(supId) {
    const s = this.state.suppliers.find(x => x.id === supId);
    if (s) this.openSupplierModal(s);
  },

  handleSupplierFormSubmit: function(e) {
    e.preventDefault();
    const data = {
      id: document.getElementById('supplierId').value,
      name: document.getElementById('supplierName').value.trim(),
      contactPerson: document.getElementById('supplierContact').value.trim(),
      phone: document.getElementById('supplierPhone').value.trim(),
      email: document.getElementById('supplierEmail').value.trim(),
      categorySupplied: document.getElementById('supplierCategories').value.trim(),
      address: document.getElementById('supplierAddress').value.trim(),
      status: 'Active'
    };

    this.showLoading('Saving Supplier...', 'Updating vendor directory in Sheets');

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function() {
          app.hideLoading();
          app.closeModal('supplierModal');
          app.showToast('Supplier saved: ' + data.name);
          app.loadInitialData(true);
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Supplier save error: ' + err.message, 'error');
        })
        .saveSupplier(data);
    } else {
      this.hideLoading();
      this.closeModal('supplierModal');
      this.showToast('Supplier saved (local mode)');
    }
  },

  confirmDeleteSupplier: function(supId) {
    if (!confirm('Are you sure you want to remove this supplier?')) return;
    this.showLoading('Deleting Supplier...', 'Updating vendor sheet');

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function() {
          app.hideLoading();
          app.showToast('Supplier removed');
          app.loadInitialData(true);
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Delete error: ' + err.message, 'error');
        })
        .deleteSupplier(supId);
    } else {
      this.hideLoading();
      this.showToast('Supplier removed (local mode)');
    }
  },

  // CSV EXPORTERS
  exportCatalogCSV: function() {
    if (!this.state.items || this.state.items.length === 0) {
      this.showToast('No items to export.', 'error');
      return;
    }

    const headers = ['Item ID', 'SKU', 'Item Name', 'Category', 'Unit', 'Central Stock', 'Store 1 Stock', 'Store 2 Stock', 'Total Stock', 'Min Stock', 'Unit Cost', 'Total Valuation', 'Supplier'];
    const rows = this.state.items.map(i => [
      `"${i.id}"`,
      `"${i.sku}"`,
      `"${(i.name || '').replace(/"/g, '""')}"`,
      `"${i.category}"`,
      `"${i.unit}"`,
      i.centralStock || 0,
      i.stockS001 || 0,
      i.stockS002 || 0,
      i.totalStock || 0,
      i.minStock,
      i.unitCost,
      i.totalValue,
      `"${(i.supplier || '').replace(/"/g, '""')}"`
    ]);

    const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement('a');
    link.setAttribute('href', encodedUri);
    link.setAttribute('download', `Zolexora_IMS_Inventory_${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    this.showToast('Inventory catalog exported to CSV!');
  },

  exportTransactionsCSV: function() {
    if (!this.state.recentTransactions || this.state.recentTransactions.length === 0) {
      this.showToast('No transaction records to export.', 'error');
      return;
    }

    const headers = ['Transaction ID', 'Date Time', 'Type', 'SKU', 'Item Name', 'Quantity', 'Unit', 'Source', 'Destination', 'Total Cost', 'Reference', 'Staff', 'Notes'];
    const rows = this.state.recentTransactions.map(t => [
      `"${t.id}"`,
      `"${t.timestamp}"`,
      `"${t.type}"`,
      `"${t.sku}"`,
      `"${(t.itemName || '').replace(/"/g, '""')}"`,
      t.quantity,
      `"${t.unit || ''}"`,
      `"${t.sourceLocation || ''}"`,
      `"${t.destLocation || ''}"`,
      t.totalCost,
      `"${(t.reference || '').replace(/"/g, '""')}"`,
      `"${(t.performedBy || '').replace(/"/g, '""')}"`,
      `"${(t.notes || '').replace(/"/g, '""')}"`
    ]);

    const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement('a');
    link.setAttribute('href', encodedUri);
    link.setAttribute('download', `Zolexora_IMS_Transactions_${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    this.showToast('Transactions audit log exported to CSV!');
  },

  // Fallback empty data when previewing outside Google Apps Script
  getMockInitialData: function() {
    return {
      dbInfo: { id: '', name: 'Google Sheets Database', url: '#' },
      settings: { CURRENCY_SYMBOL: '₹', HOTEL_NAME: 'Zolexora IMS' },
      metrics: {
        totalSkus: 0,
        totalValuation: 0,
        totalUnits: 0,
        lowStockCount: 0,
        outOfStockCount: 0,
        stores: {},
        categoryBreakdown: {},
        lowStockItems: [],
        todaySummary: { txnCount: 0, stockIn: 0, stockOut: 0 }
      },
      items: [],
      suppliers: [],
      stores: [],
      sellingPoints: [],
      users: [],
      supplierTransactions: [],
      issuanceTransactions: [],
      recentTransactions: []
    };
  }
};

// Auto-run on DOM Ready
document.addEventListener('DOMContentLoaded', function() {
  app.init();
});
</script>
