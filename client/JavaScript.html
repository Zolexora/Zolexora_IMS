<script>
/**
 * Zolexora IMS - CLIENT APPLICATION LOGIC
 */

const app = {
  state: {
    dbInfo: {},
    metrics: {},
    items: [],
    suppliers: [],
    departments: [],
    locations: [],
    settings: { CURRENCY_SYMBOL: '₹', HOTEL_NAME: 'Zolexora IMS' },
    recentTransactions: [],
    activeTab: 'dashboard',
    propertyFilter: 'ALL',
    categoryChart: null,
    html5QrScanner: null
  },

  authUser: null,
  detectedGoogleEmail: null,

  // Initialize App
  init: function() {
    const stored = localStorage.getItem('zolexora_auth_user');
    if (stored) {
      try {
        const user = JSON.parse(stored);
        if (user && user.email) {
          this.state.authUser = user;
          this.showLoading('Connecting to Workspace...', 'Opening ' + (user.orgName || 'organization'));
          if (this.isGasEnv()) {
            google.script.run
              .withSuccessHandler(function(res) {
                app.hideLoading();
                if (res && res.success) {
                  app.state.authUser = res.user;
                  app.showDashboard(res.data);
                } else {
                  localStorage.removeItem('zolexora_auth_user');
                  app.showAuthView();
                }
              })
              .withFailureHandler(function(err) {
                app.hideLoading();
                app.showAuthView();
              })
              .checkUserSession(user.email, user.orgId);
            return;
          } else {
            this.hideLoading();
            this.showDashboard(this.getMockData());
            return;
          }
        }
      } catch (e) {
        localStorage.removeItem('zolexora_auth_user');
      }
    }
    this.showAuthView();
  },

  navigateTo: function(route) {
    const homeView = document.getElementById('commercialLandingView');
    const loginView = document.getElementById('loginPageView');
    const signupView = document.getElementById('signupPageView');
    const dashView = document.getElementById('appDashboardContainer');

    if (homeView) homeView.classList.add('hidden');
    if (loginView) loginView.classList.add('hidden');
    if (signupView) signupView.classList.add('hidden');
    if (dashView) dashView.classList.add('hidden');

    if (route === 'login') {
      if (loginView) loginView.classList.remove('hidden');
      const savedEmail = localStorage.getItem('zolexora_saved_email');
      const emailInp = document.getElementById('loginEmailInput');
      if (savedEmail && emailInp) {
        emailInp.value = savedEmail;
        const pwInp = document.getElementById('loginPasswordInput');
        if (pwInp) pwInp.focus();
      } else if (emailInp) {
        emailInp.focus();
      }
      window.scrollTo(0, 0);
    } else if (route === 'signup') {
      if (signupView) signupView.classList.remove('hidden');
      const savedEmail = localStorage.getItem('zolexora_saved_email');
      const regEmailInp = document.getElementById('regAdminEmail');
      if (savedEmail && regEmailInp && !regEmailInp.value) {
        regEmailInp.value = savedEmail;
      }
      const adminNameInp = document.getElementById('regAdminName');
      if (adminNameInp) adminNameInp.focus();
      window.scrollTo(0, 0);
    } else if (route === 'dashboard') {
      if (dashView) dashView.classList.remove('hidden');
      window.scrollTo(0, 0);
    } else {
      // default: home
      if (homeView) homeView.classList.remove('hidden');
      window.scrollTo(0, 0);
    }
  },

  showAuthView: function() {
    this.navigateTo('home');
  },

  openAuthModal: function(mode = 'signin') {
    this.navigateTo(mode === 'signup' ? 'signup' : 'login');
  },

  closeAuthModal: function() {
    this.navigateTo('home');
  },

  togglePasswordVisibility: function(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input) return;
    if (input.type === 'password') {
      input.type = 'text';
      if (icon) icon.innerText = 'visibility_off';
    } else {
      input.type = 'password';
      if (icon) icon.innerText = 'visibility';
    }
  },

  handleEmailPasswordLogin: function(e) {
    if (e) e.preventDefault();
    const email = document.getElementById('loginEmailInput').value.trim();
    const password = document.getElementById('loginPasswordInput').value.trim();

    if (!email || !password) {
      this.showToast('Please enter your email and password.', 'error');
      return;
    }

    const remember = document.getElementById('rememberEmailCheckbox') ? document.getElementById('rememberEmailCheckbox').checked : true;
    if (remember) {
      localStorage.setItem('zolexora_saved_email', email);
    } else {
      localStorage.removeItem('zolexora_saved_email');
    }

    this.showLoading('Signing in...', 'Verifying credentials against central Auth Registry');

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(res) {
          app.hideLoading();
          if (res && res.success) {
            app.state.authUser = res.user;
            localStorage.setItem('zolexora_auth_user', JSON.stringify(res.user));
            app.showDashboard(res.data);
            app.showToast('Welcome back, ' + (res.user.name || res.user.email) + '!');
          } else {
            app.showToast((res && res.message) ? res.message : 'Invalid credentials. Please verify and try again.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Login error: ' + err.message, 'error');
        })
        .loginUser({ email: email, password: password });
    } else {
      setTimeout(() => {
        app.hideLoading();
        const mockUser = {
          id: 'USR_ADMIN_001',
          email: email,
          name: 'Abhishek Sharma',
          role: 'OrgAdmin',
          orgId: 'mock_org',
          orgName: 'Zolexora IMS'
        };
        app.state.authUser = mockUser;
        localStorage.setItem('zolexora_auth_user', JSON.stringify(mockUser));
        app.showDashboard(app.getMockData());
        app.showToast('Signed in successfully!');
      }, 600);
    }
  },

  handleEmailPasswordRegister: function(e) {
    if (e) e.preventDefault();
    const name = document.getElementById('regAdminName').value.trim();
    const email = document.getElementById('regAdminEmail').value.trim();
    const password = document.getElementById('regAdminPassword').value.trim();
    const orgName = document.getElementById('regOrgName').value.trim();
    const industry = document.getElementById('regIndustry').value;
    const currency = document.getElementById('regCurrency').value;
    const storeName = document.getElementById('regStoreName').value.trim();

    if (!name || !email || !password || !orgName) {
      this.showToast('Please fill in all required fields.', 'error');
      return;
    }

    if (password.length < 6) {
      this.showToast('Password must be at least 6 characters long.', 'error');
      return;
    }

    localStorage.setItem('zolexora_saved_email', email);

    this.showLoading('Creating Organization Workspace...', 'Provisioning multi-tenant database & registering Admin');

    const regData = {
      name: name,
      email: email,
      password: password,
      orgName: orgName,
      industry: industry,
      currency: currency || '₹',
      storeName: storeName || 'Main Central Warehouse'
    };

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(res) {
          app.hideLoading();
          if (res && res.success) {
            app.state.authUser = res.user;
            localStorage.setItem('zolexora_auth_user', JSON.stringify(res.user));
            app.showDashboard(res.data);
            app.showToast('Workspace provisioned! You are Admin of ' + res.user.orgName);
          } else {
            app.showToast((res && res.message) ? res.message : 'Registration failed.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Registration error: ' + err.message, 'error');
        })
        .registerUser(regData);
    } else {
      setTimeout(() => {
        app.hideLoading();
        const mockUser = {
          id: 'USR_NEW_ADMIN',
          email: email,
          name: name,
          role: 'OrgAdmin',
          orgId: 'mock_org',
          orgName: orgName
        };
        app.state.authUser = mockUser;
        localStorage.setItem('zolexora_auth_user', JSON.stringify(mockUser));
        app.showDashboard(app.getMockData());
        app.showToast('Workspace created! You are Admin of ' + orgName);
      }, 1000);
    }
  },

  showDashboard: function(data) {
    this.navigateTo('dashboard');

    // Update user profile badges
    if (this.state.authUser) {
      const u = this.state.authUser;
      const hName = document.getElementById('headerUserName');
      const hRole = document.getElementById('headerUserRole');
      const sName = document.getElementById('sidebarUserName');
      if (hName) hName.innerText = u.name || u.email;
      if (hRole) hRole.innerText = (u.role || 'Admin') + ' (' + (u.orgName || 'Org') + ')';
      if (sName) sName.innerText = u.name || u.email;
    }

    this.handleInitialDataSuccess(data);
  },



  logoutUser: function() {
    localStorage.removeItem('zolexora_auth_user');
    sessionStorage.clear();
    this.state.authUser = null;
    this.showAuthView();
    if (this.isGasEnv()) {
      google.script.run.logoutUser();
    }
    this.showToast('Signed out successfully.');
  },

  // Check if running inside Google Apps Script environment
  isGasEnv: function() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  },

  // Show Global Loading
  showLoading: function(title, subtitle) {
    const el = document.getElementById('loadingOverlay');
    if (el) {
      if (title) document.getElementById('loadingTitle').innerText = title;
      if (subtitle) document.getElementById('loadingSubtitle').innerText = subtitle;
      el.classList.remove('hidden');
    }
  },

  hideLoading: function() {
    const el = document.getElementById('loadingOverlay');
    if (el) el.classList.add('hidden');
    const refreshIcon = document.getElementById('refreshIcon');
    if (refreshIcon) refreshIcon.classList.remove('fa-spin');
  },

  // Toast System
  showToast: function(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = `toast-enter pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-xs font-semibold flex items-center space-x-2.5 max-w-sm border ${
      type === 'success' ? 'bg-emerald-900 text-emerald-100 border-emerald-700' :
      type === 'error' ? 'bg-rose-900 text-rose-100 border-rose-700' :
      'bg-slate-900 text-slate-100 border-slate-700'
    }`;

    const icon = type === 'success' ? 'fa-circle-check text-emerald-400' :
                 type === 'error' ? 'fa-circle-exclamation text-rose-400' :
                 'fa-circle-info text-amber-400';

    toast.innerHTML = `
      <i class="fa-solid ${icon} text-base flex-shrink-0"></i>
      <div class="flex-1">${message}</div>
      <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white">&times;</button>
    `;

    container.appendChild(toast);
    setTimeout(() => {
      if (toast.parentElement) toast.remove();
    }, 4500);
  },

  // Load Initial Data from Backend
  loadInitialData: function(isRefresh = false) {
    const refreshIcon = document.getElementById('refreshIcon');
    if (refreshIcon) refreshIcon.classList.add('fa-spin');
    
    if (isRefresh) {
      this.showToast('Refreshing inventory from Google Sheets...', 'info');
    }

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(response) {
          app.handleInitialDataSuccess(response);
          if (isRefresh) app.showToast('Database up to date!');
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Error loading database: ' + err.message, 'error');
        })
        .getInitialData();
    } else {
      // Local preview mock fallback
      console.warn('Google Apps Script environment not detected. Using sample mock database.');
      setTimeout(() => {
        app.handleInitialDataSuccess(app.getMockData());
      }, 300);
    }
  },

  handleInitialDataSuccess: function(data) {
    this.hideLoading();
    if (!data) return;

    this.state.workbooksInfo = data.workbooksInfo || {};
    this.state.dbInfo = data.dbInfo || (data.workbooksInfo ? data.workbooksInfo.folder : {});
    this.state.activeOrganization = data.activeOrganization || (data.workbooksInfo ? data.workbooksInfo.activeOrganization : null);
    this.state.organizations = data.organizations || (data.workbooksInfo ? data.workbooksInfo.organizations : []);
    this.state.hasOrganization = data.hasOrganization !== false;

    // If user is not authenticated, redirect to auth landing view
    if (!this.state.authUser) {
      this.showAuthView();
      return;
    }

    this.state.metrics = data.metrics || {};
    this.state.items = data.items || [];
    this.state.suppliers = data.suppliers || [];
    this.state.stores = data.stores || [];
    this.state.sellingPoints = data.sellingPoints || [];
    this.state.departments = data.departments || [];
    this.state.locations = data.locations || [];
    this.state.users = data.users || [];
    this.state.settings = data.settings || { CURRENCY_SYMBOL: '₹', HOTEL_NAME: 'Zolexora IMS' };

    const currentOrgName = (this.state.activeOrganization && this.state.activeOrganization.name) 
      ? this.state.activeOrganization.name 
      : (this.state.settings.HOTEL_NAME || 'Zolexora IMS');

    this.state.settings.HOTEL_NAME = currentOrgName;

    // Update active organization headers & sidebar
    const headerOrgEl = document.getElementById('headerOrgName');
    if (headerOrgEl) headerOrgEl.innerText = currentOrgName;

    const sidebarHotelEl = document.getElementById('sidebarHotelName');
    if (sidebarHotelEl) sidebarHotelEl.innerText = currentOrgName;

    // Update Nav Count
    const navBadge = document.getElementById('navTotalItemsBadge');
    if (navBadge) navBadge.innerText = this.state.items.length;

    // Update Google Sheet links and Multi-Workbook grid
    this.updateGoogleSheetLinks();

    // Populate dropdowns across modals with real suppliers, stores, and selling points
    this.populateAllSelectDropdowns();

    // Render components
    this.renderDashboard();
    this.filterCatalog();
    this.filterTransactions();
    this.renderSuppliers();
    this.renderDepartmentsAndLocations();
    this.renderSettingsTab();
  },

  // ==========================================
  // MULTI-ORGANIZATION MANAGEMENT
  // ==========================================
  openOrgModal: function(defaultTab = 'create', allowClose = true) {
    const modal = document.getElementById('orgModal');
    if (!modal) return;
    modal.classList.remove('hidden');

    const closeBtn = document.getElementById('orgModalCloseBtn');
    const isLocked = !allowClose || (!this.state.activeOrganization || !this.state.hasOrganization);
    if (closeBtn) {
      if (isLocked) {
        closeBtn.classList.add('hidden');
      } else {
        closeBtn.classList.remove('hidden');
      }
    }

    this.switchOrgTab(defaultTab);
    this.renderOrgList();
  },

  closeOrgModal: function() {
    if (!this.state.hasOrganization || !this.state.activeOrganization) {
      this.showToast('Please create or select an organization database first.', 'warning');
      return;
    }
    const modal = document.getElementById('orgModal');
    if (modal) modal.classList.add('hidden');
  },

  handleOrgBackdropClick: function() {
    if (!this.state.hasOrganization || !this.state.activeOrganization) {
      return;
    }
    this.closeOrgModal();
  },

  switchOrgTab: function(tab) {
    const secSwitch = document.getElementById('orgSectionSwitch');
    const secCreate = document.getElementById('orgSectionCreate');
    const btnSwitch = document.getElementById('tabSwitchOrgBtn');
    const btnCreate = document.getElementById('tabCreateOrgBtn');

    if (tab === 'create') {
      if (secSwitch) secSwitch.classList.add('hidden');
      if (secCreate) secCreate.classList.remove('hidden');
      if (btnSwitch) {
        btnSwitch.className = 'pb-2 border-b-2 border-transparent text-on-surface-variant hover:text-on-surface font-semibold text-xs flex items-center gap-1.5 transition cursor-pointer';
      }
      if (btnCreate) {
        btnCreate.className = 'pb-2 border-b-2 border-primary text-primary font-bold text-xs flex items-center gap-1.5 transition cursor-pointer';
      }
      const nameInput = document.getElementById('newOrgName');
      if (nameInput) setTimeout(() => nameInput.focus(), 100);
    } else {
      if (secCreate) secCreate.classList.add('hidden');
      if (secSwitch) secSwitch.classList.remove('hidden');
      if (btnCreate) {
        btnCreate.className = 'pb-2 border-b-2 border-transparent text-on-surface-variant hover:text-on-surface font-semibold text-xs flex items-center gap-1.5 transition cursor-pointer';
      }
      if (btnSwitch) {
        btnSwitch.className = 'pb-2 border-b-2 border-primary text-primary font-bold text-xs flex items-center gap-1.5 transition cursor-pointer';
      }
      this.renderOrgList();
    }
  },

  renderOrgList: function() {
    const container = document.getElementById('orgListContainer');
    if (!container) return;

    const orgs = this.state.organizations || [];
    const activeId = this.state.activeOrganization ? this.state.activeOrganization.id : '';

    if (orgs.length === 0) {
      container.innerHTML = `
        <div class="bg-surface-container-high/40 rounded-xl p-6 text-center space-y-3 border border-outline-variant/10">
          <span class="material-symbols-outlined text-primary text-[32px]">domain_disabled</span>
          <div>
            <h4 class="font-bold text-on-surface text-sm">No Organizations Found Yet</h4>
            <p class="text-on-surface-variant text-xs mt-1">Create your first organization database in Drive folder 1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx.</p>
          </div>
          <button type="button" onclick="app.switchOrgTab('create')" class="px-4 py-2 bg-primary text-on-primary font-bold text-xs rounded-lg shadow inline-flex items-center gap-1.5 cursor-pointer">
            <span class="material-symbols-outlined text-[16px]">add_circle</span>
            <span>Create Organization Database</span>
          </button>
        </div>
      `;
      return;
    }

    container.innerHTML = orgs.map(org => {
      const isActive = org.id === activeId;
      return `
        <div class="flex items-center justify-between p-3.5 rounded-xl border transition ${
          isActive 
            ? 'bg-primary/10 border-primary/40 shadow-sm' 
            : 'bg-surface-container-high hover:bg-surface-container-highest border-outline-variant/20'
        }">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-8 h-8 rounded-lg ${isActive ? 'bg-primary text-on-primary' : 'bg-surface-container text-on-surface-variant'} flex items-center justify-center font-bold text-xs flex-shrink-0">
              <span class="material-symbols-outlined text-[18px]">domain</span>
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <span class="font-bold text-on-surface text-xs truncate">${org.name}</span>
                ${isActive ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-primary text-on-primary">Active</span>' : ''}
              </div>
              <p class="text-[11px] text-on-surface-variant font-mono truncate">ID: ${org.id}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 flex-shrink-0">
            <a href="${org.url}" target="_blank" title="Open Organization Folder in Google Drive" class="p-1.5 rounded-lg text-on-surface-variant hover:text-primary hover:bg-surface-container transition">
              <span class="material-symbols-outlined text-[18px]">open_in_new</span>
            </a>
            ${isActive 
              ? '<span class="text-xs text-primary font-semibold px-2.5 py-1">Current Database</span>' 
              : `<button type="button" onclick="app.switchOrganization('${org.id}')" class="px-3 py-1.5 bg-surface-container-highest hover:bg-primary hover:text-on-primary text-on-surface text-xs font-bold rounded-lg transition border border-outline-variant/20 cursor-pointer">
                  Switch
                </button>`
            }
          </div>
        </div>
      `;
    }).join('');
  },

  handleCreateOrgSubmit: function(e) {
    if (e) e.preventDefault();
    const name = document.getElementById('newOrgName').value.trim();
    const storeName = document.getElementById('newOrgStoreName').value.trim();
    const industry = document.getElementById('newOrgIndustry') ? document.getElementById('newOrgIndustry').value : 'Hospitality & Hotels';
    const currency = document.getElementById('newOrgCurrency').value;
    const adminName = document.getElementById('newOrgAdminName').value.trim();
    const adminEmail = document.getElementById('newOrgAdminEmail').value.trim();

    if (!name) {
      this.showToast('Please enter an organization name.', 'error');
      return;
    }

    this.showLoading('Provisioning Organization Database...', 'Creating folder "' + name + '" & structured tree in Google Drive');

    const orgData = {
      name: name,
      storeName: storeName || 'Main Central Warehouse',
      industry: industry,
      currency: currency || '₹',
      adminName: adminName || 'Zolexora Admin',
      adminEmail: adminEmail || 'abhishekofficial4577@gmail.com'
    };

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(data) {
          app.hideLoading();
          app.closeOrgModal();
          if (data && data.activeOrganization) {
            sessionStorage.setItem('zolexora_active_org_id', data.activeOrganization.id);
          }
          app.hideOnboardingView();
          app.handleInitialDataSuccess(data);
          app.showToast('Organization "' + name + '" provisioned successfully with 6 structured subdirectories!');
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Failed to create organization: ' + err.message, 'error');
        })
        .createNewOrganization(orgData);
    } else {
      setTimeout(() => {
        app.hideLoading();
        app.closeOrgModal();
        sessionStorage.setItem('zolexora_active_org_id', 'mock_id');
        app.hideOnboardingView();
        app.state.activeOrganization = { id: 'mock_org_' + Date.now(), name: name, url: '#' };
        app.state.organizations.push(app.state.activeOrganization);
        app.state.settings.HOTEL_NAME = name;
        app.showToast('Mock Organization "' + name + '" provisioned!');
        app.renderDashboard();
      }, 1000);
    }
  },

  switchOrganization: function(orgId) {
    this.showLoading('Switching Database...', 'Loading organization workbooks from Google Drive');
    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(data) {
          app.hideLoading();
          app.closeOrgModal();
          sessionStorage.setItem('zolexora_active_org_id', orgId);
          app.hideOnboardingView();
          app.handleInitialDataSuccess(data);
          app.showToast('Switched organization to ' + (data.activeOrganization ? data.activeOrganization.name : 'new database'));
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Failed to switch organization: ' + err.message, 'error');
        })
        .switchOrganization(orgId);
    }
  },

  updateGoogleSheetLinks: function() {
    const wbInfo = this.state.workbooksInfo || {};
    const folder = wbInfo.folder || {
      id: '1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx',
      name: 'Zolexora IMS Database Folder',
      url: 'https://drive.google.com/drive/folders/1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx'
    };

    const headerDriveLink = document.getElementById('openDriveFolderBtn');
    if (headerDriveLink && folder.url) {
      headerDriveLink.href = folder.url;
    }

    const driveDirectLink = document.getElementById('openDriveFolderDirectLink');
    if (driveDirectLink && folder.url) {
      driveDirectLink.href = folder.url;
    }

    const folderNameEl = document.getElementById('driveFolderName');
    if (folderNameEl) folderNameEl.innerText = folder.name || 'Zolexora IMS Database Folder';

    const folderIdEl = document.getElementById('driveFolderId');
    if (folderIdEl) folderIdEl.innerText = folder.id || '1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx';

    this.renderWorkbooksGrid();
    this.renderDriveDirectoryTree(wbInfo.directoryTree || null);
  },

  renderWorkbooksGrid: function() {
    const container = document.getElementById('workbooksGrid');
    if (!container) return;

    const workbooks = (this.state.workbooksInfo && this.state.workbooksInfo.workbooks) ? this.state.workbooksInfo.workbooks : [
      { key: 'Location_Master', name: 'Location_Master', sheets: ['Store', 'Selling_Point'], url: 'https://drive.google.com/drive/folders/1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx' },
      { key: 'Product_Master', name: 'Product_Master', sheets: ['Product_Master'], url: 'https://drive.google.com/drive/folders/1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx' },

  provisionDriveDirectoryTree: function() {
    this.showLoading('Building Directory Tree...', 'Creating subdirectories & organizing workbooks in Google Drive');
    const icon = document.getElementById('buildTreeIcon');
    if (icon) icon.classList.add('animate-spin');

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(result) {
          app.hideLoading();
          if (icon) icon.classList.remove('animate-spin');
          app.showToast('Directory tree created & workbooks organized successfully!');
          if (result && result.directoryTree) {
            app.renderDriveDirectoryTree(result.directoryTree);
          }
          app.loadInitialData(true);
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          if (icon) icon.classList.remove('animate-spin');
          app.showToast('Failed to build directory tree: ' + err.message, 'error');
        })
        .createDriveDirectoryTree();
    } else {
      setTimeout(() => {
        this.hideLoading();
        if (icon) icon.classList.remove('animate-spin');
        this.showToast('Directory tree organized (Local Preview)');
        this.renderDriveDirectoryTree(null);
      }, 500);
    }
  },

  renderDriveDirectoryTree: function(tree) {
    const container = document.getElementById('driveDirectoryTreeContainer');
    if (!container) return;

    if (!tree) {
      container.innerHTML = `

          <div class="flex items-center gap-1.5 text-primary font-bold">
            <span class="material-symbols-outlined text-[16px]">folder_open</span>
            <a href="https://drive.google.com/drive/folders/1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx" target="_blank" class="hover:underline">1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx/ (Root Database Folder)</a>
          </div>
          <div class="pl-4 space-y-1 text-on-surface">
            <div>├── <span class="text-secondary font-semibold"><span class="material-symbols-outlined text-[14px] align-middle">folder</span> 01_Master_Databases/</span></div>
            <div class="pl-6 text-on-surface-variant">│   ├── <span class="material-symbols-outlined text-[14px] align-middle text-emerald-400">table_chart</span> Location_Master</div>
            <div class="pl-6 text-on-surface-variant">│   ├── <span class="material-symbols-outlined text-[14px] align-middle text-emerald-400">table_chart</span> Product_Master</div>
            <div class="pl-6 text-on-surface-variant">│   └── <span class="material-symbols-outlined text-[14px] align-middle text-emerald-400">table_chart</span> Supplier_Master</div>
            <div>├── <span class="text-secondary font-semibold"><span class="material-symbols-outlined text-[14px] align-middle">folder</span> 02_Transactions/</span></div>
            <div class="pl-6 text-on-surface-variant">│   ├── <span class="material-symbols-outlined text-[14px] align-middle text-emerald-400">table_chart</span> Supplier_Transactions</div>
            <div class="pl-6 text-on-surface-variant">│   └── <span class="material-symbols-outlined text-[14px] align-middle text-emerald-400">table_chart</span> Issuance_Transactions</div>
            <div>├── <span class="text-secondary font-semibold"><span class="material-symbols-outlined text-[14px] align-middle">folder</span> 03_Settings_and_Users/</span></div>
            <div class="pl-6 text-on-surface-variant">│   └── <span class="material-symbols-outlined text-[14px] align-middle text-emerald-400">table_chart</span> Users_and_Settings</div>
            <div>├── <span class="text-secondary font-semibold"><span class="material-symbols-outlined text-[14px] align-middle">folder</span> 04_Invoices_and_Attachments/</span></div>
            <div class="pl-6 text-outline">│   ├── <span class="material-symbols-outlined text-[14px] align-middle">folder</span> Purchase_Orders/</div>
            <div class="pl-6 text-outline">│   └── <span class="material-symbols-outlined text-[14px] align-middle">folder</span> Delivery_Challans/</div>
            <div>├── <span class="text-secondary font-semibold"><span class="material-symbols-outlined text-[14px] align-middle">folder</span> 05_Reports_and_Exports/</span></div>
            <div class="pl-6 text-outline">│   ├── <span class="material-symbols-outlined text-[14px] align-middle">folder</span> Daily_Summaries/</div>
            <div class="pl-6 text-outline">│   ├── <span class="material-symbols-outlined text-[14px] align-middle">folder</span> Monthly_Valuation/</div>
            <div class="pl-6 text-outline">│   └── <span class="material-symbols-outlined text-[14px] align-middle">folder</span> Supplier_Audits/</div>
            <div>└── <span class="text-secondary font-semibold"><span class="material-symbols-outlined text-[14px] align-middle">folder</span> 06_System_Backups/</span></div>
          </div>
        </div>
      `;
      return;
    }

    function formatNode(node, prefix, isLast) {
      let html = '';
      const marker = isLast ? '└── ' : '├── ';
      const childPrefix = prefix + (isLast ? '    ' : '│   ');

      if (node.type === 'folder') {
        html += `
          <div class="flex items-center gap-1.5 py-0.5">
            <span class="text-outline select-none">${prefix}${marker}</span>
            <span class="material-symbols-outlined text-[15px] text-amber-400">folder</span>
            <a href="${node.url}" target="_blank" class="font-semibold text-secondary hover:underline">${node.name}/</a>
          </div>
        `;
      }

      const allChildren = [
        ...(node.subfolders || []),
        ...(node.files || [])
      ];

      allChildren.forEach((child, idx) => {
        const lastChild = idx === allChildren.length - 1;
        if (child.type === 'folder') {
          html += formatNode(child, childPrefix, lastChild);
        } else {
          html += `
            <div class="flex items-center gap-1.5 py-0.5 pl-1">
              <span class="text-outline select-none">${childPrefix}${lastChild ? '└── ' : '├── '}</span>
              <span class="material-symbols-outlined text-[15px] text-emerald-400">table_chart</span>
              <a href="${child.url}" target="_blank" class="text-on-surface hover:text-primary hover:underline">${child.name}</a>
              <span class="text-[10px] text-outline font-data-tabular">(${child.mimeType && child.mimeType.includes('spreadsheet') ? 'Sheet' : 'File'})</span>
            </div>
          `;
        }
      });

      return html;
    }

    let treeHtml = `
      <div class="space-y-0.5">
        <div class="flex items-center gap-1.5 font-bold text-primary pb-1 border-b border-outline-variant/10">
          <span class="material-symbols-outlined text-[18px]">folder_open</span>
          <a href="${tree.url || ('https://drive.google.com/drive/folders/' + tree.id)}" target="_blank" class="hover:underline">${tree.name || 'Root Database Folder'} (${tree.id})</a>
        </div>
        <div class="pt-1">
    `;

    const rootChildren = [
      ...(tree.subfolders || []),
      ...(tree.files || [])
    ];

    if (rootChildren.length === 0) {
      treeHtml += `<div class="text-outline py-1">Folder is empty. Click "Build / Organize Directory Tree" to provision structure.</div>`;
    } else {
      rootChildren.forEach((child, idx) => {
        const isLast = idx === rootChildren.length - 1;
        if (child.type === 'folder') {
          treeHtml += formatNode(child, '', isLast);
        } else {
          treeHtml += `
            <div class="flex items-center gap-1.5 py-0.5">
              <span class="text-outline select-none">${isLast ? '└── ' : '├── '}</span>
              <span class="material-symbols-outlined text-[15px] text-emerald-400">table_chart</span>
              <a href="${child.url}" target="_blank" class="text-on-surface hover:text-primary hover:underline">${child.name}</a>
            </div>
          `;
        }
      });
    }

    treeHtml += `</div></div>`;
    container.innerHTML = treeHtml;
  },

  // Number & Currency Formatters
  formatCurrency: function(amount) {
    const symbol = this.state.settings.CURRENCY_SYMBOL || '₹';
    const num = Number(amount) || 0;
    return symbol + ' ' + num.toLocaleString();
  },

  formatNumber: function(amount) {
    return (Number(amount) || 0).toLocaleString();
  },

  // TAB NAVIGATION
  switchTab: function(tabId) {
    this.state.activeTab = tabId;

    // Update Sidebar Nav Items
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      item.className = 'nav-item flex items-center px-md py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all duration-200 group';
    });

    const activeBtn = document.getElementById('navBtn-' + tabId);
    if (activeBtn) {
      activeBtn.className = 'nav-item flex items-center px-md py-3 rounded-lg transition-all duration-200 group bg-primary-container text-on-primary-container font-semibold shadow-lg shadow-primary/20';
    }

    // Toggle Content Panes
    const panes = document.querySelectorAll('.tab-pane');
    panes.forEach(p => p.classList.add('hidden'));

    const targetPane = document.getElementById('tabContent-' + tabId);
    if (targetPane) {
      targetPane.classList.remove('hidden');
    }

    // Trigger Chart Resize if Reports
    if (tabId === 'reports' && this.state.categoryChart) {
      this.state.categoryChart.resize();
    }
  },

  handleGlobalSearch: function(query) {
    const q = (query || '').trim();
    if (!q) return;
    if (this.state.activeTab !== 'products') {
      this.switchTab('products');
    }
    const searchInput = document.getElementById('catalogSearchInput');
    if (searchInput) {
      searchInput.value = q;
      this.filterCatalog();
    }
  },

  filterByLocation: function(locName) {
    let prop = 'ALL';
    const l = locName.toUpperCase();
    if (l.includes('CENTRAL')) prop = 'CENTRAL';
    else if (l.includes('S_001') || l.includes('STORE 1')) prop = 'S_001';
    else if (l.includes('S_002') || l.includes('STORE 2')) prop = 'S_002';

    const filter = document.getElementById('headerPropertyFilter');
    if (filter) filter.value = prop;
    this.handlePropertyFilterChange(prop);
    this.switchTab('products');
  },

  handlePropertyFilterChange: function(propertyCode) {
    this.state.propertyFilter = propertyCode;
    this.filterCatalog();
    this.filterTransactions();
    this.showToast(`View filtered to: ${propertyCode === 'ALL' ? 'All Properties' : propertyCode + ' Store'}`);
  },

  // DASHBOARD RENDERING (MATERIAL 3)

  renderDashboard: function() {
    const m = this.state.metrics || {};
    const sym = this.state.settings.CURRENCY_SYMBOL || '₹';

    // Live Timestamp
    const now = new Date();
    const tsEl = document.getElementById('liveTimestamp');
    if (tsEl) {
      const dStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const tStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
      tsEl.innerText = `${dStr} | ${tStr}`;
    }

    // KPI Summary Cards
    const skusEl = document.getElementById('dashTotalSkus');
    if (skusEl) skusEl.innerText = this.formatNumber(m.totalSkus || 0);

    const unitsEl = document.getElementById('dashTotalUnits');
    if (unitsEl) unitsEl.innerText = `${this.formatNumber(m.totalUnits || 0)} units total`;

    const lowEl = document.getElementById('dashLowStockCount');
    if (lowEl) lowEl.innerText = this.formatNumber((m.lowStockCount || 0) + (m.outOfStockCount || 0));

    if (txnsEl) txnsEl.innerText = this.formatNumber(today.txnCount || 0);

    const inEl = document.getElementById('dashStockInToday');
    if (inEl) inEl.innerText = `+${today.stockIn || 0} In`;

    const outEl = document.getElementById('dashStockOutToday');
    if (outEl) outEl.innerText = `-${today.stockOut || 0} Out`;

    const valEl = document.getElementById('dashTotalValuation');
    if (valEl) valEl.innerText = this.formatCurrency(m.totalValuation || 0);

    const tipEl = document.getElementById('chartTooltipVal');
    if (tipEl) tipEl.innerText = this.formatCurrency(m.totalValuation || 0);

    // Update user profile from Users sheet
    if (this.state.users && this.state.users.length > 0) {
      const u = this.state.users[0];
      const nameEl = document.getElementById('headerUserName');
      if (nameEl) nameEl.innerText = u.name || 'Staff';
      const roleEl = document.getElementById('headerUserRole');
      if (roleEl) roleEl.innerText = u.role || 'Inventory Incharge';
    }

    // Update organization title from Settings sheet
    let orgTitle = (this.state.settings && (this.state.settings.ORGANIZATION_NAME || this.state.settings.HOTEL_NAME)) ? (this.state.settings.ORGANIZATION_NAME || this.state.settings.HOTEL_NAME) : 'Zolexora IMS';
    if (!orgTitle || orgTitle.includes('DNP') || orgTitle.includes('21 Gun') || orgTitle.includes('Deneb') || orgTitle.includes('Pollux')) {
      orgTitle = 'Zolexora IMS';
    }
    const hEl = document.getElementById('sidebarHotelName');
    if (hEl) hEl.innerText = orgTitle;

    // Dynamic Middle Row
    this.renderCategoryBars(m.categoryBreakdown || {});
    this.renderTopIssuedItems();
    this.renderRecentRequisitions();

    // Dynamic Bottom Row
    this.renderManagedProperties();
    this.renderLowStockTable(m.lowStockItems || []);

    // Reports Breakdown
    this.renderCategoryChart(m.categoryBreakdown || {});
    this.renderReportsLocations();
  },

  renderCategoryBars: function(categoryMap) {
    const container = document.getElementById('categoryBarsContainer');
    if (!container) return;

    const categories = Object.keys(categoryMap || {});
    let sorted = categories.map(c => ({
      name: c,
      units: categoryMap[c].units || 0,
      value: categoryMap[c].value || 0
    })).filter(item => item.units > 0).sort((a, b) => b.units - a.units).slice(0, 5);

    if (sorted.length === 0) {
      container.innerHTML = `<div class="py-12 text-center text-on-surface-variant text-xs w-full">No category stock recorded in Product_Master sheet yet.</div>`;
      return;
    }

    const maxUnits = Math.max(...sorted.map(s => s.units), 10);
    const barColors = ['bg-primary', 'bg-primary-fixed-dim', 'bg-secondary-fixed-dim', 'bg-secondary', 'bg-secondary-container'];
    const yLabels = [Math.round(maxUnits), Math.round(maxUnits * 0.75), Math.round(maxUnits * 0.5), Math.round(maxUnits * 0.25), 0];

    const barsHtml = sorted.map((item, idx) => {
      const heightPct = Math.max(10, Math.round((item.units / maxUnits) * 92));
      const colorClass = barColors[idx % barColors.length];
      const shortName = item.name.split(' ')[0].replace('&', '');
      return `
        <div class="flex flex-col items-center gap-xs z-10 w-full group">
          <span class="font-data-tabular text-data-tabular text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity">${item.units}</span>
          <div class="w-full ${colorClass} rounded-t-sm" style="height: ${heightPct}%; transition: height 0.8s ease-out;"></div>
          <span class="font-label-caps text-label-caps text-outline mt-sm rotate-45 md:rotate-0 origin-left truncate w-full text-center" title="${item.name}">${shortName}</span>
        </div>
      `;
    }).join('');

    container.innerHTML = `
      <div class="absolute inset-0 flex flex-col justify-between pointer-events-none opacity-20 z-0">
        <div class="border-b border-outline-variant w-full"></div>
        <div class="border-b border-outline-variant w-full"></div>
        <div class="border-b border-outline-variant w-full"></div>
        <div class="border-b border-outline-variant w-full"></div>
        <div class="border-b border-outline-variant w-full"></div>
      </div>
      <div class="absolute -left-2 inset-y-0 flex flex-col justify-between items-end text-outline text-data-tabular font-data-tabular py-xs z-10 translate-x-[-100%]">
        ${yLabels.map(y => `<span>${y}</span>`).join('')}
      </div>
      ${barsHtml}
    `;
  },

  renderTopIssuedItems: function() {
    const container = document.getElementById('topIssuedList');
    if (!container) return;

    const issueMap = {};
    const txns = this.state.issuanceTransactions || this.state.recentTransactions || [];
    txns.forEach(t => {
      if (t.type === 'STOCK_OUT' || t.type === 'DISBURSEMENT') {
        const key = t.itemCode || t.itemId || t.sku || t.itemName;
        if (!issueMap[key]) {
          issueMap[key] = {
            name: t.itemName,
            sku: t.sku || t.itemCode || key,
            category: t.category || '',
            qty: 0,
            value: 0
          };
        }
        issueMap[key].qty += Number(t.quantity) || 0;
        issueMap[key].value += Number(t.totalCost || t.totalValue) || 0;
      }
    });

    let list = Object.values(issueMap).sort((a, b) => b.qty - a.qty).slice(0, 5);

    if (list.length === 0) {
      container.innerHTML = `<div class="py-8 text-center text-on-surface-variant text-xs w-full">No issued items recorded in Issuance_Transactions sheet yet.</div>`;
      return;
    }

    container.innerHTML = list.map(item => {
      const matched = this.state.items.find(i => i.sku === item.sku || i.name === item.name);
      const stock = matched ? matched.totalStock : '--';
      return `
        <div onclick="app.openBarcodeModal('${matched ? matched.id : ''}')" class="flex items-center gap-md py-sm px-xs hover:bg-surface-container-high rounded-lg transition-colors group cursor-pointer relative">
          <div class="absolute left-0 top-0 bottom-0 w-1 bg-primary rounded-r-full opacity-0 group-hover:opacity-100 transition-opacity"></div>
          <div class="w-10 h-10 rounded-md overflow-hidden bg-surface flex-shrink-0 flex items-center justify-center">

          <span class="font-data-tabular text-data-tabular text-on-surface-variant w-24 truncate">${item.sku}</span>
          <span class="font-data-tabular text-data-tabular text-on-surface w-16 text-right">${item.qty}</span>
          <span class="font-data-tabular text-data-tabular text-on-surface w-20 text-right">${this.formatCurrency(item.value)}</span>
          <span class="font-data-tabular text-data-tabular text-on-surface w-16 text-right font-bold">${stock}</span>
        </div>
      `;
    }).join('');

  renderCategoryChart: function(categoryMap) {
    const canvas = document.getElementById('categoryChart');
    if (!canvas) return;

    const labels = Object.keys(categoryMap);
    const dataVals = labels.map(l => categoryMap[l].value || 0);

    const colors = [
      '#2563eb', // primary blue
      '#4edea3', // secondary emerald
      '#ffb95f', // tertiary amber
      '#ffb4ab', // error red
      '#b4c5ff', // primary dim
      '#00a572', // dark secondary
      '#8d90a0', // outline slate
      '#e1e2ed'  // on-surface
    ];

    if (this.state.categoryChart) {
      this.state.categoryChart.destroy();
    }

    const ctx = canvas.getContext('2d');
    this.state.categoryChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: dataVals,
          backgroundColor: colors.slice(0, labels.length),
          borderWidth: 2,
          borderColor: '#191b23'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              boxWidth: 9,
              font: { size: 9, family: 'Cambria, Georgia, serif' },
              color: '#d1d5db'
            }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                const val = context.raw || 0;
                return ` ${context.label}: ${app.formatCurrency(val)}`;
              }
            }
          }
        },
        cutout: '68%'
      }
    });
  },

  getTypeBadge: function(type) {
    const t = String(type).toUpperCase();
    if (t === 'STOCK_IN') {
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-secondary-container/20 text-secondary border border-secondary/20"><span class="w-1.5 h-1.5 rounded-full bg-secondary mr-1"></span>Stock In</span>`;
    } else if (t === 'STOCK_OUT') {
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-tertiary-container/20 text-tertiary border border-tertiary/20"><span class="w-1.5 h-1.5 rounded-full bg-tertiary mr-1"></span>Stock Out</span>`;

  filterCatalogByLowStock: function() {
    this.switchTab('products');

    this.filterCatalog();

  filterCatalog: function() {
    const searchVal = (document.getElementById('catalogSearchInput')?.value || '').toLowerCase().trim();
    const catVal = document.getElementById('catalogCategoryFilter')?.value || 'ALL';
    const stockVal = document.getElementById('catalogStockFilter')?.value || 'ALL';
    const propFilter = this.state.propertyFilter;

    let items = this.state.items.filter(item => {
      // Search match
      const matchSearch = !searchVal || 
        (item.name && item.name.toLowerCase().includes(searchVal)) ||
        (item.sku && item.sku.toLowerCase().includes(searchVal)) ||
        (item.category && item.category.toLowerCase().includes(searchVal)) ||
        (item.supplier && item.supplier.toLowerCase().includes(searchVal));

      if (!matchSearch) return false;

      // Category match
      if (catVal !== 'ALL' && item.category !== catVal) return false;

      // Stock status filter
      const total = Number(item.totalStock) || 0;
      const min = Number(item.minStock) || 0;
      if (stockVal === 'LOW' && (total > min || total === 0)) return false;
      if (stockVal === 'OUT' && total !== 0) return false;
      if (stockVal === 'OK' && total <= min) return false;

      // Property specific non-zero check if selected
      if (propFilter === 'CENTRAL' && stockVal !== 'ALL' && item.centralStock <= 0) return false;
      if (propFilter === 'S_001' && stockVal !== 'ALL' && (item.stockS001 || 0) <= 0) return false;
      if (propFilter === 'S_002' && stockVal !== 'ALL' && (item.stockS002 || 0) <= 0) return false;

      return true;
    });

    this.renderCatalogTable(items);
  },

              <span class="bg-surface-container-highest text-on-surface-variant px-1.5 py-0.5 rounded text-[10px] font-medium">${item.category}</span>
              ${item.supplier ? `<span class="truncate max-w-[140px] text-outline text-[11px] flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">local_shipping</span>${item.supplier}</span>` : ''}
            </div>
          </td>

          <!-- Property Stocks -->
          <td class="py-3 px-3 text-center font-data-tabular font-bold text-primary">${item.centralStock}</td>
          <td class="py-3 px-3 text-center font-data-tabular font-bold text-secondary">${item.stockS001 || 0}</td>
          <td class="py-3 px-3 text-center font-data-tabular font-bold text-tertiary">${item.stockS002 || 0}</td>

          <!-- Total Stock -->
          <td class="py-3 px-3 text-center font-data-tabular font-extrabold text-sm ${isOut ? 'text-error' : isLow ? 'text-tertiary' : 'text-on-surface'}">

          </td>

          <td class="py-3 px-3 text-center text-outline font-data-tabular">
            ${item.minStock}
          </td>

          <!-- Unit Cost -->
          <td class="py-3 px-3 text-right text-on-surface-variant font-data-tabular">
            ${this.formatCurrency(item.unitCost)}
          </td>

          <!-- Total Valuation -->

              <button onclick="app.openPurchaseInvoiceModal('${item.id}')" title="Purchase Entry Invoice" class="p-1 rounded bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-400 border border-emerald-500/30 transition">

  filterTransactions: function() {
    const searchVal = (document.getElementById('txnSearchInput')?.value || '').toLowerCase().trim();
    const typeVal = document.getElementById('txnTypeFilter')?.value || 'ALL';

    const filtered = this.state.recentTransactions.filter(t => {
      if (typeVal !== 'ALL' && t.type !== typeVal) return false;
      if (!searchVal) return true;

      return (
        (t.id && t.id.toLowerCase().includes(searchVal)) ||
        (t.itemName && t.itemName.toLowerCase().includes(searchVal)) ||
        (t.sku && t.sku.toLowerCase().includes(searchVal)) ||
        (t.reference && t.reference.toLowerCase().includes(searchVal)) ||
        (t.performedBy && t.performedBy.toLowerCase().includes(searchVal)) ||
        (t.notes && t.notes.toLowerCase().includes(searchVal))
      );
    });

    this.renderTransactionsTable(filtered);
  },

  // Extract unique categories from items catalog
  getItemCategories: function() {
    const items = this.state.items || [];
    const set = new Set();
    items.forEach(i => {
      if (i.category && String(i.category).trim()) {
        set.add(String(i.category).trim());
      }
    });
    return Array.from(set).sort();
  },

  addPurchaseInvoiceRow: function(defaultItemId = null) {
    this.purchaseInvoiceCounter++;
    const rowId = 'pi_row_' + this.purchaseInvoiceCounter;
    const categories = this.getItemCategories();
    const items = this.state.items || [];

    let targetItem = null;
    if (defaultItemId) {
      targetItem = items.find(i => i.id === defaultItemId || i.code === defaultItemId);
    }

    const selectedCategory = targetItem ? targetItem.category : 'ALL';
    
    // Filter products for this row
    const filteredItems = (selectedCategory && selectedCategory !== 'ALL')
      ? items.filter(i => String(i.category).trim() === selectedCategory)
      : items;

    const rowObj = {
      id: rowId,
      selectedCategory: selectedCategory,
      selectedItemCode: targetItem ? (targetItem.code || targetItem.id) : (filteredItems[0] ? (filteredItems[0].code || filteredItems[0].id) : ''),
      qty: 1
    };
    this.purchaseInvoiceRows.push(rowObj);

    const activeItem = items.find(i => (i.code || i.id) === rowObj.selectedItemCode) || filteredItems[0] || {};
    const rate = activeItem.rate || activeItem.cost || 0;
    const taxPct = activeItem.tax !== undefined ? activeItem.tax : (activeItem.taxPercent || 0);
    const uom = activeItem.uom || activeItem.unit || 'Pcs';
    const code = activeItem.code || activeItem.id || '';

    const tr = document.createElement('tr');
    tr.id = rowId;
    tr.className = 'border-b border-white/5 hover:bg-white/[0.02] transition';

    tr.innerHTML = `
      <td class="py-2 px-2 text-center text-on-surface-variant font-mono text-[11px] row-number">${this.purchaseInvoiceRows.length}</td>
      <td class="py-2 px-2">
        <select onchange="app.onPiCategoryChange('${rowId}')" class="pi-cat-select w-full px-2 py-1.5 bg-[#0a0a0e] border border-white/15 rounded text-xs text-white focus:border-emerald-500 outline-none">
          <option value="ALL">-- All Categories --</option>
          ${categories.map(c => `<option value="${c}" ${c === selectedCategory ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
      </td>
      <td class="py-2 px-2">
        <select onchange="app.onPiProductChange('${rowId}')" class="pi-prod-select w-full px-2 py-1.5 bg-[#0a0a0e] border border-white/15 rounded text-xs text-white focus:border-emerald-500 outline-none">
          ${filteredItems.map(i => `<option value="${i.code || i.id}" ${(i.code || i.id) === rowObj.selectedItemCode ? 'selected' : ''}>[${i.code || i.id}] ${i.name || i.description}</option>`).join('')}
        </select>
      </td>
      <td class="py-2 px-2">
        <input type="text" readonly value="${code}" class="pi-code-input w-full px-2 py-1.5 bg-[#040406] border border-white/10 rounded text-[11px] font-mono font-bold text-on-surface-variant outline-none">
      </td>
      <td class="py-2 px-2">
        <input type="text" readonly value="${uom}" class="pi-uom-input w-full px-1.5 py-1.5 bg-[#040406] border border-white/10 rounded text-[11px] text-center text-on-surface-variant outline-none">
      </td>
      <td class="py-2 px-2">
        <input type="number" step="0.01" min="0" value="${rate}" oninput="app.recalcPiInvoice()" class="pi-rate-input w-full px-2 py-1.5 bg-[#0a0a0e] border border-white/15 rounded text-xs font-mono font-bold text-white text-right focus:border-emerald-500 outline-none">
      </td>
      <td class="py-2 px-2">
        <input type="number" step="0.1" min="0" value="${taxPct}" oninput="app.recalcPiInvoice()" class="pi-tax-input w-full px-1.5 py-1.5 bg-[#0a0a0e] border border-white/15 rounded text-xs font-mono text-center text-white focus:border-emerald-500 outline-none">
      </td>

        <input type="number" min="1" value="1" oninput="app.recalcPiInvoice()" class="pi-qty-input w-full px-2 py-1.5 bg-[#0a0a0e] border border-emerald-500/40 rounded text-xs font-mono font-bold text-emerald-300 text-right focus:border-emerald-500 outline-none">

      <td class="py-2 px-2 text-right font-mono text-xs text-white pi-taxable-display">₹0.00</td>

      <td class="py-2 px-2 text-right font-mono font-bold text-xs text-emerald-400 pi-total-display">₹0.00</td>

  onPiCategoryChange: function(rowId) {
    const tr = document.getElementById(rowId);
    if (!tr) return;
    const catSelect = tr.querySelector('.pi-cat-select');
    const prodSelect = tr.querySelector('.pi-prod-select');
    if (!catSelect || !prodSelect) return;

    const selectedCategory = catSelect.value;
    const items = this.state.items || [];
    const filtered = (selectedCategory && selectedCategory !== 'ALL')
      ? items.filter(i => String(i.category).trim() === selectedCategory)
      : items;

    if (filtered.length === 0) {
      prodSelect.innerHTML = `<option value="">-- No products in this category --</option>`;
    } else {
      prodSelect.innerHTML = filtered.map(i => `<option value="${i.code || i.id}">[${i.code || i.id}] ${i.name || i.description}</option>`).join('');
    }

    this.onPiProductChange(rowId);
  },

  onPiProductChange: function(rowId) {
    const tr = document.getElementById(rowId);
    if (!tr) return;
    const prodSelect = tr.querySelector('.pi-prod-select');
    const codeInput = tr.querySelector('.pi-code-input');
    const uomInput = tr.querySelector('.pi-uom-input');
    const rateInput = tr.querySelector('.pi-rate-input');
    const taxInput = tr.querySelector('.pi-tax-input');

    if (!prodSelect) return;
    const itemCode = prodSelect.value;
    const item = (this.state.items || []).find(i => (i.code || i.id) === itemCode);

    if (item) {
      if (codeInput) codeInput.value = item.code || item.id || '';
      if (uomInput) uomInput.value = item.uom || item.unit || 'Pcs';
      if (rateInput) rateInput.value = item.rate || item.cost || 0;
      if (taxInput) taxInput.value = item.tax !== undefined ? item.tax : (item.taxPercent || 0);
    }

    this.recalcPiInvoice();
  },

  recalcPiInvoice: function() {
    const tbody = document.getElementById('piTableBody');
    if (!tbody) return;
    const rows = tbody.querySelectorAll('tr');

    let invoiceSubtotal = 0;
    let invoiceTotalTax = 0;
    let invoicePayable = 0;

    rows.forEach((tr, index) => {
      const numEl = tr.querySelector('.row-number');
      if (numEl) numEl.innerText = index + 1;

      const rateInput = tr.querySelector('.pi-rate-input');
      const taxInput = tr.querySelector('.pi-tax-input');
      const qtyInput = tr.querySelector('.pi-qty-input');
      const taxableEl = tr.querySelector('.pi-taxable-display');
      const taxEl = tr.querySelector('.pi-tax-display');
      const totalEl = tr.querySelector('.pi-total-display');

      const rate = parseFloat(rateInput ? rateInput.value : 0) || 0;
      const taxPct = parseFloat(taxInput ? taxInput.value : 0) || 0;
      const qty = parseFloat(qtyInput ? qtyInput.value : 0) || 0;

      const taxable = rate * qty;
      const taxAmt = (taxable * taxPct) / 100;
      const total = taxable + taxAmt;

      if (taxableEl) taxableEl.innerText = app.formatCurrency(taxable);
      if (taxEl) taxEl.innerText = app.formatCurrency(taxAmt);
      if (totalEl) totalEl.innerText = app.formatCurrency(total);

      invoiceSubtotal += taxable;
      invoiceTotalTax += taxAmt;
      invoicePayable += total;
    });

    const subtotalEl = document.getElementById('piSubtotal');
    if (subtotalEl) subtotalEl.innerText = app.formatCurrency(invoiceSubtotal);

    const taxTotalEl = document.getElementById('piTotalTax');
    if (taxTotalEl) taxTotalEl.innerText = app.formatCurrency(invoiceTotalTax);

    const payableEl = document.getElementById('piPayableAmount');
    if (payableEl) payableEl.innerText = app.formatCurrency(invoicePayable);
  },

  removePiRow: function(rowId) {
    const tr = document.getElementById(rowId);
    if (tr) tr.remove();
    this.purchaseInvoiceRows = this.purchaseInvoiceRows.filter(r => r.id !== rowId);

    const tbody = document.getElementById('piTableBody');
    if (tbody && tbody.children.length === 0) {
      this.addPurchaseInvoiceRow();
    } else {
      this.recalcPiInvoice();
    }
  },

  savePurchaseInvoice: function() {
    const invoiceNo = document.getElementById('piInvoiceNo').value.trim();
    if (!invoiceNo) {
      this.showToast('Please enter an Invoice Number.', 'error');
      return;
    }
    if (!invoiceNo.startsWith('InvN_')) {
      this.showToast('Invoice Number must start with InvN_ prefix.', 'error');
      return;
    }

    const date = document.getElementById('piDate').value;
    if (!date) {
      this.showToast('Please select an Invoice Date.', 'error');
      return;
    }

    const supSelect = document.getElementById('piSupplier');
    const supplierName = supSelect.value;
    if (!supplierName) {
      this.showToast('Please select a Supplier.', 'error');
      return;
    }
    const selectedSupOption = supSelect.options[supSelect.selectedIndex];
    const supplierCode = selectedSupOption ? (selectedSupOption.getAttribute('data-code') || 'SUP_GEN') : 'SUP_GEN';

    const storeSelect = document.getElementById('piStore');
    const storeCode = storeSelect ? storeSelect.value : 'S_000';
    const storeName = storeSelect && storeSelect.options[storeSelect.selectedIndex] ? storeSelect.options[storeSelect.selectedIndex].text : 'Store';

    const notes = document.getElementById('piNotes').value.trim();
    const receivedBy = document.getElementById('piReceivedBy').value.trim() || 'Store Incharge';

    const tbody = document.getElementById('piTableBody');
    const rows = tbody ? tbody.querySelectorAll('tr') : [];
    const items = [];

    rows.forEach(tr => {
      const prodSelect = tr.querySelector('.pi-prod-select');
      const catSelect = tr.querySelector('.pi-cat-select');
      const codeInput = tr.querySelector('.pi-code-input');
      const uomInput = tr.querySelector('.pi-uom-input');
      const rateInput = tr.querySelector('.pi-rate-input');
      const taxInput = tr.querySelector('.pi-tax-input');
      const qtyInput = tr.querySelector('.pi-qty-input');

      const itemCode = codeInput ? codeInput.value : (prodSelect ? prodSelect.value : '');
      const itemName = prodSelect && prodSelect.options[prodSelect.selectedIndex] ? prodSelect.options[prodSelect.selectedIndex].text : itemCode;
      const category = catSelect ? catSelect.value : '';
      const uom = uomInput ? uomInput.value : 'Pcs';
      const rate = parseFloat(rateInput ? rateInput.value : 0) || 0;
      const taxPercent = parseFloat(taxInput ? taxInput.value : 0) || 0;
      const quantity = parseFloat(qtyInput ? qtyInput.value : 0) || 0;

      if (itemCode && quantity > 0) {
        items.push({
          itemCode: itemCode,
          itemName: itemName,
          category: category,
          uom: uom,
          rate: rate,
          taxPercent: taxPercent,
          quantity: quantity
        });
      }
    });

    if (items.length === 0) {
      this.showToast('Please add at least one item with quantity greater than 0.', 'error');
      return;

    const payload = {
      invoiceNo: invoiceNo,
      date: date,
      supplierCode: supplierCode,
      supplierName: supplierName,
      storeCode: storeCode,
      storeName: storeName,
      notes: notes,
      performedBy: receivedBy,
      items: items
    };

    this.showLoading('Saving Purchase Invoice...', `Recording ${items.length} items to database & updating stock levels`);

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(res) {
          app.hideLoading();
          if (res && res.success) {
            app.closeModal('purchaseInvoiceModal');
            app.showToast(`Invoice ${res.invoiceNo} saved! Payable Amount: ${app.formatCurrency(res.payableAmount)}`);
            if (res.data) {
              app.showDashboard(res.data);
            } else {
              app.loadInitialData(true);
            }
          } else {
            app.showToast((res && res.message) ? res.message : 'Failed to save purchase invoice.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Invoice Save Error: ' + err.message, 'error');
        })
        .recordPurchaseInvoice(payload);
    } else {
      setTimeout(() => {
        app.hideLoading();
        app.closeModal('purchaseInvoiceModal');
        app.showToast(`Purchase Invoice ${payload.invoiceNo} saved (local mode)!`);
      }, 500);
    }
