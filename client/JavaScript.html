  onEditItemNameInput: function(val) {
    const trimmed = String(val || '').trim();
    const errDiv = document.getElementById('editItemNameError');
    const errText = document.getElementById('editItemNameErrorText');
    const submitBtn = document.getElementById('editItemSubmitBtn');

    if (!trimmed) {
      if (errDiv) errDiv.classList.add('hidden');
      return;
    }

    const lower = trimmed.toLowerCase();
    const currentCode = this.currentEditingItemCode;

    const exists = (this.state.items || []).some(it => {
      const itCode = it.code || it.id || it.sku;
      return itCode !== currentCode && String(it.name || it.description || '').trim().toLowerCase() === lower;
    });

    if (exists) {
      if (errDiv) errDiv.classList.remove('hidden');
      if (errText) errText.innerText = `Another product already has name "${trimmed}"! Duplicate product names are not allowed.`;
      if (submitBtn) submitBtn.disabled = true;
    } else {
      if (errDiv) errDiv.classList.add('hidden');
      if (submitBtn) submitBtn.disabled = false;
    }
  },

  toggleDiscontinueCurrentItem: function() {
    const itemCode = this.currentEditingItemCode;
    if (!itemCode) return;
    const item = (this.state.items || []).find(it => (it.code || it.id || it.sku) === itemCode);
    if (!item) return;

    const isDisc = String(item.status || 'Active').toLowerCase() === 'discontinued';
    const targetStatus = isDisc ? 'Active' : 'Discontinued';

    if (!isDisc) {
      if (!confirm(`Are you sure you want to DISCONTINUE "${item.name}" (${itemCode})?\n\nOnce discontinued, purchase entries for this item will be strictly prohibited.`)) {
        return;
      }
    }

    this.showLoading(`${targetStatus === 'Discontinued' ? 'Discontinuing' : 'Reactivating'} Item...`, `Updating status to ${targetStatus}`);

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(res) {
          app.hideLoading();
          app.showToast(`Item ${itemCode} is now ${targetStatus}!`);
          app.closeModal('editItemModal');
          if (res && res.items) {
            app.state.items = res.items;
            app.filterCatalog();
            app.recomputeLocalMetrics();
          } else {
            app.loadInitialData(true);
          }
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Status update error: ' + err.message, 'error');
        })
        .updateItemStatus(itemCode, targetStatus);
    } else {
      setTimeout(() => {
        item.status = targetStatus;
        app.hideLoading();
        app.showToast(`Item ${itemCode} marked ${targetStatus} (local mode)!`);
        app.loadEditItemDetails(item);
      }, 400);
    }
  },

  // Extract unique categories from items catalog
  getItemCategories: function() {
    const items = this.state.items || [];
    const set = new Set();
    items.forEach(i => {
      if (i.category && String(i.category).trim()) {
        set.add(String(i.category).trim());
      }
    });
    return Array.from(set).sort();
  },

    this.purchaseInvoiceCounter++;

    const categories = this.getItemCategories();
    const items = this.state.items || [];

    // Filter out discontinued items from purchase invoice
    const purchasableItems = items.filter(i => String(i.status || 'Active').toLowerCase() !== 'discontinued');

    let targetItem = null;
    if (defaultItemId) {
      targetItem = purchasableItems.find(i => i.id === defaultItemId || i.code === defaultItemId);
      if (!targetItem) {
        const anyItem = items.find(i => i.id === defaultItemId || i.code === defaultItemId);

          this.showToast(`Purchase not allowed! "${anyItem.name}" has been discontinued.`, 'error');
          return;
        }

    // Filter products for this row (purchasable only)

      <td class="py-2 px-2">

  onPiCategoryChange: function(rowId) {
    const tr = document.getElementById(rowId);
    if (!tr) return;
    const catSelect = tr.querySelector('.pi-cat-select');
    const prodSelect = tr.querySelector('.pi-prod-select');
    if (!catSelect || !prodSelect) return;

    const selectedCategory = catSelect.value;
    const items = (this.state.items || []).filter(i => String(i.status || 'Active').toLowerCase() !== 'discontinued');
    const filtered = (selectedCategory && selectedCategory !== 'ALL')
      ? items.filter(i => String(i.category).trim() === selectedCategory)
      : items;

    if (filtered.length === 0) {
      prodSelect.innerHTML = `<option value="">-- No purchasable products in this category --</option>`;
    } else {
      prodSelect.innerHTML = filtered.map(i => `<option value="${i.code || i.id}">[${i.code || i.id}] ${i.name || i.description}</option>`).join('');
    }

    this.onPiProductChange(rowId);
  },

  onPiProductChange: function(rowId) {
    const tr = document.getElementById(rowId);
    if (!tr) return;
    const prodSelect = tr.querySelector('.pi-prod-select');
    const codeInput = tr.querySelector('.pi-code-input');
    const uomInput = tr.querySelector('.pi-uom-input');
    const rateInput = tr.querySelector('.pi-rate-input');
    const taxInput = tr.querySelector('.pi-tax-input');

    if (!prodSelect) return;
    const itemCode = prodSelect.value;
    const item = (this.state.items || []).find(i => (i.code || i.id) === itemCode);

    if (item) {
      if (codeInput) codeInput.value = item.code || item.id || '';
      if (uomInput) uomInput.value = item.uom || item.unit || 'Pcs';
      if (rateInput) rateInput.value = item.rate || item.cost || 0;
      if (taxInput) taxInput.value = item.tax !== undefined ? item.tax : (item.taxPercent || 0);
    }

    this.recalcPiInvoice();
  },

  recalcPiInvoice: function() {
    const tbody = document.getElementById('piTableBody');
    if (!tbody) return;
    const rows = tbody.querySelectorAll('tr');

    let invoiceSubtotal = 0;
    let invoiceTotalTax = 0;
    let invoicePayable = 0;

    rows.forEach((tr, index) => {
      const numEl = tr.querySelector('.row-number');
      if (numEl) numEl.innerText = index + 1;

      const rateInput = tr.querySelector('.pi-rate-input');
      const taxInput = tr.querySelector('.pi-tax-input');
      const qtyInput = tr.querySelector('.pi-qty-input');
      const taxableEl = tr.querySelector('.pi-taxable-display');
      const taxEl = tr.querySelector('.pi-tax-display');
      const totalEl = tr.querySelector('.pi-total-display');

      const rate = parseFloat(rateInput ? rateInput.value : 0) || 0;
      const taxPct = parseFloat(taxInput ? taxInput.value : 0) || 0;
      const qty = parseFloat(qtyInput ? qtyInput.value : 0) || 0;

      const taxable = rate * qty;
      const taxAmt = (taxable * taxPct) / 100;
      const total = taxable + taxAmt;

      if (taxableEl) taxableEl.innerText = app.formatCurrency(taxable);
      if (taxEl) taxEl.innerText = app.formatCurrency(taxAmt);
      if (totalEl) totalEl.innerText = app.formatCurrency(total);

      invoiceSubtotal += taxable;
      invoiceTotalTax += taxAmt;
      invoicePayable += total;
    });

    const subtotalEl = document.getElementById('piSubtotal');
    if (subtotalEl) subtotalEl.innerText = app.formatCurrency(invoiceSubtotal);

    const taxTotalEl = document.getElementById('piTotalTax');
    if (taxTotalEl) taxTotalEl.innerText = app.formatCurrency(invoiceTotalTax);

    const payableEl = document.getElementById('piPayableAmount');
    if (payableEl) payableEl.innerText = app.formatCurrency(invoicePayable);
  },

  removePiRow: function(rowId) {
    const tr = document.getElementById(rowId);
    if (tr) tr.remove();
    this.purchaseInvoiceRows = this.purchaseInvoiceRows.filter(r => r.id !== rowId);

    const tbody = document.getElementById('piTableBody');
    if (tbody && tbody.children.length === 0) {
      this.addPurchaseInvoiceRow();
    } else {
      this.recalcPiInvoice();
    }
  },

  savePurchaseInvoice: function() {
    const invoiceNo = document.getElementById('piInvoiceNo').value.trim();
    if (!invoiceNo) {
      this.showToast('Please enter an Invoice Number.', 'error');
      return;
    }
    if (!invoiceNo.startsWith('InvN_')) {
      this.showToast('Invoice Number must start with InvN_ prefix.', 'error');
      return;
    }

    const date = document.getElementById('piDate').value;
    if (!date) {
      this.showToast('Please select an Invoice Date.', 'error');
      return;
    }

    const supSelect = document.getElementById('piSupplier');
    const supplierName = supSelect.value;
    if (!supplierName) {
      this.showToast('Please select a Supplier.', 'error');
      return;
    }
    const selectedSupOption = supSelect.options[supSelect.selectedIndex];
    const supplierCode = selectedSupOption ? (selectedSupOption.getAttribute('data-code') || 'SUP_GEN') : 'SUP_GEN';

    const storeSelect = document.getElementById('piStore');
    const storeCode = storeSelect ? storeSelect.value : 'S_000';
    const storeName = storeSelect && storeSelect.options[storeSelect.selectedIndex] ? storeSelect.options[storeSelect.selectedIndex].text : 'Store';

    const notes = document.getElementById('piNotes').value.trim();
    const receivedBy = document.getElementById('piReceivedBy').value.trim() || 'Store Incharge';

    const tbody = document.getElementById('piTableBody');
    const rows = tbody ? tbody.querySelectorAll('tr') : [];
    const items = [];
    let hasDiscontinued = false;
    let discontinuedItemName = '';

    rows.forEach(tr => {
      const prodSelect = tr.querySelector('.pi-prod-select');
      const catSelect = tr.querySelector('.pi-cat-select');
      const codeInput = tr.querySelector('.pi-code-input');
      const uomInput = tr.querySelector('.pi-uom-input');
      const rateInput = tr.querySelector('.pi-rate-input');
      const taxInput = tr.querySelector('.pi-tax-input');
      const qtyInput = tr.querySelector('.pi-qty-input');

      const itemCode = codeInput ? codeInput.value : (prodSelect ? prodSelect.value : '');
      const itemName = prodSelect && prodSelect.options[prodSelect.selectedIndex] ? prodSelect.options[prodSelect.selectedIndex].text : itemCode;
      const category = catSelect ? catSelect.value : '';
      const uom = uomInput ? uomInput.value : 'Pcs';
      const rate = parseFloat(rateInput ? rateInput.value : 0) || 0;
      const taxPercent = parseFloat(taxInput ? taxInput.value : 0) || 0;
      const quantity = parseFloat(qtyInput ? qtyInput.value : 0) || 0;

      if (itemCode && quantity > 0) {
        // Discontinue check
        const prodObj = (this.state.items || []).find(i => (i.code || i.id || i.sku) === itemCode);
        if (prodObj && String(prodObj.status || 'Active').toLowerCase() === 'discontinued') {
          hasDiscontinued = true;
          discontinuedItemName = prodObj.name || itemCode;
        }

        items.push({
          itemCode: itemCode,
          itemName: itemName,
          category: category,
          uom: uom,
          rate: rate,
          taxPercent: taxPercent,
          quantity: quantity
        });
      }
    });

    if (hasDiscontinued) {
      this.showToast(`Purchase not allowed! Product "${discontinuedItemName}" has been discontinued.`, 'error');
      return;
    }

    if (items.length === 0) {
      this.showToast('Please add at least one item with quantity greater than 0.', 'error');
      return;
    }

    const payload = {
      invoiceNo: invoiceNo,
      date: date,
      supplierCode: supplierCode,
      supplierName: supplierName,
      storeCode: storeCode,
      storeName: storeName,
      notes: notes,
      performedBy: receivedBy,
      items: items
    };

    this.showLoading('Saving Purchase Invoice...', `Recording ${items.length} items to database & updating stock levels`);

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(res) {
          app.hideLoading();
          if (res && res.success) {
            app.closeModal('purchaseInvoiceModal');
            app.showToast(`Invoice ${res.invoiceNo} saved! Payable Amount: ${app.formatCurrency(res.payableAmount)}`);
            if (res.items) {
              app.state.items = res.items;
              if (res.supplierTransactions) app.state.supplierTransactions = res.supplierTransactions;
              if (res.metrics) app.state.metrics = res.metrics;
              app.renderDashboard();
              app.filterCatalog();
              app.filterTransactions();
            } else if (res.data) {
              app.showDashboard(res.data);
            } else {
              app.loadInitialData(true);
            }
          } else {
            app.showToast((res && res.message) ? res.message : 'Failed to save purchase invoice.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Invoice Save Error: ' + err.message, 'error');
        })
        .recordPurchaseInvoice(payload);
    } else {
      setTimeout(() => {
        app.hideLoading();
        app.closeModal('purchaseInvoiceModal');
        app.showToast(`Purchase Invoice ${payload.invoiceNo} saved (local mode)!`);
      }, 500);
    }
  },

          ${filteredItems.map(i => `<option value="${i.code || i.id}" ${(i.code || i.id) === rowObj.selectedItemCode ? 'selected' : ''}>[${i.code || i.id}] ${i.name || i.description}</option>`).join('')}

  onTiCategoryChange: function(rowId) {
    const tr = document.getElementById(rowId);
    if (!tr) return;
    const catSelect = tr.querySelector('.ti-cat-select');
    const prodSelect = tr.querySelector('.ti-prod-select');
    if (!catSelect || !prodSelect) return;

    const selectedCategory = catSelect.value;
    const items = this.state.items || [];
    const filtered = (selectedCategory && selectedCategory !== 'ALL')
      ? items.filter(i => String(i.category).trim() === selectedCategory)
      : items;

    if (filtered.length === 0) {
      prodSelect.innerHTML = `<option value="">-- No products in this category --</option>`;
    } else {
      prodSelect.innerHTML = filtered.map(i => `<option value="${i.code || i.id}">[${i.code || i.id}] ${i.name || i.description}</option>`).join('');
    }

    this.onTiProductChange(rowId);
  },

  onTiProductChange: function(rowId) {
    const tr = document.getElementById(rowId);
    if (!tr) return;
    const prodSelect = tr.querySelector('.ti-prod-select');
    const codeInput = tr.querySelector('.ti-code-input');
    const uomInput = tr.querySelector('.ti-uom-input');
    const rateInput = tr.querySelector('.ti-rate-input');
    const availBadge = tr.querySelector('.ti-avail-badge');
    const fromStoreCode = document.getElementById('tiFromStore') ? document.getElementById('tiFromStore').value : 'S_000';

    if (!prodSelect) return;
    const itemCode = prodSelect.value;
    const item = (this.state.items || []).find(i => (i.code || i.id) === itemCode);

    if (item) {
      if (codeInput) codeInput.value = item.code || item.id || '';
      const uom = item.uom || item.unit || 'Pcs';
      if (uomInput) uomInput.value = uom;
      if (rateInput) rateInput.value = item.rate || item.cost || 0;

      let avail = 0;
      if (fromStoreCode.includes('S_001')) avail = item.stockS001 || 0;
      else if (fromStoreCode.includes('S_002')) avail = item.stockS002 || 0;
      else avail = item.centralStock || 0;

      if (availBadge) availBadge.innerText = `${avail} ${uom}`;
    }

    this.recalcTiInvoice();
  },

  onTiFromStoreChange: function() {
    const tbody = document.getElementById('tiTableBody');
    if (!tbody) return;
    const rows = tbody.querySelectorAll('tr');
    rows.forEach(tr => {
      this.onTiProductChange(tr.id);
    });
  },

  recalcTiInvoice: function() {
    const tbody = document.getElementById('tiTableBody');
    if (!tbody) return;
    const rows = tbody.querySelectorAll('tr');

    let totalTransferVal = 0;
    let itemCount = 0;

    rows.forEach((tr, index) => {
      const numEl = tr.querySelector('.row-number');
      if (numEl) numEl.innerText = index + 1;

      const rateInput = tr.querySelector('.ti-rate-input');
      const qtyInput = tr.querySelector('.ti-qty-input');
      const totalEl = tr.querySelector('.ti-total-display');

      const rate = parseFloat(rateInput ? rateInput.value : 0) || 0;
      const qty = parseFloat(qtyInput ? qtyInput.value : 0) || 0;
      const total = rate * qty;

      if (totalEl) totalEl.innerText = app.formatCurrency(total);
      if (qty > 0) itemCount++;
      totalTransferVal += total;
    });

    const itemsCountEl = document.getElementById('tiTotalItems');
    if (itemsCountEl) itemsCountEl.innerText = `${itemCount} items`;

    const payableEl = document.getElementById('tiPayableAmount');
    if (payableEl) payableEl.innerText = app.formatCurrency(totalTransferVal);
  },

  removeTiRow: function(rowId) {
    const tr = document.getElementById(rowId);
    if (tr) tr.remove();
    this.transferInvoiceRows = this.transferInvoiceRows.filter(r => r.id !== rowId);

    const tbody = document.getElementById('tiTableBody');
    if (tbody && tbody.children.length === 0) {
      this.addTransferInvoiceRow();
    } else {
      this.recalcTiInvoice();
    }
  },

  saveTransferInvoice: function() {
    const invoiceNo = document.getElementById('tiInvoiceNo').value.trim();
    if (!invoiceNo) {
      this.showToast('Please enter a Transfer Invoice Number.', 'error');
      return;
    }
    if (!invoiceNo.startsWith('InvN_')) {
      this.showToast('Transfer Invoice Number must start with InvN_ prefix.', 'error');
      return;
    }

    const date = document.getElementById('tiDate').value;
    if (!date) {
      this.showToast('Please select a Transfer Date.', 'error');
      return;
    }

    const fromStoreSelect = document.getElementById('tiFromStore');
    const fromStoreCode = fromStoreSelect ? fromStoreSelect.value : 'S_000';
    const fromStoreName = fromStoreSelect && fromStoreSelect.options[fromStoreSelect.selectedIndex] ? fromStoreSelect.options[fromStoreSelect.selectedIndex].text : 'Central Depot';

    const spSelect = document.getElementById('tiSellingPoint');
    const toSellingPointCode = spSelect ? spSelect.value : 'SP_001';
    const toSellingPointName = spSelect && spSelect.options[spSelect.selectedIndex] ? spSelect.options[spSelect.selectedIndex].text : 'Selling Point';

    if (fromStoreCode === toSellingPointCode) {
      this.showToast('Source store and destination selling point cannot be the same store.', 'error');
      return;
    }

    const notes = document.getElementById('tiNotes').value.trim();
    const dispatcher = document.getElementById('tiDispatcher').value.trim() || 'Store Keeper';

    const tbody = document.getElementById('tiTableBody');
    const rows = tbody ? tbody.querySelectorAll('tr') : [];
    const items = [];

    for (let i = 0; i < rows.length; i++) {
      const tr = rows[i];
      const prodSelect = tr.querySelector('.ti-prod-select');
      const catSelect = tr.querySelector('.ti-cat-select');
      const codeInput = tr.querySelector('.ti-code-input');
      const uomInput = tr.querySelector('.ti-uom-input');
      const rateInput = tr.querySelector('.ti-rate-input');
      const qtyInput = tr.querySelector('.ti-qty-input');

      const itemCode = codeInput ? codeInput.value : (prodSelect ? prodSelect.value : '');
      const itemName = prodSelect && prodSelect.options[prodSelect.selectedIndex] ? prodSelect.options[prodSelect.selectedIndex].text : itemCode;
      const category = catSelect ? catSelect.value : '';
      const uom = uomInput ? uomInput.value : 'Pcs';
      const rate = parseFloat(rateInput ? rateInput.value : 0) || 0;
      const quantity = parseFloat(qtyInput ? qtyInput.value : 0) || 0;

      if (itemCode && quantity > 0) {
        // Validate stock availability
        const prodObj = (this.state.items || []).find(it => (it.code || it.id) === itemCode);
        if (prodObj) {
          let avail = 0;
          if (fromStoreCode.includes('S_001')) avail = prodObj.stockS001 || 0;
          else if (fromStoreCode.includes('S_002')) avail = prodObj.stockS002 || 0;
          else avail = prodObj.centralStock || 0;

          if (avail < quantity) {
            this.showToast(`Insufficient stock in ${fromStoreName} for ${prodObj.name || itemCode}. Available: ${avail}, Requested: ${quantity}`, 'error');
            return;
          }
        }

        items.push({
          itemCode: itemCode,
          itemName: itemName,
          category: category,
          uom: uom,
          rate: rate,
          quantity: quantity
        });
      }
    }

    if (items.length === 0) {
      this.showToast('Please add at least one item with transfer quantity greater than 0.', 'error');
      return;
    }

    const payload = {
      invoiceNo: invoiceNo,
      date: date,
      fromStoreCode: fromStoreCode,
      fromStoreName: fromStoreName,
      toSellingPointCode: toSellingPointCode,
      toSellingPointName: toSellingPointName,
      notes: notes,
      performedBy: dispatcher,
      items: items
    };

    this.showLoading('Saving Transfer Invoice...', `Recording ${items.length} items to database & updating store ledgers`);

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(res) {
          app.hideLoading();
          if (res && res.success) {
            app.closeModal('transferInvoiceModal');
            app.showToast(`Transfer Invoice ${res.invoiceNo} saved! Valuation: ${app.formatCurrency(res.payableAmount)}`);
            if (res.items) {
              app.state.items = res.items;
              if (res.issuanceTransactions) app.state.issuanceTransactions = res.issuanceTransactions;
              if (res.metrics) app.state.metrics = res.metrics;
              app.renderDashboard();
              app.filterCatalog();
              app.filterTransactions();
            } else if (res.data) {
              app.showDashboard(res.data);
            } else {
              app.loadInitialData(true);
            }
          } else {
            app.showToast((res && res.message) ? res.message : 'Failed to save transfer invoice.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Transfer Save Error: ' + err.message, 'error');
        })
        .recordTransferInvoice(payload);
    } else {
      setTimeout(() => {
        app.hideLoading();
        app.closeModal('transferInvoiceModal');
        app.showToast(`Transfer Invoice ${payload.invoiceNo} saved (local mode)!`);
      }, 500);
    }
  },

    else if (loc.includes('S_002') || loc.includes('Store 2')) current = item.stockS002 || 0;

    infoEl.innerHTML = `System recorded stock at <span class="font-bold text-slate-800">${loc}</span>: <span class="font-bold text-purple-700">${current} ${item.unit}</span>. Entering a physical count will recalculate discrepancy automatically.`;

  // LIVE CAMERA BARCODE SCANNER
  openScannerModal: function() {
    this.openModal('scannerModal');
    const viewport = document.getElementById('scannerViewport');

    if (typeof Html5Qrcode !== 'undefined') {
      try {
        if (!this.state.html5QrScanner) {
          this.state.html5QrScanner = new Html5Qrcode('scannerViewport');
        }

        const config = { fps: 10, qrbox: { width: 250, height: 160 } };
        this.state.html5QrScanner.start(
          { facingMode: 'environment' },
          config,
          (decodedText) => {
            app.handleScanSuccess(decodedText);
          },
          (error) => {
            // Scanning in progress
          }
        ).catch(err => {
          console.warn('Camera scan not started or permission denied', err);
          viewport.innerHTML = `<div class="p-4 text-center text-slate-300">Camera not accessible or permission denied. Please enter SKU manually below.</div>`;
        });
      } catch (err) {
        console.error('Scanner init error', err);
      }
    }
  },

  closeScannerModal: function() {
    if (this.state.html5QrScanner && this.state.html5QrScanner.isScanning) {
      this.state.html5QrScanner.stop().then(() => {
        app.closeModal('scannerModal');
      }).catch(() => {
        app.closeModal('scannerModal');
      });
    } else {
      this.closeModal('scannerModal');
    }
  },

  handleScanSuccess: function(decodedText) {
    this.closeScannerModal();
    this.processScannedCode(decodedText);
  },

  handleManualScanSubmit: function() {
    const input = document.getElementById('manualBarcodeInput');
    const val = (input ? input.value : '').trim();
    if (!val) return;
    this.closeScannerModal();
    this.processScannedCode(val);
  },

  processScannedCode: function(code) {
    const clean = code.trim().toUpperCase();
    const item = this.state.items.find(i => 
      (i.sku && i.sku.toUpperCase() === clean) || 
      (i.id && i.id.toUpperCase() === clean)
    );

    if (item) {
      this.showToast(`Found Item: ${item.name} (${item.sku})`);
      this.switchTab('inventory');
      const search = document.getElementById('catalogSearchInput');
      if (search) {
        search.value = item.sku;
        this.filterCatalog();
      }
    } else {
      if (confirm(`Scanned SKU "${code}" was not found in catalog. Would you like to create a new item with this SKU?`)) {
        this.openItemModal();
        document.getElementById('itemSku').value = clean;
      }
    }
  },

  // CSV EXPORTERS
  exportCatalogCSV: function() {
    if (!this.state.items || this.state.items.length === 0) {
      this.showToast('No items to export.', 'error');
      return;
    }

    const headers = ['Item ID', 'SKU', 'Item Name', 'Category', 'Unit', 'Central Stock', 'Store 1 Stock', 'Store 2 Stock', 'Total Stock', 'Min Stock', 'Unit Cost', 'Total Valuation', 'Supplier'];
    const rows = this.state.items.map(i => [
      `"${i.id}"`,
      `"${i.sku}"`,
      `"${(i.name || '').replace(/"/g, '""')}"`,
      `"${i.category}"`,
      `"${i.unit}"`,
      i.centralStock || 0,
      i.stockS001 || 0,
      i.stockS002 || 0,
      i.totalStock || 0,
      i.minStock,
      i.unitCost,
      i.totalValue,
      `"${(i.supplier || '').replace(/"/g, '""')}"`
    ]);

    const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement('a');
    link.setAttribute('href', encodedUri);
    link.setAttribute('download', `Zolexora_IMS_Inventory_${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    this.showToast('Inventory catalog exported to CSV!');
  },

  switchSpSection: function(sectionId) {
    this.spActiveSection = sectionId;

    // Ensure POS mode is active
    if (this.state.currentMode !== 'pos') {
      this.state.currentMode = 'pos';
      const navInventory = document.getElementById('sidebar-nav-inventory');
      const navPos = document.getElementById('sidebar-nav-pos');

      const sidebarTabDash = document.getElementById('sidebarTab-dashboard');
      const sidebarTabSp = document.getElementById('sidebarTab-sellingpoint');

      if (sidebarTabDash) sidebarTabDash.className = 'flex-1 py-2 px-2 text-center rounded-lg text-xs font-semibold transition-all text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high cursor-pointer flex items-center justify-center gap-1.5';
      if (sidebarTabSp) sidebarTabSp.className = 'flex-1 py-2 px-2 text-center rounded-lg text-xs font-bold transition-all bg-emerald-600 text-white shadow-sm cursor-pointer flex items-center justify-center gap-1.5';

      if (invActions) invActions.classList.add('hidden');
      if (posActions) {

      if (searchInput) searchInput.placeholder = 'Search bill no, guest, item...';

    panes.forEach(p => p.classList.add('hidden'));
    const spPane = document.getElementById('tabContent-sellingpoint');
    if (spPane) spPane.classList.remove('hidden');

    // Update in-page section tabs styling
    const sectionBtns = document.querySelectorAll('.sp-section-btn');
    sectionBtns.forEach(btn => {
      btn.className = 'sp-section-btn flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest transition cursor-pointer';
    });

    const activeBtn = document.getElementById('spTabBtn-' + sectionId);
    if (activeBtn) {
      activeBtn.className = 'sp-section-btn flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-bold transition bg-emerald-600 text-white shadow cursor-pointer';
    }

    // Update POS sidebar nav items
    const posNavItems = document.querySelectorAll('.pos-nav-item');

      item.className = 'pos-nav-item flex items-center px-md py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all duration-200 group';
    });

    const activePosBtn = document.getElementById('posNavBtn-' + sectionId);
    if (activePosBtn) {
      activePosBtn.className = 'pos-nav-item flex items-center px-md py-3 rounded-lg transition-all duration-200 group bg-emerald-600/20 text-emerald-400 font-semibold shadow-lg shadow-emerald-900/20 border border-emerald-500/30';

    subPanes.forEach(p => p.classList.add('hidden'));

    const targetPane = document.getElementById('spSection-' + sectionId);
    if (targetPane) targetPane.classList.remove('hidden');
  },

  populateSellingPointSelectors: function() {
    const sps = (this.state.sellingPoints && this.state.sellingPoints.length > 0) ? this.state.sellingPoints : [
      { code: 'SP_001', name: 'Front Counter / Retail Sales', type: 'Sales Counter' },
      { code: 'SP_002', name: 'Branch Dispenser Counter', type: 'Dispense Counter' },
      { code: 'SP_003', name: 'Main Production / Operations', type: 'Production & Service' },
      { code: 'SP_004', name: 'Customer Service & Dispatch', type: 'Dispatch Hub' }
    ];

    // Filter selectors across Header, Inventory Dashboard, and Selling Point Dashboard
    const curSp = this.state.spFilter || document.getElementById('spActiveSelect')?.value || 'ALL';
    const spFilterOptions = `<option value="ALL">All Selling Points (${sps.length})</option>` +
      sps.map(sp => `<option value="${sp.code}">[${sp.code}] ${sp.name}</option>`).join('');

    ['headerSellingPointFilter', 'dashSellingPointSelect', 'spActiveSelect'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.innerHTML = spFilterOptions;
        el.value = curSp;
      }
    });

    // Modal selectors
    const modalSpOptions = sps.map(sp => `<option value="${sp.code}">[${sp.code}] ${sp.name}</option>`).join('');
    ['spSaleSpSelect', 'spPurSpSelect', 'spExpSpSelect'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = modalSpOptions;
    });

    // Modal Item selectors
    const items = this.state.items || [];
    const itemOptions = `<option value="">-- Choose Product Item --</option>` +
      items.map(i => `<option value="${i.id || i.sku || i.code}">[${i.sku || i.code || i.id}] ${i.name} (₹${i.rate || i.unitCost || 0})</option>`).join('');

    ['spSaleItemSelect', 'spPurItemSelect'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = itemOptions;
    });

    // RBAC: If current user is locked to an SP, enforce lock state
    const curUser = this.state.currentUser;
    if (curUser) {
      const userLoc = String(curUser.assignedLocation || curUser.assignedStore || 'ALL').trim().toUpperCase();
      const isSpScoped = (curUser.scopeType === 'SELLING_POINT' || userLoc.startsWith('SP_')) && userLoc !== 'ALL';
      if (isSpScoped) {
        ['headerSellingPointFilter', 'dashSellingPointSelect', 'spActiveSelect'].forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.value = userLoc;
            el.disabled = true;
            el.title = `Locked to assigned selling point ${userLoc} by policy`;
            el.classList.add('opacity-75', 'cursor-not-allowed');
          }
        });
        ['spSaleSpSelect', 'spPurSpSelect', 'spExpSpSelect'].forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.value = userLoc;
            el.disabled = true;
          }
        });
      }
    }
  },

  renderSellingPointDashboard: function() {
    this.populateSellingPointSelectors();
    this.filterSellingPointData();
  },

  filterSellingPointData: function() {
    const rawData = this.state.sellingPointTransactions || { sales: [], purchases: [], expenses: [] };
    const spSelect = document.getElementById('spActiveSelect');
    const spCode = (spSelect ? spSelect.value : (this.state.spFilter || 'ALL')).toUpperCase();
    this.state.spFilter = spCode;

    const spBadge = document.getElementById('spCurrentPointBadge');
    if (spBadge) {
      const spLabel = spCode === 'ALL' ? 'ALL SELLING POINTS' : (spSelect && spSelect.selectedIndex >= 0 ? spSelect.options[spSelect.selectedIndex].text : spCode);
      spBadge.innerText = spLabel.toUpperCase();
    }

    const dateFilter = document.getElementById('spDateFilter')?.value || 'ALL';

    const now = new Date();
    const todayStr = now.toISOString().slice(0, 10);
    const yesterdayDate = new Date(now.getTime() - 86400000);
    const yesterdayStr = yesterdayDate.toISOString().slice(0, 10);
    const weekAgoStr = new Date(now.getTime() - 86400000 * 7).toISOString().slice(0, 10);
    const monthStartStr = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);

    const matchesDate = (itemDate, itemIso) => {
      if (dateFilter === 'ALL') return true;
      const d = (itemDate || (itemIso ? itemIso.slice(0, 10) : '')).trim();
      if (!d) return true;
      if (dateFilter === 'TODAY') return d === todayStr;
      if (dateFilter === 'YESTERDAY') return d === yesterdayStr;
      if (dateFilter === 'WEEK') return d >= weekAgoStr;
      if (dateFilter === 'MONTH') return d >= monthStartStr;
      return true;
    };

    const matchesSp = (itemSp) => {
      if (spCode === 'ALL') return true;
      return String(itemSp || '').toUpperCase().includes(spCode);
    };

    // Filter Sales, Purchases, Expenses
    const sales = (rawData.sales || []).filter(s => matchesDate(s.date, s.timestamp) && matchesSp(s.sellingPointCode));
    const purchases = (rawData.purchases || []).filter(p => matchesDate(p.date, p.timestamp) && matchesSp(p.sellingPointCode));
    const expenses = (rawData.expenses || []).filter(e => matchesDate(e.date, e.timestamp) && matchesSp(e.sellingPointCode));

    // Calculate Financial KPIs
    const totalSales = sales.reduce((sum, s) => sum + (Number(s.totalAmount) || 0), 0);
    const totalPurchases = purchases.reduce((sum, p) => sum + (Number(p.totalCost) || 0), 0);
    const totalExpenses = expenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
    const netCashFlow = totalSales - (totalPurchases + totalExpenses);

    let cashSales = 0, upiSales = 0, cardSales = 0;
    let cashCount = 0, upiCount = 0, cardCount = 0;
    sales.forEach(s => {
      const mode = String(s.paymentMode || '').toUpperCase();
      const amt = Number(s.totalAmount) || 0;
      if (mode.includes('CASH')) { cashSales += amt; cashCount++; }
      else if (mode.includes('UPI') || mode.includes('QR')) { upiSales += amt; upiCount++; }
      else if (mode.includes('CARD') || mode.includes('DEBIT') || mode.includes('CREDIT CARD')) { cardSales += amt; cardCount++; }
      else { cashSales += amt; cashCount++; }
    });

    const curr = (this.state.settings && this.state.settings.CURRENCY_SYMBOL) || '₹';
    if (document.getElementById('spMetricSales')) document.getElementById('spMetricSales').innerText = `${curr}${totalSales.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    if (document.getElementById('spMetricSalesCount')) document.getElementById('spMetricSalesCount').innerText = `${sales.length} Bills`;
    if (document.getElementById('spMetricSalesBreakdown')) document.getElementById('spMetricSalesBreakdown').innerText = `Cash: ${curr}${cashSales.toLocaleString()} | Digital: ${curr}${(upiSales + cardSales).toLocaleString()}`;

    if (document.getElementById('spMetricPurchases')) document.getElementById('spMetricPurchases').innerText = `${curr}${totalPurchases.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    if (document.getElementById('spMetricPurchasesCount')) document.getElementById('spMetricPurchasesCount').innerText = `${purchases.length} Deliveries`;
    if (document.getElementById('spMetricPurchasesBreakdown')) document.getElementById('spMetricPurchasesBreakdown').innerText = `Direct & Store Transfers`;

    if (document.getElementById('spMetricExpenses')) document.getElementById('spMetricExpenses').innerText = `${curr}${totalExpenses.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    if (document.getElementById('spMetricExpensesCount')) document.getElementById('spMetricExpensesCount').innerText = `${expenses.length} Vouchers`;
    if (document.getElementById('spMetricExpensesBreakdown')) document.getElementById('spMetricExpensesBreakdown').innerText = `Petty Cash & Ops`;

    const netEl = document.getElementById('spMetricNet');
    if (netEl) {
      netEl.innerText = (netCashFlow >= 0 ? '+' : '') + `${curr}${netCashFlow.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      netEl.className = `font-display-lg text-[28px] font-bold mt-0.5 tracking-tight ${netCashFlow >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
    }
    const marginEl = document.getElementById('spMetricNetMargin');
    if (marginEl) {
      const margin = totalSales > 0 ? ((netCashFlow / totalSales) * 100).toFixed(1) : '0';
      marginEl.innerText = `${margin}% Net Margin`;
      marginEl.className = `font-semibold ${netCashFlow >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
    }

    if (document.getElementById('spSalesBadgeCount')) document.getElementById('spSalesBadgeCount').innerText = sales.length;
    if (document.getElementById('spPurchasesBadgeCount')) document.getElementById('spPurchasesBadgeCount').innerText = purchases.length;
    if (document.getElementById('spExpensesBadgeCount')) document.getElementById('spExpensesBadgeCount').innerText = expenses.length;
    if (document.getElementById('posSidebarSalesBadge')) document.getElementById('posSidebarSalesBadge').innerText = sales.length;
    if (document.getElementById('posSidebarPurchasesBadge')) document.getElementById('posSidebarPurchasesBadge').innerText = purchases.length;
    if (document.getElementById('posSidebarExpensesBadge')) document.getElementById('posSidebarExpensesBadge').innerText = expenses.length;

    this.renderSpOverview(sales, purchases, expenses, totalSales, totalPurchases, totalExpenses, cashSales, upiSales, cardSales, cashCount, upiCount, cardCount, curr);
    this.renderSpSalesTable(sales, curr);
    this.renderSpPurchasesTable(purchases, curr);
    this.renderSpExpensesTable(expenses, curr);
  },

  renderSpOverview: function(sales, purchases, expenses, totalSales, totalPurchases, totalExpenses, cashSales, upiSales, cardSales, cashCount, upiCount, cardCount, curr) {
    const grandSum = totalSales + totalPurchases + totalExpenses || 1;
    const pSales = Math.max(5, Math.round((totalSales / grandSum) * 100));
    const pPur = Math.max(5, Math.round((totalPurchases / grandSum) * 100));
    const pExp = Math.max(5, 100 - pSales - pPur);

    const bSales = document.getElementById('spBarSales');
    if (bSales) bSales.style.width = (totalSales === 0 ? '0%' : pSales + '%');
    const bPur = document.getElementById('spBarPurchases');
    if (bPur) bPur.style.width = (totalPurchases === 0 ? '0%' : pPur + '%');
    const bExp = document.getElementById('spBarExpenses');
    if (bExp) bExp.style.width = (totalExpenses === 0 ? '0%' : pExp + '%');

    if (document.getElementById('spLegendSales')) document.getElementById('spLegendSales').innerText = `${curr}${totalSales.toLocaleString()}`;
    if (document.getElementById('spLegendPurchases')) document.getElementById('spLegendPurchases').innerText = `${curr}${totalPurchases.toLocaleString()}`;
    if (document.getElementById('spLegendExpenses')) document.getElementById('spLegendExpenses').innerText = `${curr}${totalExpenses.toLocaleString()}`;

    if (document.getElementById('spPayCashTotal')) document.getElementById('spPayCashTotal').innerText = `${curr}${cashSales.toLocaleString()}`;
    if (document.getElementById('spPayCashSub')) document.getElementById('spPayCashSub').innerText = `${cashCount} transactions`;
    if (document.getElementById('spPayUpiTotal')) document.getElementById('spPayUpiTotal').innerText = `${curr}${upiSales.toLocaleString()}`;
    if (document.getElementById('spPayUpiSub')) document.getElementById('spPayUpiSub').innerText = `${upiCount} transactions`;
    if (document.getElementById('spPayCardTotal')) document.getElementById('spPayCardTotal').innerText = `${curr}${cardSales.toLocaleString()}`;
    if (document.getElementById('spPayCardSub')) document.getElementById('spPayCardSub').innerText = `${cardCount} transactions`;

    const expCats = {};
    expenses.forEach(e => {
      const c = e.category || 'Petty Cash';
      expCats[c] = (expCats[c] || 0) + (Number(e.amount) || 0);
    });
    const chipsContainer = document.getElementById('spExpenseChipsContainer');
    if (chipsContainer) {
      const catKeys = Object.keys(expCats);
      if (catKeys.length === 0) {
        chipsContainer.innerHTML = `<span class="text-xs text-on-surface-variant py-2">No expenses recorded for this period.</span>`;
      } else {
        chipsContainer.innerHTML = catKeys.map(k => `
          <div class="px-3 py-1.5 rounded-xl bg-surface-container-high border border-outline-variant/20 flex items-center gap-2 text-xs">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
            <span class="text-on-surface font-medium">${k}</span>
            <span class="font-bold text-amber-400">${curr}${expCats[k].toLocaleString()}</span>
          </div>
        `).join('');
      }
    }

    const itemMap = {};
    sales.forEach(s => {
      const name = s.itemName || s.itemCode || 'Item';
      if (!itemMap[name]) itemMap[name] = { qty: 0, revenue: 0, unit: s.unit || 'Pcs' };
      itemMap[name].qty += (Number(s.quantity) || 0);
      itemMap[name].revenue += (Number(s.totalAmount) || 0);
    });
    const topList = Object.entries(itemMap).sort((a, b) => b[1].revenue - a[1].revenue).slice(0, 5);
    const topContainer = document.getElementById('spTopSoldList');
    if (topContainer) {
      if (topList.length === 0) {
        topContainer.innerHTML = `<div class="py-6 text-center text-xs text-on-surface-variant">No sales recorded yet for this selection.</div>`;
      } else {
        topContainer.innerHTML = topList.map(([name, data], idx) => `
          <div class="flex items-center justify-between p-2.5 rounded-xl bg-surface-container-high/50 border border-outline-variant/10 text-xs">
            <div class="flex items-center gap-2.5 min-w-0">
              <span class="w-5 h-5 rounded-full bg-primary/20 text-primary text-[10px] font-bold flex items-center justify-center">${idx + 1}</span>
              <span class="font-semibold text-on-surface truncate">${name}</span>
            </div>
            <div class="text-right flex items-center gap-3">
              <span class="text-[11px] text-on-surface-variant font-data-tabular">${data.qty} ${data.unit}</span>
              <span class="font-bold text-emerald-400 font-data-tabular">${curr}${data.revenue.toLocaleString()}</span>
            </div>
          </div>
        `).join('');
      }
    }

    const combined = [
      ...sales.map(s => ({ type: 'SALE', time: s.timestamp, desc: `${s.itemName || 'Sale'} (${s.quantity} ${s.unit})`, amt: s.totalAmount, ref: s.billNo, sp: s.sellingPointName, by: s.cashier, color: 'text-emerald-400', icon: 'point_of_sale' })),
      ...purchases.map(p => ({ type: 'PURCHASE', time: p.timestamp, desc: `${p.itemName || 'Purchase'} from ${p.source}`, amt: p.totalCost, ref: p.invoiceRef || p.id, sp: p.sellingPointName, by: p.receivedBy, color: 'text-sky-400', icon: 'shopping_bag' })),
      ...expenses.map(e => ({ type: 'EXPENSE', time: e.timestamp, desc: `${e.category}: ${e.notes || e.paidTo}`, amt: e.amount, ref: e.voucherRef || e.id, sp: e.sellingPointName, by: e.recordedBy, color: 'text-amber-400', icon: 'receipt_long' }))
    ].sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0)).slice(0, 15);

    const actContainer = document.getElementById('spRecentActivityList');
    if (actContainer) {
      if (combined.length === 0) {
        actContainer.innerHTML = `<div class="py-8 text-center text-xs text-on-surface-variant">No recent activity found.</div>`;
      } else {
        actContainer.innerHTML = combined.map(act => `
          <div class="flex items-center justify-between p-2 rounded-xl hover:bg-surface-container-high transition text-xs border border-outline-variant/10">
            <div class="flex items-center gap-2 min-w-0">
              <div class="w-7 h-7 rounded-lg bg-surface-container-highest flex items-center justify-center ${act.color}">
                <span class="material-symbols-outlined text-[16px]">${act.icon}</span>
              </div>
              <div class="flex flex-col min-w-0">
                <span class="font-semibold text-on-surface truncate">${act.desc}</span>
                <span class="text-[10px] text-on-surface-variant">${act.ref} • ${act.sp}</span>
              </div>
            </div>
            <div class="text-right">
              <div class="font-bold ${act.color}">${act.type === 'EXPENSE' || act.type === 'PURCHASE' ? '-' : '+'}${curr}${Number(act.amt).toLocaleString()}</div>
              <div class="text-[10px] text-on-surface-variant">${act.time ? new Date(act.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--'}</div>
            </div>
          </div>
        `).join('');
      }
    }
  },

  renderSpSalesTable: function(sales, curr) {
    const search = (document.getElementById('spSaleSearchInput')?.value || '').trim().toLowerCase();
    const modeFilter = document.getElementById('spSaleModeFilter')?.value || 'ALL';

    const filtered = sales.filter(s => {
      if (modeFilter !== 'ALL' && !String(s.paymentMode || '').toUpperCase().includes(modeFilter.toUpperCase())) return false;
      if (search) {
        const text = `${s.billNo} ${s.customerName} ${s.itemName} ${s.itemCode} ${s.cashier} ${s.notes}`.toLowerCase();
        if (!text.includes(search)) return false;
      }
      return true;
    });

    const tbody = document.getElementById('spSalesTableBody');
    if (!tbody) return;

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="12" class="py-10 text-center text-on-surface-variant">No sales records found matching your filters.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(s => {
      const modeColor = String(s.paymentMode).toUpperCase().includes('UPI') ? 'bg-sky-500/20 text-sky-400' :
                        String(s.paymentMode).toUpperCase().includes('CARD') ? 'bg-purple-500/20 text-purple-400' :
                        'bg-emerald-500/20 text-emerald-400';
      return `
        <tr class="hover:bg-surface-container-high/40 transition-colors">
          <td class="py-3 px-4 font-bold text-on-surface">${s.billNo}</td>
          <td class="py-3 px-3 text-on-surface-variant font-data-tabular">${s.timestamp ? new Date(s.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : (s.date || '--')}</td>
          <td class="py-3 px-3 text-on-surface">${s.sellingPointName || s.sellingPointCode}</td>
          <td class="py-3 px-3 font-semibold text-on-surface">${s.itemName || s.itemCode}</td>
          <td class="py-3 px-3 text-right font-data-tabular text-on-surface">${s.quantity} <span class="text-[10px] text-on-surface-variant">${s.unit}</span></td>
          <td class="py-3 px-3 text-right font-data-tabular text-on-surface-variant">${curr}${Number(s.rate).toFixed(2)}</td>
          <td class="py-3 px-3 text-right font-data-tabular text-on-surface-variant">${s.taxPercent}%</td>
          <td class="py-3 px-3 text-right font-bold text-emerald-400 font-data-tabular">${curr}${Number(s.totalAmount).toFixed(2)}</td>
          <td class="py-3 px-3 text-center">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${modeColor}">${s.paymentMode}</span>
          </td>
          <td class="py-3 px-3 text-on-surface-variant truncate max-w-[100px]">${s.customerName}</td>
          <td class="py-3 px-3 text-on-surface-variant">${s.cashier}</td>
          <td class="py-3 px-4 text-center">
            <button onclick="app.viewSpReceipt('${s.id}')" class="px-2 py-1 bg-surface-container-high hover:bg-surface-container-highest text-primary rounded text-[11px] font-semibold transition cursor-pointer" title="View & Print Bill Receipt">
              Receipt
            </button>
          </td>
        </tr>
      `;
    }).join('');
  },

      if (sourceFilter === 'TRANSFER' && !String(p.source).toUpperCase().includes('STORE')) return false;
      if (search) {
        const text = `${p.id} ${p.itemName} ${p.itemCode} ${p.source} ${p.invoiceRef} ${p.receivedBy}`.toLowerCase();
        if (!text.includes(search)) return false;
      }
      return true;
    });

    const tbody = document.getElementById('spPurchasesTableBody');
    if (!tbody) return;

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="12" class="py-10 text-center text-on-surface-variant">No purchase records found matching your filters.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(p => `
      <tr class="hover:bg-surface-container-high/40 transition-colors">
        <td class="py-3 px-4 font-bold text-on-surface">${p.id}</td>
        <td class="py-3 px-3 text-on-surface-variant font-data-tabular">${p.timestamp ? new Date(p.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : (p.date || '--')}</td>
        <td class="py-3 px-3 text-on-surface">${p.sellingPointName || p.sellingPointCode}</td>
        <td class="py-3 px-3 font-semibold text-sky-400">${p.source}</td>
        <td class="py-3 px-3 font-semibold text-on-surface">${p.itemName || p.itemCode}</td>
        <td class="py-3 px-3 text-right font-data-tabular text-on-surface">${p.quantity} <span class="text-[10px] text-on-surface-variant">${p.unit}</span></td>
        <td class="py-3 px-3 text-right font-data-tabular text-on-surface-variant">${curr}${Number(p.costRate).toFixed(2)}</td>
        <td class="py-3 px-3 text-right font-data-tabular text-on-surface-variant">${p.taxPercent}%</td>
        <td class="py-3 px-3 text-right font-bold text-sky-400 font-data-tabular">${curr}${Number(p.totalCost).toFixed(2)}</td>
        <td class="py-3 px-3 text-on-surface-variant font-data-tabular">${p.invoiceRef || '--'}</td>
        <td class="py-3 px-3 text-on-surface-variant">${p.receivedBy}</td>
        <td class="py-3 px-4 text-center">
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400">${p.paymentStatus || 'Paid'}</span>
        </td>
      </tr>
    `).join('');
  },

  renderSpExpensesTable: function(expenses, curr) {
    const search = (document.getElementById('spExpSearchInput')?.value || '').trim().toLowerCase();
    const catFilter = document.getElementById('spExpCategoryFilter')?.value || 'ALL';
    const modeFilter = document.getElementById('spExpModeFilter')?.value || 'ALL';

    const filtered = expenses.filter(e => {
      if (catFilter !== 'ALL' && e.category !== catFilter) return false;
      if (modeFilter !== 'ALL' && !String(e.paymentMode).toUpperCase().includes(modeFilter.toUpperCase())) return false;
      if (search) {
        const text = `${e.voucherRef} ${e.category} ${e.paidTo} ${e.recordedBy} ${e.notes}`.toLowerCase();
        if (!text.includes(search)) return false;
      }
      return true;
    });

    const tbody = document.getElementById('spExpensesTableBody');
    if (!tbody) return;

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10" class="py-10 text-center text-on-surface-variant">No expense vouchers found matching your filters.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(e => `
      <tr class="hover:bg-surface-container-high/40 transition-colors">
        <td class="py-3 px-4 font-bold text-on-surface">${e.voucherRef || e.id}</td>
        <td class="py-3 px-3 text-on-surface-variant font-data-tabular">${e.timestamp ? new Date(e.timestamp).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : (e.date || '--')}</td>
        <td class="py-3 px-3 text-on-surface">${e.sellingPointName || e.sellingPointCode}</td>
        <td class="py-3 px-3">
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-400">${e.category}</span>
        </td>
        <td class="py-3 px-3 font-semibold text-on-surface">${e.paidTo}</td>
        <td class="py-3 px-3 text-center text-on-surface-variant">${e.paymentMode}</td>
        <td class="py-3 px-3 text-right font-bold text-amber-400 font-data-tabular">${curr}${Number(e.amount).toFixed(2)}</td>
        <td class="py-3 px-3 text-on-surface-variant">${e.recordedBy}</td>

  onSpSaleItemSelect: function(itemId) {
    const item = (this.state.items || []).find(i => (i.id === itemId || i.sku === itemId || i.code === itemId));
    if (item) {
      const rate = item.rate || item.unitCost || 0;
      const tax = item.taxPercent || item.tax || 5;
      const stock = item.totalStock || 0;
      if (document.getElementById('spSaleRate')) document.getElementById('spSaleRate').value = rate;
      if (document.getElementById('spSaleTax')) document.getElementById('spSaleTax').value = tax;
      const notice = document.getElementById('spSaleStockNotice');
      if (notice) {
        notice.innerText = `Stock: ${stock} ${item.unit || 'Pcs'}`;
        notice.className = `text-[11px] font-semibold ${stock <= 5 ? 'text-amber-400' : 'text-emerald-400'}`;
      }
    }
    this.calculateSpSaleTotal();
  },

  calculateSpSaleTotal: function() {
    const qty = parseFloat(document.getElementById('spSaleQuantity')?.value) || 0;
    const rate = parseFloat(document.getElementById('spSaleRate')?.value) || 0;
    const taxPct = parseFloat(document.getElementById('spSaleTax')?.value) || 0;
    const subtotal = qty * rate;
    const taxAmt = (subtotal * taxPct) / 100;
    const total = subtotal + taxAmt;
    const curr = (this.state.settings && this.state.settings.CURRENCY_SYMBOL) || '₹';

    if (document.getElementById('spSaleSubtotalDisplay')) document.getElementById('spSaleSubtotalDisplay').innerText = `${curr}${subtotal.toFixed(2)}`;
    if (document.getElementById('spSaleTaxAmountDisplay')) document.getElementById('spSaleTaxAmountDisplay').innerText = `${curr}${taxAmt.toFixed(2)}`;
    if (document.getElementById('spSaleTotalDisplay')) document.getElementById('spSaleTotalDisplay').innerText = `${curr}${total.toFixed(2)}`;
  },

  submitSpSale: function(e) {
    e.preventDefault();
    const spSelect = document.getElementById('spSaleSpSelect');
    const itemSelect = document.getElementById('spSaleItemSelect');
    const selectedItem = (this.state.items || []).find(i => (i.id === itemSelect.value || i.sku === itemSelect.value));

    const qty = parseFloat(document.getElementById('spSaleQuantity').value) || 1;
    const rate = parseFloat(document.getElementById('spSaleRate').value) || 0;
    const taxPct = parseFloat(document.getElementById('spSaleTax').value) || 0;
    const totalAmt = qty * rate * (1 + taxPct / 100);

    const salePayload = {
      sellingPointCode: spSelect.value,
      sellingPointName: spSelect.options[spSelect.selectedIndex]?.text || spSelect.value,
      billNo: document.getElementById('spSaleBillNo').value || ('POS-' + Date.now().toString().slice(-4)),
      customerName: document.getElementById('spSaleCustomer').value || 'Walk-in Customer',
      paymentMode: document.getElementById('spSalePaymentMode').value,
      itemCode: selectedItem ? (selectedItem.sku || selectedItem.id) : itemSelect.value,
      itemName: selectedItem ? selectedItem.name : 'Counter Item',
      category: selectedItem ? selectedItem.category : 'General',
      quantity: qty,
      unit: selectedItem ? selectedItem.unit : 'Pcs',
      rate: rate,
      taxPercent: taxPct,
      totalAmount: totalAmt,
      cashier: document.getElementById('spSaleCashier').value || 'Cashier',
      notes: document.getElementById('spSaleNotes').value || '',
      timestamp: new Date().toISOString(),
      date: new Date().toISOString().slice(0, 10),
      id: 'SALE_' + Date.now()
    };

    this.showLoading('Recording Sale...', 'Writing POS bill to Google Sheets');

    const onComplete = (res) => {
      this.hideLoading();
      this.closeModal('spSaleModal');
      if (!this.state.sellingPointTransactions) this.state.sellingPointTransactions = { sales: [], purchases: [], expenses: [] };
      if (!this.state.sellingPointTransactions.sales) this.state.sellingPointTransactions.sales = [];
      this.state.sellingPointTransactions.sales.unshift(salePayload);

      if (selectedItem) {
        selectedItem.totalStock = Math.max(0, (selectedItem.totalStock || 0) - qty);
      }

      this.showToast(`Sale recorded successfully! Bill: ${salePayload.billNo}`, 'success');
      this.renderSellingPointDashboard();
      this.viewSpReceipt(salePayload.id);
    };

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(onComplete)
        .withFailureHandler((err) => {
          this.hideLoading();
          this.showToast('Error saving sale: ' + err.message, 'error');
        })
        .recordSellingPointSale(salePayload);
    } else {
      setTimeout(() => onComplete({ success: true }), 300);
    }
  },

    const orgName = (this.state.settings && this.state.settings.HOTEL_NAME) || 'Zolexora IMS';

  downloadCsvBlob: function(csvContent, filename) {
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.setAttribute('download', filename);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  },

  refreshSellingPointData: function() {
    const icon = document.getElementById('spRefreshIcon');
    if (icon) icon.classList.add('animate-spin');
    this.showToast('Syncing Selling Point records from Google Sheets...', 'info');

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler((res) => {
          if (icon) icon.classList.remove('animate-spin');
          if (res && res.data) {
            this.state.sellingPointTransactions = res.data;
            if (res.sellingPoints) this.state.sellingPoints = res.sellingPoints;
            this.renderSellingPointDashboard();
            this.showToast('Selling Point records updated!');
          }
        })
        .withFailureHandler((err) => {
          if (icon) icon.classList.remove('animate-spin');
          this.showToast('Sync failed: ' + err.message, 'error');
        })
        .fetchSellingPointData();
    } else {
      setTimeout(() => {
        if (icon) icon.classList.remove('animate-spin');
        this.renderSellingPointDashboard();
        this.showToast('Selling Point records up to date!');
      }, 400);
    }
  },
