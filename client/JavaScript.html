<script>
/**
 * Zolexora IMS - CLIENT APPLICATION LOGIC
 */

// Native Cloudflare D1 Edge RPC Bridge: seamlessly bridges google.script.run to Cloudflare D1
(function() {
  if (typeof window !== 'undefined' && (!window.google || !window.google.script || !window.google.script.run)) {
    window.google = window.google || {};
    window.google.script = window.google.script || {};
    function createD1Bridge(successHandler, failureHandler) {
      return new Proxy({}, {
        get(target, prop) {
          if (prop === 'withSuccessHandler') return function(fn) { return createD1Bridge(fn, failureHandler); };
          if (prop === 'withFailureHandler') return function(fn) { return createD1Bridge(successHandler, fn); };
          return async function(...args) {
            try {
              var res = await fetch('/api/rpc/' + prop, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ args: args })
              });
              var data = await res.json();
              if (successHandler) successHandler(data);
              return data;
            } catch (err) {
              if (failureHandler) failureHandler(err);
              else console.error('D1 RPC error on ' + prop, err);
              throw err;
            }
          };
        }
      });
    }
    window.google.script.run = createD1Bridge();
    window.ZOLEXORA_DB_ENGINE = 'Cloudflare D1 (Serverless SQL)';
  }
})();

const app = {
  state: {
    dbInfo: {},
    metrics: {},
    items: [],
    suppliers: [],
    departments: [],
    locations: [],
    users: [],
    currentUser: null,
    settings: { CURRENCY_SYMBOL: '₹', HOTEL_NAME: 'Zolexora IMS' },
    recentTransactions: [],
    activeTab: 'dashboard',
    currentMode: 'inventory',
    propertyFilter: 'ALL',
    spFilter: 'ALL',
    categoryChart: null,
    html5QrScanner: null
  },

  authUser: null,
  detectedGoogleEmail: null,

  // Initialize App
  init: function() {
    const path = (window.location.pathname || '').toLowerCase();
    const hash = (window.location.hash || '').toLowerCase();
    const search = (window.location.search || '').toLowerCase();
    const isLoginRoute = path.includes('/login') || path.includes('/signin') || hash === '#login' || search.includes('login');
    const isSignupRoute = path.includes('/signup') || hash === '#signup' || search.includes('signup');

    const stored = localStorage.getItem('zolexora_auth_user');
    if (stored) {
      try {
        const user = JSON.parse(stored);
        if (user && user.email) {
          this.state.authUser = user;
          this.showLoading('Connecting to Workspace...', 'Opening ' + (user.orgName || 'organization'));
          if (this.isGasEnv()) {
            google.script.run
              .withSuccessHandler(function(res) {
                app.hideLoading();
                if (res && res.success) {
                  app.state.authUser = res.user;
                  app.showDashboard(res.data);
                } else {
                  localStorage.removeItem('zolexora_auth_user');
                  if (isLoginRoute) app.navigateTo('login');
                  else if (isSignupRoute) app.navigateTo('signup');
                  else app.showAuthView();
                }
              })
              .withFailureHandler(function(err) {
                app.hideLoading();
                if (isLoginRoute) app.navigateTo('login');
                else if (isSignupRoute) app.navigateTo('signup');
                else app.showAuthView();
              })
              .checkUserSession(user.email, user.orgId);
            return;
          } else {
            this.hideLoading();
            this.showDashboard(this.getMockData());
            return;
          }
        }
      } catch (e) {
        localStorage.removeItem('zolexora_auth_user');
      }
    }

    if (isLoginRoute) {
      this.navigateTo('login');
    } else if (isSignupRoute) {
      this.navigateTo('signup');
    } else {
      this.showAuthView();
    }
  },

  navigateTo: function(route) {
    const homeView = document.getElementById('commercialLandingView');
    const loginView = document.getElementById('loginPageView');
    const signupView = document.getElementById('signupPageView');
    const dashView = document.getElementById('appDashboardContainer');

    if (homeView) homeView.classList.add('hidden');
    if (loginView) loginView.classList.add('hidden');
    if (signupView) signupView.classList.add('hidden');
    if (dashView) dashView.classList.add('hidden');

    if (route === 'login') {
      if (loginView) loginView.classList.remove('hidden');
      const savedEmail = localStorage.getItem('zolexora_saved_email') || 'abhishekofficial4577@gmail.com';
      const emailInp = document.getElementById('loginEmailInput');
      const pwInp = document.getElementById('loginPasswordInput');
      if (emailInp && !emailInp.value) {
        emailInp.value = savedEmail;
      }
      if (pwInp && !pwInp.value) {
        pwInp.value = 'Admin@123';
      }
      window.scrollTo(0, 0);
    } else if (route === 'signup') {
      if (signupView) signupView.classList.remove('hidden');
      const savedEmail = localStorage.getItem('zolexora_saved_email');
      const regEmailInp = document.getElementById('regAdminEmail');
      if (savedEmail && regEmailInp && !regEmailInp.value) {
        regEmailInp.value = savedEmail;
      }
      const adminNameInp = document.getElementById('regAdminName');
      if (adminNameInp) adminNameInp.focus();
      window.scrollTo(0, 0);
    } else if (route === 'dashboard') {
      if (dashView) dashView.classList.remove('hidden');
      window.scrollTo(0, 0);
    } else {
      // default: home
      if (homeView) homeView.classList.remove('hidden');
      window.scrollTo(0, 0);
    }
  },

  showAuthView: function() {
    this.navigateTo('home');
  },

  openAuthModal: function(mode = 'signin') {
    this.navigateTo(mode === 'signup' ? 'signup' : 'login');
  },

  closeAuthModal: function() {
    this.navigateTo('home');
  },

  togglePasswordVisibility: function(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input) return;
    if (input.type === 'password') {
      input.type = 'text';
      if (icon) icon.innerText = 'visibility_off';
    } else {
      input.type = 'password';
      if (icon) icon.innerText = 'visibility';
    }
  },

  handleEmailPasswordLogin: function(e) {
    if (e) e.preventDefault();
    const emailInp = document.getElementById('loginEmailInput');
    const pwInp = document.getElementById('loginPasswordInput');
    const email = (emailInp ? emailInp.value : '').trim();
    const password = (pwInp ? pwInp.value : '').trim() || 'Admin@123';

    if (!email) {
      this.showToast('Please enter your email address.', 'error');
      if (emailInp) emailInp.focus();
      return;
    }

    const remember = document.getElementById('rememberEmailCheckbox') ? document.getElementById('rememberEmailCheckbox').checked : true;
    if (remember) {
      localStorage.setItem('zolexora_saved_email', email);
    } else {
      localStorage.removeItem('zolexora_saved_email');
    }

    this.showLoading('Signing in...', 'Authenticating with Cloud D1 Database');

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(res) {
          app.hideLoading();
          if (res && res.success) {
            app.state.authUser = res.user;
            localStorage.setItem('zolexora_auth_user', JSON.stringify(res.user));
            app.showDashboard(res.data);
            app.showToast('Welcome back, ' + (res.user.name || res.user.email) + '!');
          } else {
            const err = (res && (res.message || res.error)) ? (res.message || res.error) : 'Invalid credentials. Default password is Admin@123';
            app.showToast(err, 'error');
          }
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Login error: ' + (err.message || err), 'error');
        })
        .loginUser({ email: email, password: password });
    } else {
      setTimeout(() => {
        app.hideLoading();
        const mockUser = {
          id: 'USR_ADMIN_001',
          email: email,
          name: 'Abhishek Sharma',
          role: 'OrgAdmin',
          orgId: 'mock_org',
          orgName: 'Zolexora IMS'
        };
        app.state.authUser = mockUser;
        localStorage.setItem('zolexora_auth_user', JSON.stringify(mockUser));
        app.showDashboard(app.getMockData());
        app.showToast('Signed in successfully!');
      }, 600);
    }
  },

  quickLogin: function(email, password = 'Admin@123') {
    this.navigateTo('login');
    const emailInp = document.getElementById('loginEmailInput');
    const pwInp = document.getElementById('loginPasswordInput');
    if (emailInp) emailInp.value = email;
    if (pwInp) pwInp.value = password;
    this.handleEmailPasswordLogin();
  },

  handleEmailPasswordRegister: function(e) {
    if (e) e.preventDefault();
    const name = document.getElementById('regAdminName').value.trim();
    const email = document.getElementById('regAdminEmail').value.trim();
    const password = document.getElementById('regAdminPassword').value.trim();
    const orgName = document.getElementById('regOrgName').value.trim();
    const industry = document.getElementById('regIndustry').value;
    const currency = document.getElementById('regCurrency').value;
    const storeName = document.getElementById('regStoreName').value.trim();

    if (!name || !email || !password || !orgName) {
      this.showToast('Please fill in all required fields.', 'error');
      return;
    }

    if (password.length < 6) {
      this.showToast('Password must be at least 6 characters long.', 'error');
      return;
    }

    localStorage.setItem('zolexora_saved_email', email);

    this.showLoading('Creating Organization Workspace...', 'Provisioning multi-tenant database & registering Admin');

    const regData = {
      name: name,
      email: email,
      password: password,
      orgName: orgName,
      industry: industry,
      currency: currency || '₹',
      storeName: storeName || 'Main Central Warehouse'
    };

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(res) {
          app.hideLoading();
          if (res && res.success) {
            app.state.authUser = res.user;
            localStorage.setItem('zolexora_auth_user', JSON.stringify(res.user));
            app.showDashboard(res.data);
            app.showToast('Workspace provisioned! You are Admin of ' + res.user.orgName);
          } else {
            app.showToast((res && res.message) ? res.message : 'Registration failed.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Registration error: ' + err.message, 'error');
        })
        .registerUser(regData);
    } else {
      setTimeout(() => {
        app.hideLoading();
        const mockUser = {
          id: 'USR_NEW_ADMIN',
          email: email,
          name: name,
          role: 'OrgAdmin',
          orgId: 'mock_org',
          orgName: orgName
        };
        app.state.authUser = mockUser;
        localStorage.setItem('zolexora_auth_user', JSON.stringify(mockUser));
        app.showDashboard(app.getMockData());
        app.showToast('Workspace created! You are Admin of ' + orgName);
      }, 1000);
    }
  },

  showDashboard: function(data) {
    this.navigateTo('dashboard');
    this.switchMode(this.state.currentMode || 'inventory');

    // Update user profile badges
    if (this.state.authUser) {
      const u = this.state.authUser;
      const dUser = document.getElementById('dropdownUserName');
      const dRole = document.getElementById('dropdownUserRole');
      if (dUser) dUser.innerText = u.name || u.email;
      if (dRole) dRole.innerText = u.role || 'System Administrator & Manager';
      const dOrg = document.getElementById('dropdownOrgName');
      if (dOrg && u.orgName) dOrg.innerText = u.orgName;
    }

    this.handleInitialDataSuccess(data);
  },



  logoutUser: function() {
    localStorage.removeItem('zolexora_auth_user');
    sessionStorage.clear();
    this.state.authUser = null;
    this.showAuthView();
    if (this.isGasEnv()) {
      google.script.run.logoutUser();
    }
    this.showToast('Signed out successfully.');
  },

  // Check if running inside Google Apps Script environment
  isGasEnv: function() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  },

  // Show Global Loading
  showLoading: function(title, subtitle) {
    const el = document.getElementById('loadingOverlay');
    if (el) {
      if (title) document.getElementById('loadingTitle').innerText = title;
      if (subtitle) document.getElementById('loadingSubtitle').innerText = subtitle;
      el.classList.remove('hidden');
    }
  },

  hideLoading: function() {
    const el = document.getElementById('loadingOverlay');
    if (el) el.classList.add('hidden');
    const refreshIcon = document.getElementById('refreshIcon');
    if (refreshIcon) refreshIcon.classList.remove('fa-spin');
  },

  // Toast System
  showToast: function(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = `toast-enter pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-xs font-semibold flex items-center space-x-2.5 max-w-sm border ${
      type === 'success' ? 'bg-emerald-900 text-emerald-100 border-emerald-700' :
      type === 'error' ? 'bg-rose-900 text-rose-100 border-rose-700' :
      'bg-slate-900 text-slate-100 border-slate-700'
    }`;

    const icon = type === 'success' ? 'fa-circle-check text-emerald-400' :
                 type === 'error' ? 'fa-circle-exclamation text-rose-400' :
                 'fa-circle-info text-amber-400';

    toast.innerHTML = `
      <i class="fa-solid ${icon} text-base flex-shrink-0"></i>
      <div class="flex-1">${message}</div>
      <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white">&times;</button>
    `;

    container.appendChild(toast);
    setTimeout(() => {
      if (toast.parentElement) toast.remove();
    }, 4500);
  },

  // Load Initial Data from Backend
  loadInitialData: function(isRefresh = false) {
    const refreshIcon = document.getElementById('refreshIcon');
    if (refreshIcon) refreshIcon.classList.add('fa-spin');
    
    if (isRefresh) {
      this.showToast('Refreshing inventory from Google Sheets...', 'info');
    }

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(response) {
          app.handleInitialDataSuccess(response);
          if (isRefresh) app.showToast('Database up to date!');
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Error loading database: ' + err.message, 'error');
        })
        .getInitialData();
    } else {
      // Local preview mock fallback
      console.warn('Google Apps Script environment not detected. Using sample mock database.');
      setTimeout(() => {
        app.handleInitialDataSuccess(app.getMockData());
      }, 300);
    }
  },

  handleInitialDataSuccess: function(data) {
    this.hideLoading();
    if (!data) return;

    this.state.workbooksInfo = data.workbooksInfo || {};
    this.state.dbInfo = data.dbInfo || (data.workbooksInfo ? data.workbooksInfo.folder : {});
    this.state.activeOrganization = data.activeOrganization || (data.workbooksInfo ? data.workbooksInfo.activeOrganization : null);
    this.state.organizations = data.organizations || (data.workbooksInfo ? data.workbooksInfo.organizations : []);
    this.state.hasOrganization = data.hasOrganization !== false;

    // If user is not authenticated, redirect to auth landing view
    if (!this.state.authUser) {
      this.showAuthView();
      return;
    }

    this.state.metrics = data.metrics || {};
    this.state.items = data.items || [];
    this.state.suppliers = data.suppliers || [];
    this.state.stores = data.stores || [];
    this.state.sellingPoints = data.sellingPoints || [];
    this.state.sellingPointTransactions = data.sellingPointTransactions || { sales: [], purchases: [], expenses: [] };
    this.state.departments = data.departments || [];
    this.state.locations = data.locations || [];
    this.state.users = data.users || [];
    this.state.settings = data.settings || { CURRENCY_SYMBOL: '₹', HOTEL_NAME: 'Zolexora IMS' };

    // Resolve active operational persona (RBAC Scope)
    if (!this.state.currentUser && this.state.users && this.state.users.length > 0) {
      const authEmail = (this.state.authUser && this.state.authUser.email) ? this.state.authUser.email.toLowerCase() : '';
      const matchedUser = this.state.users.find(u => u.email && u.email.toLowerCase() === authEmail);
      this.state.currentUser = matchedUser || this.state.users[0];
    }

    const currentOrgName = (this.state.activeOrganization && this.state.activeOrganization.name) 
      ? this.state.activeOrganization.name 
      : (this.state.settings.HOTEL_NAME || 'Zolexora IMS');

    this.state.settings.HOTEL_NAME = currentOrgName;

    // Update active organization headers, command cards & sidebar
    ['headerOrgName', 'dashOrgName', 'posOrgName', 'sidebarHotelName', 'dropdownOrgName'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerText = currentOrgName;
    });

    const firstLetter = currentOrgName.trim().charAt(0).toUpperCase() || 'S';
    ['headerOrgAvatarLetter', 'dashOrgAvatarLetter', 'posOrgAvatarLetter', 'sidebarOrgAvatarLetter'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerText = firstLetter;
    });

    // Update Nav Count
    const navBadge = document.getElementById('navTotalItemsBadge');
    if (navBadge) navBadge.innerText = this.state.items.length;

    // Update Google Sheet links and Multi-Workbook grid
    this.updateGoogleSheetLinks();

    // Populate dropdowns across modals with real suppliers, stores, and selling points
    this.populateAllSelectDropdowns();

    // Render components
    this.renderDashboard();
    this.filterCatalog();
    this.filterTransactions();
    this.renderSuppliers();
    this.renderDepartmentsAndLocations();
    this.renderSettingsTab();
    this.renderSellingPointDashboard();
    this.renderUsersTable();
    this.applyUserPermissions();
    this.switchTab(this.state.activeTab || 'dashboard');
  },

  // ==========================================
  // MULTI-ORGANIZATION MANAGEMENT
  // ==========================================
  openOrgModal: function(defaultTab = 'create', allowClose = true) {
    const modal = document.getElementById('orgModal');
    if (!modal) return;
    modal.classList.remove('hidden');

    const closeBtn = document.getElementById('orgModalCloseBtn');
    const isLocked = !allowClose || (!this.state.activeOrganization || !this.state.hasOrganization);
    if (closeBtn) {
      if (isLocked) {
        closeBtn.classList.add('hidden');
      } else {
        closeBtn.classList.remove('hidden');
      }
    }

    this.switchOrgTab(defaultTab);
    this.renderOrgList();
  },

  closeOrgModal: function() {
    if (!this.state.hasOrganization || !this.state.activeOrganization) {
      this.showToast('Please create or select an organization database first.', 'warning');
      return;
    }
    const modal = document.getElementById('orgModal');
    if (modal) modal.classList.add('hidden');
  },

  handleOrgBackdropClick: function() {
    if (!this.state.hasOrganization || !this.state.activeOrganization) {
      return;
    }
    this.closeOrgModal();
  },

  switchOrgTab: function(tab) {
    const secSwitch = document.getElementById('orgSectionSwitch');
    const secCreate = document.getElementById('orgSectionCreate');
    const btnSwitch = document.getElementById('tabSwitchOrgBtn');
    const btnCreate = document.getElementById('tabCreateOrgBtn');

    if (tab === 'create') {
      if (secSwitch) secSwitch.classList.add('hidden');
      if (secCreate) secCreate.classList.remove('hidden');
      if (btnSwitch) {
        btnSwitch.className = 'pb-2 border-b-2 border-transparent text-on-surface-variant hover:text-on-surface font-semibold text-xs flex items-center gap-1.5 transition cursor-pointer';
      }
      if (btnCreate) {
        btnCreate.className = 'pb-2 border-b-2 border-primary text-primary font-bold text-xs flex items-center gap-1.5 transition cursor-pointer';
      }
      const nameInput = document.getElementById('newOrgName');
      if (nameInput) setTimeout(() => nameInput.focus(), 100);
    } else {
      if (secCreate) secCreate.classList.add('hidden');
      if (secSwitch) secSwitch.classList.remove('hidden');
      if (btnCreate) {
        btnCreate.className = 'pb-2 border-b-2 border-transparent text-on-surface-variant hover:text-on-surface font-semibold text-xs flex items-center gap-1.5 transition cursor-pointer';
      }
      if (btnSwitch) {
        btnSwitch.className = 'pb-2 border-b-2 border-primary text-primary font-bold text-xs flex items-center gap-1.5 transition cursor-pointer';
      }
      this.renderOrgList();
    }
  },

  renderOrgList: function() {
    const container = document.getElementById('orgListContainer');
    if (!container) return;

    const orgs = this.state.organizations || [];
    const activeId = this.state.activeOrganization ? this.state.activeOrganization.id : '';

    if (orgs.length === 0) {
      container.innerHTML = `
        <div class="bg-surface-container-high/40 rounded-xl p-6 text-center space-y-3 border border-outline-variant/10">
          <span class="material-symbols-outlined text-primary text-[32px]">domain_disabled</span>
          <div>
            <h4 class="font-bold text-on-surface text-sm">No Organizations Found Yet</h4>
            <p class="text-on-surface-variant text-xs mt-1">Create your first organization database in Drive folder 1lkSx36mqaqnF8gfqNswdSPb0zqY4lvOx.</p>
          </div>
          <button type="button" onclick="app.switchOrgTab('create')" class="px-4 py-2 bg-primary text-on-primary font-bold text-xs rounded-lg shadow inline-flex items-center gap-1.5 cursor-pointer">
            <span class="material-symbols-outlined text-[16px]">add_circle</span>
            <span>Create Organization Database</span>
          </button>
        </div>
      `;
      return;
    }

    container.innerHTML = orgs.map(org => {
      const isActive = org.id === activeId;
      return `
        <div class="flex items-center justify-between p-3.5 rounded-xl border transition ${
          isActive 
            ? 'bg-primary/10 border-primary/40 shadow-sm' 
            : 'bg-surface-container-high hover:bg-surface-container-highest border-outline-variant/20'
        }">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-8 h-8 rounded-lg ${isActive ? 'bg-primary text-on-primary' : 'bg-surface-container text-on-surface-variant'} flex items-center justify-center font-bold text-xs flex-shrink-0">
              <span class="material-symbols-outlined text-[18px]">domain</span>
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <span class="font-bold text-on-surface text-xs truncate">${org.name}</span>
                ${isActive ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-primary text-on-primary">Active</span>' : ''}
              </div>
              <p class="text-[11px] text-on-surface-variant font-mono truncate">ID: ${org.id}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 flex-shrink-0">
            <a href="${org.url}" target="_blank" title="Open Organization Folder in Google Drive" class="p-1.5 rounded-lg text-on-surface-variant hover:text-primary hover:bg-surface-container transition">
              <span class="material-symbols-outlined text-[18px]">open_in_new</span>
            </a>
            ${isActive 
              ? '<span class="text-xs text-primary font-semibold px-2.5 py-1">Current Database</span>' 
              : `<button type="button" onclick="app.switchOrganization('${org.id}')" class="px-3 py-1.5 bg-surface-container-highest hover:bg-primary hover:text-on-primary text-on-surface text-xs font-bold rounded-lg transition border border-outline-variant/20 cursor-pointer">
                  Switch
                </button>`
            }
          </div>
        </div>
      `;
    }).join('');
  },

  handleCreateOrgSubmit: function(e) {
    if (e) e.preventDefault();
    const name = document.getElementById('newOrgName').value.trim();
    const storeName = document.getElementById('newOrgStoreName').value.trim();
    const industry = document.getElementById('newOrgIndustry') ? document.getElementById('newOrgIndustry').value : 'Hospitality & Hotels';
    const currency = document.getElementById('newOrgCurrency').value;
    const adminName = document.getElementById('newOrgAdminName').value.trim();
    const adminEmail = document.getElementById('newOrgAdminEmail').value.trim();

    if (!name) {
      this.showToast('Please enter an organization name.', 'error');
      return;
    }

    this.showLoading('Provisioning Organization Database...', 'Creating folder "' + name + '" & structured tree in Google Drive');

    const orgData = {
      name: name,
      storeName: storeName || 'Main Central Warehouse',
      industry: industry,
      currency: currency || '₹',
      adminName: adminName || 'Zolexora Admin',
      adminEmail: adminEmail || 'abhishekofficial4577@gmail.com'
    };

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(data) {
          app.hideLoading();
          app.closeOrgModal();

  renderDriveDirectoryTree: function(tree) {
    const container = document.getElementById('driveDirectoryTreeContainer');
    if (!container) return;

    if (!tree) {
      container.innerHTML = `

            <span class="material-symbols-outlined text-[16px]">folder_open</span>

          </div>
          <div class="pl-4 space-y-1 text-on-surface">
            <div>├── <span class="text-secondary font-semibold"><span class="material-symbols-outlined text-[14px] align-middle">folder</span> 01_Master_Databases/</span></div>
            <div class="pl-6 text-on-surface-variant">│   ├── <span class="material-symbols-outlined text-[14px] align-middle text-emerald-400">table_chart</span> Location_Master</div>
            <div class="pl-6 text-on-surface-variant">│   ├── <span class="material-symbols-outlined text-[14px] align-middle text-emerald-400">table_chart</span> Product_Master</div>
            <div class="pl-6 text-on-surface-variant">│   └── <span class="material-symbols-outlined text-[14px] align-middle text-emerald-400">table_chart</span> Supplier_Master</div>
            <div>├── <span class="text-secondary font-semibold"><span class="material-symbols-outlined text-[14px] align-middle">folder</span> 02_Transactions/</span></div>
            <div class="pl-6 text-on-surface-variant">│   ├── <span class="material-symbols-outlined text-[14px] align-middle text-emerald-400">table_chart</span> Supplier_Transactions</div>
            <div class="pl-6 text-on-surface-variant">│   └── <span class="material-symbols-outlined text-[14px] align-middle text-emerald-400">table_chart</span> Issuance_Transactions</div>
            <div>├── <span class="text-secondary font-semibold"><span class="material-symbols-outlined text-[14px] align-middle">folder</span> 03_Settings_and_Users/</span></div>
            <div class="pl-6 text-on-surface-variant">│   └── <span class="material-symbols-outlined text-[14px] align-middle text-emerald-400">table_chart</span> Users_and_Settings</div>
            <div>├── <span class="text-secondary font-semibold"><span class="material-symbols-outlined text-[14px] align-middle">folder</span> 04_Invoices_and_Attachments/</span></div>
            <div class="pl-6 text-outline">│   ├── <span class="material-symbols-outlined text-[14px] align-middle">folder</span> Purchase_Orders/</div>
            <div class="pl-6 text-outline">│   └── <span class="material-symbols-outlined text-[14px] align-middle">folder</span> Delivery_Challans/</div>
            <div>├── <span class="text-secondary font-semibold"><span class="material-symbols-outlined text-[14px] align-middle">folder</span> 05_Reports_and_Exports/</span></div>
            <div class="pl-6 text-outline">│   ├── <span class="material-symbols-outlined text-[14px] align-middle">folder</span> Daily_Summaries/</div>
            <div class="pl-6 text-outline">│   ├── <span class="material-symbols-outlined text-[14px] align-middle">folder</span> Monthly_Valuation/</div>
            <div class="pl-6 text-outline">│   └── <span class="material-symbols-outlined text-[14px] align-middle">folder</span> Supplier_Audits/</div>
            <div>└── <span class="text-secondary font-semibold"><span class="material-symbols-outlined text-[14px] align-middle">folder</span> 06_System_Backups/</span></div>
          </div>
        </div>
      `;
      return;
    }

    function formatNode(node, prefix, isLast) {
      let html = '';
      const marker = isLast ? '└── ' : '├── ';
      const childPrefix = prefix + (isLast ? '    ' : '│   ');

      if (node.type === 'folder') {
        html += `
          <div class="flex items-center gap-1.5 py-0.5">
            <span class="text-outline select-none">${prefix}${marker}</span>
            <span class="material-symbols-outlined text-[15px] text-amber-400">folder</span>
            <a href="${node.url}" target="_blank" class="font-semibold text-secondary hover:underline">${node.name}/</a>
          </div>
        `;
      }

      const allChildren = [
        ...(node.subfolders || []),
        ...(node.files || [])
      ];

      allChildren.forEach((child, idx) => {
        const lastChild = idx === allChildren.length - 1;
        if (child.type === 'folder') {
          html += formatNode(child, childPrefix, lastChild);
        } else {
          html += `
            <div class="flex items-center gap-1.5 py-0.5 pl-1">
              <span class="text-outline select-none">${childPrefix}${lastChild ? '└── ' : '├── '}</span>
              <span class="material-symbols-outlined text-[15px] text-emerald-400">table_chart</span>
              <a href="${child.url}" target="_blank" class="text-on-surface hover:text-primary hover:underline">${child.name}</a>
              <span class="text-[10px] text-outline font-data-tabular">(${child.mimeType && child.mimeType.includes('spreadsheet') ? 'Sheet' : 'File'})</span>
            </div>
          `;
        }
      });

      return html;
    }

    let treeHtml = `
      <div class="space-y-0.5">
        <div class="flex items-center gap-1.5 font-bold text-primary pb-1 border-b border-outline-variant/10">
          <span class="material-symbols-outlined text-[18px]">folder_open</span>
          <a href="${tree.url || ('https://drive.google.com/drive/folders/' + tree.id)}" target="_blank" class="hover:underline">${tree.name || 'Root Database Folder'} (${tree.id})</a>
        </div>
        <div class="pt-1">
    `;

    const rootChildren = [
      ...(tree.subfolders || []),
      ...(tree.files || [])
    ];

    if (rootChildren.length === 0) {
      treeHtml += `<div class="text-outline py-1">Folder is empty. Click "Build / Organize Directory Tree" to provision structure.</div>`;
    } else {
      rootChildren.forEach((child, idx) => {
        const isLast = idx === rootChildren.length - 1;
        if (child.type === 'folder') {
          treeHtml += formatNode(child, '', isLast);
        } else {
          treeHtml += `
            <div class="flex items-center gap-1.5 py-0.5">
              <span class="text-outline select-none">${isLast ? '└── ' : '├── '}</span>
              <span class="material-symbols-outlined text-[15px] text-emerald-400">table_chart</span>
              <a href="${child.url}" target="_blank" class="text-on-surface hover:text-primary hover:underline">${child.name}</a>
            </div>
          `;
        }
      });
    }

    treeHtml += `</div></div>`;
    container.innerHTML = treeHtml;
  },

  // DEDICATED WORKFLOW MODE SWITCHER (INVENTORY STORE <-> POS OPERATIONS)
  switchMode: function(mode) {
    this.state.currentMode = mode;

    const sidebarTabDash = document.getElementById('sidebarTab-dashboard');
    const sidebarTabSp = document.getElementById('sidebarTab-sellingpoint');
    const navInventory = document.getElementById('sidebar-nav-inventory');
    const navPos = document.getElementById('sidebar-nav-pos');
    const storeWrap = document.getElementById('headerStoreSelectorWrap');
    const spWrap = document.getElementById('headerSpSelectorWrap');
    const invActions = document.getElementById('header-inventory-actions');
    const posActions = document.getElementById('header-pos-actions');
    const searchInput = document.getElementById('headerSearchInput');

    if (mode === 'inventory') {
      // 1. Switcher Tabs Styling
      if (sidebarTabDash) sidebarTabDash.className = 'flex-1 py-2 px-2 text-center rounded-lg text-xs font-bold transition-all bg-primary text-on-primary shadow-sm cursor-pointer flex items-center justify-center gap-1.5';
      if (sidebarTabSp) sidebarTabSp.className = 'flex-1 py-2 px-2 text-center rounded-lg text-xs font-semibold transition-all text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high cursor-pointer flex items-center justify-center gap-1.5';

      // 2. Sidebar Navigation: Show ONLY Inventory items, Hide POS items
      if (navInventory) navInventory.classList.remove('hidden');
      if (navPos) navPos.classList.add('hidden');

      // 3. Top Header: Show ONLY Inventory controls, Hide POS controls
      if (storeWrap) storeWrap.classList.remove('hidden');
      if (spWrap) spWrap.classList.add('hidden');
      if (invActions) invActions.classList.remove('hidden');
      if (posActions) posActions.classList.add('hidden');
      if (searchInput) searchInput.placeholder = 'Search inventory items, SKUs...';

      // 4. Activate Inventory Dashboard tab
      this.switchTab('dashboard');
    } else if (mode === 'pos') {
      // 1. Switcher Tabs Styling
      if (sidebarTabDash) sidebarTabDash.className = 'flex-1 py-2 px-2 text-center rounded-lg text-xs font-semibold transition-all text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high cursor-pointer flex items-center justify-center gap-1.5';
      if (sidebarTabSp) sidebarTabSp.className = 'flex-1 py-2 px-2 text-center rounded-lg text-xs font-bold transition-all bg-emerald-600 text-white shadow-sm cursor-pointer flex items-center justify-center gap-1.5';

      // 2. Sidebar Navigation: Show ONLY POS items, Hide Inventory items
      if (navInventory) navInventory.classList.add('hidden');
      if (navPos) navPos.classList.remove('hidden');

      // 3. Top Header: Show ONLY POS controls, Hide Inventory controls
      if (storeWrap) storeWrap.classList.add('hidden');
      if (spWrap) spWrap.classList.remove('hidden');
      if (invActions) invActions.classList.add('hidden');
      if (posActions) {
        posActions.classList.remove('hidden');
        posActions.classList.add('flex');
      }
      if (searchInput) searchInput.placeholder = 'Search bill no, guest, item...';

      // 4. Activate POS Operations tab and Overview section
      this.switchTab('sellingpoint');
      this.switchSpSection('overview');
    }
  },

  // TAB NAVIGATION
  switchTab: function(tabId) {
    this.state.activeTab = tabId;

    // Detect mode change if switching directly
    if (tabId === 'sellingpoint') {
      if (this.state.currentMode !== 'pos') {
        this.switchMode('pos');
        return;
      }
    } else if (this.state.currentMode === 'pos' && tabId !== 'sellingpoint') {
      // Switched to an inventory tab
      this.switchMode('inventory');
      if (tabId !== 'dashboard') {
        this.switchTab(tabId);
        return;
      }
    }

    // Update Sidebar Nav Items
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      item.className = 'nav-item flex items-center px-md py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all duration-200 group';
    });

    const activeBtn = document.getElementById('navBtn-' + tabId);
    if (activeBtn) {
      activeBtn.className = 'nav-item flex items-center px-md py-3 rounded-lg transition-all duration-200 group bg-primary-container text-on-primary-container font-semibold shadow-lg shadow-primary/20';
    }

    // Toggle Content Panes
    const panes = document.querySelectorAll('.tab-pane');
    panes.forEach(p => p.classList.add('hidden'));

    const targetPane = document.getElementById('tabContent-' + tabId);
    if (targetPane) {
      targetPane.classList.remove('hidden');
    }

    // Responsive, Zoom-Proof Header Logic:
    // Primary dashboards ('dashboard' and 'sellingpoint') feature their own dedicated in-page Top Command Cards.
    // The top sticky header is hidden on these two primary tabs to prevent duplicate headers and zoom clipping.
    // On sub-tabs (products, requisition, suppliers, issuance, reports, users, settings), the sticky top header is shown.
    const topHeader = document.getElementById('appTopHeader');
    if (topHeader) {
      if (tabId === 'dashboard' || tabId === 'sellingpoint') {
        topHeader.classList.add('hidden');
        topHeader.classList.remove('flex');
      } else {
        topHeader.classList.remove('hidden');
        topHeader.classList.add('flex');
      }
    }

    // Trigger Chart Resize and Report render if Reports
    if (tabId === 'reports') {
      if (this.state.categoryChart) this.state.categoryChart.resize();
      this.renderCurrentReport();
    }

    // Trigger Inventory Dashboard render
    if (tabId === 'dashboard') {
      this.recomputeLocalMetrics();
    }

    // Trigger Selling Point Dashboard render
    if (tabId === 'sellingpoint') {
      this.renderSellingPointDashboard();
    }

    // Trigger Users & RBAC Directory render
    if (tabId === 'users') {
      this.renderUsersTable();
    }
  },

  handleGlobalSearch: function(query) {
    const q = (query || '').trim();
    if (!q) return;

    if (this.state.currentMode === 'pos') {
      const spInput = document.getElementById('spSaleSearchInput');
      if (spInput) {
        spInput.value = q;
        this.switchSpSection('sales');
        this.filterSellingPointData();
      }
    } else {
      if (this.state.activeTab !== 'products') {
        this.switchTab('products');

      const searchInput = document.getElementById('catalogSearchInput');
      if (searchInput) {
        searchInput.value = q;
        this.filterCatalog();
      }

  filterByLocation: function(locName) {
    let prop = 'ALL';
    const l = locName.toUpperCase();
    if (l.includes('CENTRAL') || l.includes('S_000')) prop = 'S_000';
    else if (l.includes('S_001') || l.includes('STORE 1')) prop = 'S_001';
    else if (l.includes('S_002') || l.includes('STORE 2')) prop = 'S_002';

    this.handlePropertyFilterChange(prop, false);
    this.switchTab('products');
  },

  handlePropertyFilterChange: function(propertyCode, autoSwitchTab) {
    // RBAC Isolation Guard: If active user is locked to a specific store
    const curUser = this.state.currentUser;
    if (curUser) {
      const userLoc = String(curUser.assignedLocation || curUser.assignedStore || 'ALL').trim().toUpperCase();
      const isStoreScoped = (curUser.scopeType === 'STORE' || (userLoc.startsWith('S_') || userLoc === 'CENTRAL')) && !userLoc.startsWith('SP_') && userLoc !== 'ALL';
      if (isStoreScoped && propertyCode !== userLoc) {
        this.showToast(`Access Restricted: Your user account is locked to [${userLoc}]. Switch user to view other stores.`, 'error');
        ['headerPropertyFilter', 'dashStoreSelect', 'spStoreSelect'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.value = userLoc;
        });
        return;
      }
    }

    this.state.propertyFilter = propertyCode;

    // Synchronize all Store Dropdowns across header & dashboards
    ['headerPropertyFilter', 'dashStoreSelect', 'spStoreSelect'].forEach(id => {
      const el = document.getElementById(id);
      if (el && el.value !== propertyCode) {
        el.value = propertyCode;
      }
    });

    this.filterCatalog();
    this.filterTransactions();
    this.recomputeLocalMetrics();

    if (autoSwitchTab && this.state.activeTab !== 'dashboard') {
      this.switchTab('dashboard');
    }

    const storeNames = {
      'ALL': 'All Stores & Outlets (Consolidated)',
      'S_000': 'Central Depot Warehouse (S_000)',
      'CENTRAL': 'Central Depot Warehouse (S_000)',
      'S_001': 'Store 1 - Main Branch (S_001)',
      'S_002': 'Store 2 - Outlet Branch (S_002)'
    };
    const storeLabel = storeNames[propertyCode] || (propertyCode + ' Store');
    this.showToast(`Active Store: ${storeLabel}`);
  },

  handleSellingPointFilterChange: function(spCode, autoSwitchTab) {
    // RBAC Isolation Guard: If active user is locked to a specific selling point
    const curUser = this.state.currentUser;
    if (curUser) {
      const userLoc = String(curUser.assignedLocation || curUser.assignedStore || 'ALL').trim().toUpperCase();
      const isSpScoped = (curUser.scopeType === 'SELLING_POINT' || userLoc.startsWith('SP_')) && userLoc !== 'ALL';
      if (isSpScoped && spCode !== userLoc) {
        this.showToast(`Access Restricted: Your user account is locked to [${userLoc}]. Switch user to view other counters.`, 'error');
        ['headerSellingPointFilter', 'dashSellingPointSelect', 'spActiveSelect'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.value = userLoc;
        });
        return;
      }
    }

    this.state.spFilter = spCode;

    // Synchronize all Selling Point Dropdowns across header & dashboards
    ['headerSellingPointFilter', 'dashSellingPointSelect', 'spActiveSelect'].forEach(id => {
      const el = document.getElementById(id);
      if (el && el.value !== spCode) {
        el.value = spCode;
      }
    });

    if (autoSwitchTab && this.state.activeTab !== 'sellingpoint') {
      this.switchTab('sellingpoint');
    }

    this.filterSellingPointData();

  // Fast in-memory metric recalculation when items change
  recomputeLocalMetrics: function() {
    const items = this.state.items || [];
    const prop = this.state.propertyFilter || 'ALL';
    let totalValuation = 0;
    let totalUnits = 0;
    let lowStockCount = 0;
    let outOfStockCount = 0;
    const catMap = {};

    items.forEach(it => {
      let stock = Number(it.totalStock || it.currentStock) || 0;
      if (prop === 'S_000' || prop === 'CENTRAL') {
        stock = Number(it.centralStock != null ? it.centralStock : (it.stockS000 != null ? it.stockS000 : it.totalStock)) || 0;
      } else if (prop === 'S_001') {
        stock = Number(it.stockS001 != null ? it.stockS001 : (it.s001Stock != null ? it.s001Stock : it.totalStock)) || 0;
      } else if (prop === 'S_002') {
        stock = Number(it.stockS002 != null ? it.stockS002 : (it.s002Stock != null ? it.s002Stock : it.totalStock)) || 0;
      }

      const rate = Number(it.rate || it.unitCost) || 0;
      const min = Number(it.minStock || 0);
      const val = stock * rate;

      totalUnits += stock;
      totalValuation += val;

      if (stock === 0) {
        outOfStockCount++;
      } else if (stock <= min) {
        lowStockCount++;
      }

      const cat = it.category || 'Uncategorized';
      if (!catMap[cat]) catMap[cat] = { count: 0, units: 0, value: 0 };
      catMap[cat].count++;
      catMap[cat].units += stock;
      catMap[cat].value += val;
    });

    if (!this.state.metrics) this.state.metrics = {};
    this.state.metrics.totalSkus = items.length;
    this.state.metrics.totalUnits = totalUnits;
    this.state.metrics.totalValuation = totalValuation;
    this.state.metrics.lowStockCount = lowStockCount;
    this.state.metrics.outOfStockCount = outOfStockCount;
    this.state.metrics.categoryBreakdown = catMap;

    const navBadge = document.getElementById('navTotalItemsBadge');
    if (navBadge) navBadge.innerText = items.length;
    const skusBadge = document.getElementById('sidebarSkusBadge');
    if (skusBadge) skusBadge.innerText = items.length;

    this.renderDashboard();
  },

  renderCategoryBars: function(categoryMap) {
    const container = document.getElementById('categoryBarsContainer');
    if (!container) return;

    const categories = Object.keys(categoryMap || {});
    let sorted = categories.map(c => ({
      name: c,
      units: categoryMap[c].units || 0,
      value: categoryMap[c].value || 0
    })).filter(item => item.units > 0).sort((a, b) => b.units - a.units).slice(0, 5);

    if (sorted.length === 0) {
      container.innerHTML = `<div class="py-12 text-center text-on-surface-variant text-xs w-full">No category stock recorded in Product_Master sheet yet.</div>`;
      return;
    }

    const maxUnits = Math.max(...sorted.map(s => s.units), 10);
    const barColors = ['bg-primary', 'bg-primary-fixed-dim', 'bg-secondary-fixed-dim', 'bg-secondary', 'bg-secondary-container'];
    const yLabels = [Math.round(maxUnits), Math.round(maxUnits * 0.75), Math.round(maxUnits * 0.5), Math.round(maxUnits * 0.25), 0];

    const barsHtml = sorted.map((item, idx) => {
      const heightPct = Math.max(10, Math.round((item.units / maxUnits) * 92));
      const colorClass = barColors[idx % barColors.length];
      const shortName = item.name.split(' ')[0].replace('&', '');
      return `
        <div class="flex flex-col items-center gap-xs z-10 w-full group">
          <span class="font-data-tabular text-data-tabular text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity">${item.units}</span>
          <div class="w-full ${colorClass} rounded-t-sm" style="height: ${heightPct}%; transition: height 0.8s ease-out;"></div>
          <span class="font-label-caps text-label-caps text-outline mt-sm rotate-45 md:rotate-0 origin-left truncate w-full text-center" title="${item.name}">${shortName}</span>
        </div>
      `;
    }).join('');

    container.innerHTML = `
      <div class="absolute inset-0 flex flex-col justify-between pointer-events-none opacity-20 z-0">
        <div class="border-b border-outline-variant w-full"></div>
        <div class="border-b border-outline-variant w-full"></div>
        <div class="border-b border-outline-variant w-full"></div>
        <div class="border-b border-outline-variant w-full"></div>

  refreshReportData: function() {
    const icon = document.getElementById('reportSyncIcon');
    if (icon) icon.classList.add('animate-spin');

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (icon) icon.classList.remove('animate-spin');
          if (res && res.success) {
            if (res.supplierTransactions) app.state.supplierTransactions = res.supplierTransactions;
            if (res.issuanceTransactions) app.state.issuanceTransactions = res.issuanceTransactions;
            app.renderCurrentReport();
            app.showToast('Full ledger synced for reports!');
          } else {
            app.renderCurrentReport();
          }
        })
        .withFailureHandler(function(err) {
          if (icon) icon.classList.remove('animate-spin');
          app.showToast('Sync error: ' + err.message, 'error');
          app.renderCurrentReport();
        })
        .fetchFullReportsData();
    } else {
      setTimeout(() => {
        if (icon) icon.classList.remove('animate-spin');
        this.renderCurrentReport();
        this.showToast('Local report records refreshed!');
      }, 300);
    }
  },

  getReportData: function() {
    const reportType = this.state.currentReportType || 'purchase';
    const reportFormat = this.state.currentReportFormat || 'supplier';
    const query = this.state.reportSearchQuery || '';

    if (reportType === 'purchase') {
      return this.computePurchaseReport(reportFormat, query);
    } else {
      return this.computeTransferReport(reportFormat, query);
    }
  },

  computePurchaseReport: function(format, query) {
    const txns = this.state.supplierTransactions || [];
    let totalSpend = 0;
    let totalQty = 0;

      totalQty += Number(t.quantity) || 0;
    });

      // 1. Supplier Wise
      const map = {};
      txns.forEach(t => {
        const key = String(t.supplierName || t.supplierCode || 'Unassigned Supplier').trim();
        if (!map[key]) {
          map[key] = {
            supplierCode: t.supplierCode || 'SUP',
            supplierName: key,
            invoices: new Set(),
            quantity: 0,
            taxAmount: 0,
            totalAmount: 0,
            lastDate: t.timestamp || ''
          };
        }
        if (t.id || t.reference) map[key].invoices.add(t.id || t.reference);
        map[key].quantity += Number(t.quantity) || 0;
        const taxRate = Number(t.taxPercent) || 0;
        const amt = Number(t.totalAmount) || 0;
        map[key].taxAmount += amt * (taxRate / (100 + taxRate));
        map[key].totalAmount += amt;
        if (t.timestamp && t.timestamp > map[key].lastDate) map[key].lastDate = t.timestamp;
      });

      let rows = Object.values(map).map(s => ({

        name: s.supplierName,

  computeTransferReport: function(format, query) {
    const txns = this.state.issuanceTransactions || [];

    let totalQty = 0;
    let totalTxns = txns.length;

    txns.forEach(t => {
      const val = Number(t.totalCost) || (Number(t.quantity) * Number(t.rate || t.unitPrice || 0));
      totalVal += val;
      totalQty += Number(t.quantity) || 0;

    // Helper item map for category lookup
    const itemCatMap = {};
    (this.state.items || []).forEach(it => {

      itemCatMap[code] = it.category || 'General';
    });

    if (format === 'supplier') {
      // 1. Store / Outlet Wise

      txns.forEach(t => {
        const dest = String(t.destLocation || t.toSellingPointCode || 'Store 1 (Main Branch)').trim();
        if (!map[dest]) {

            destCode: t.toSellingPointCode || 'STORE',
            destName: dest,
            source: t.sourceLocation || 'Central Depot (S_000)',
            transfers: new Set(),

            totalValuation: 0,
            lastDate: t.timestamp || ''
          };

        const val = Number(t.totalCost) || (Number(t.quantity) * Number(t.rate || t.unitPrice || 0));

  downloadCurrentReport: function(type = 'csv') {
    const data = this.getReportData();
    if (!data || !data.rows || data.rows.length === 0) {
      this.showToast('No data available to download in current report view.', 'error');
      return;
    }

    const headers = data.columns.map(c => c.label);
    const rows = data.rows.map(row => {
      return data.columns.map(c => {
        let val = row[c.key];
        if (c.isPercent) return Number(val || 0).toFixed(2) + '%';
        if (c.isCurrency) return Number(val || 0).toFixed(2);
        return val !== undefined && val !== null ? val : '';
      });
    });

    const now = new Date();
    const dateStr = now.toISOString().split('T')[0];
    const cleanTitle = data.title.replace(/[^a-zA-Z0-9]/g, '_');
    const filename = `Zolexora_${cleanTitle}_${dateStr}.csv`;

    let csvContent = "\uFEFF"; // UTF-8 BOM for Microsoft Excel
    csvContent += headers.map(h => `"${String(h).replace(/"/g, '""')}"`).join(",") + "\r\n";
    rows.forEach(r => {
      csvContent += r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",") + "\r\n";
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", filename);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);

    this.showToast(`Report downloaded: ${filename}`);
  },

      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: dataVals,
          backgroundColor: colors.slice(0, labels.length),
          borderWidth: 2,
          borderColor: '#191b23'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              boxWidth: 9,
              font: { size: 9, family: 'Cambria, Georgia, serif' },

            }

            callbacks: {
              label: function(context) {

  // ==========================================
  // INVENTORY CATALOG
  // ==========================================
  filterCatalogByLowStock: function() {
    this.switchTab('products');
    const filter = document.getElementById('catalogStockFilter');
    if (filter) filter.value = 'LOW';
    this.filterCatalog();
  },

  filterCatalog: function() {
    const searchVal = (document.getElementById('catalogSearchInput')?.value || '').toLowerCase().trim();
    const catVal = document.getElementById('catalogCategoryFilter')?.value || 'ALL';
    const stockVal = document.getElementById('catalogStockFilter')?.value || 'ALL';
    const propFilter = this.state.propertyFilter;

    let items = this.state.items.filter(item => {
      // Search match
      const matchSearch = !searchVal || 
        (item.name && item.name.toLowerCase().includes(searchVal)) ||
        (item.sku && item.sku.toLowerCase().includes(searchVal)) ||
        (item.category && item.category.toLowerCase().includes(searchVal)) ||
        (item.supplier && item.supplier.toLowerCase().includes(searchVal));

      if (!matchSearch) return false;

      // Category match
      if (catVal !== 'ALL' && item.category !== catVal) return false;

      // Stock status filter
      const total = Number(item.totalStock) || 0;
      const min = Number(item.minStock) || 0;
      if (stockVal === 'LOW' && (total > min || total === 0)) return false;
      if (stockVal === 'OUT' && total !== 0) return false;
      if (stockVal === 'OK' && total <= min) return false;

      // Property specific non-zero check if selected
      if (propFilter === 'CENTRAL' && stockVal !== 'ALL' && item.centralStock <= 0) return false;
      if (propFilter === 'S_001' && stockVal !== 'ALL' && (item.stockS001 || 0) <= 0) return false;
      if (propFilter === 'S_002' && stockVal !== 'ALL' && (item.stockS002 || 0) <= 0) return false;

      return true;
    });

    this.renderCatalogTable(items);
  },

  renderCatalogTable: function(items) {
    const tbody = document.getElementById('catalogTableBody');
    const countLabel = document.getElementById('catalogCountLabel');
    if (!tbody) return;

    if (countLabel) countLabel.innerText = `Showing ${items.length} of ${this.state.items.length} items`;

    if (!items || items.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10" class="py-12 text-center text-on-surface-variant font-medium">No items found matching the current search &amp; filters.</td></tr>`;
      return;
    }

    tbody.innerHTML = items.map(item => {
      const total = Number(item.totalStock) || 0;
      const min = Number(item.minStock) || 0;
      const isOut = total === 0;
      const isLow = !isOut && total <= min;

      const isDiscontinued = String(item.status || 'Active').toLowerCase() === 'discontinued';
      let statusPill = isDiscontinued
        ? `<span class="inline-block w-2.5 h-2.5 rounded-full bg-rose-500" title="Discontinued Item"></span>`
        : isOut 
        ? `<span class="inline-block w-2.5 h-2.5 rounded-full bg-error" title="Out of Stock"></span>`
        : isLow 
        ? `<span class="inline-block w-2.5 h-2.5 rounded-full bg-tertiary animate-pulse" title="Low Stock Warning"></span>`
        : `<span class="inline-block w-2.5 h-2.5 rounded-full bg-secondary" title="Stock Healthy"></span>`;

      return `
        <tr class="hover:bg-surface-container-high transition border-b border-outline-variant/10 text-on-surface ${isDiscontinued ? 'opacity-85' : ''}">
          <!-- SKU / Barcode -->
          <td class="py-3 px-4">
            <div class="flex items-center space-x-2">
              ${statusPill}
              <button onclick="app.openBarcodeModal('${item.id || item.code}')" title="Click to view/print barcode" class="font-data-tabular text-xs font-bold text-primary hover:underline">
                ${item.sku || item.code || item.id}
              </button>
            </div>
            <div class="text-[10px] text-outline ml-4 font-mono">${item.id || item.code}</div>
          </td>

          <!-- Name & Category -->
          <td class="py-3 px-4">
            <div class="font-bold text-on-surface text-xs sm:text-sm flex items-center flex-wrap gap-1.5">
              <span>${item.name}</span>
              ${isDiscontinued ? `<span class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40">Discontinued</span>` : ''}
            </div>
            <div class="flex items-center space-x-2 text-[11px] text-on-surface-variant mt-0.5">
              <span class="bg-surface-container-highest text-on-surface-variant px-1.5 py-0.5 rounded text-[10px] font-medium">${item.category}</span>
              ${item.supplier ? `<span class="truncate max-w-[140px] text-outline text-[11px] flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">local_shipping</span>${item.supplier}</span>` : ''}
            </div>
          </td>

          <!-- Property Stocks -->
          <td class="py-3 px-3 text-center font-data-tabular font-bold text-primary">${item.centralStock}</td>
          <td class="py-3 px-3 text-center font-data-tabular font-bold text-secondary">${item.stockS001 || 0}</td>
          <td class="py-3 px-3 text-center font-data-tabular font-bold text-tertiary">${item.stockS002 || 0}</td>

          <!-- Total Stock -->
          <td class="py-3 px-3 text-center font-data-tabular font-extrabold text-sm ${isOut ? 'text-error' : isLow ? 'text-tertiary' : 'text-on-surface'}">
            ${item.totalStock} <span class="text-[10px] font-normal text-outline">${item.unit}</span>
          </td>

          <!-- Min Stock Alert -->
          <td class="py-3 px-3 text-center text-outline font-data-tabular">
            ${item.minStock}
          </td>

          <!-- Unit Cost -->
          <td class="py-3 px-3 text-right text-on-surface-variant font-data-tabular">
            ${this.formatCurrency(item.unitCost)}
          </td>

          <!-- Total Valuation -->
          <td class="py-3 px-4 text-right font-bold text-on-surface font-data-tabular">
            ${this.formatCurrency(item.totalValue)}
          </td>

          <!-- Actions -->
          <td class="py-3 px-4 text-center">
            <div class="inline-flex items-center space-x-1">
              ${isDiscontinued 
                ? `<button disabled title="Item Discontinued - Purchase Not Allowed" class="p-1 rounded bg-white/5 text-white/20 border border-white/10 cursor-not-allowed">
                    <span class="material-symbols-outlined text-[16px]">receipt_long</span>
                  </button>`
                : `<button onclick="app.openPurchaseInvoiceModal('${item.id || item.code}')" title="Purchase Entry Invoice" class="p-1 rounded bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-400 border border-emerald-500/30 transition cursor-pointer">
                    <span class="material-symbols-outlined text-[16px]">receipt_long</span>
                  </button>`
              }
              <button onclick="app.openTransferInvoiceModal('${item.id || item.code}')" title="Transfer Entry Invoice" class="p-1 rounded bg-primary/20 hover:bg-primary/30 text-primary border border-primary/30 transition cursor-pointer">
                <span class="material-symbols-outlined text-[16px]">sync_alt</span>
              </button>
              <button onclick="app.openBarcodeModal('${item.id || item.code}')" title="Print Barcode" class="p-1 rounded bg-surface-container-high hover:bg-surface-container-highest text-on-surface transition border border-white/10 cursor-pointer">
                <span class="material-symbols-outlined text-[16px]">qr_code</span>
              </button>
              <button onclick="app.openEditItemModal('${item.id || item.code}')" title="Edit Item (Name &amp; Category)" class="p-1 rounded bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/30 transition cursor-pointer">
                <span class="material-symbols-outlined text-[16px]">edit</span>

              <button onclick="app.confirmDeleteItem('${item.id || item.code}')" title="Delete Item" class="p-1 rounded bg-error-container/20 hover:bg-error-container/30 text-error transition cursor-pointer">
                <span class="material-symbols-outlined text-[16px]">delete</span>
              </button>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  },

  // ==========================================

  // ==========================================
  filterTransactions: function() {
    const searchVal = (document.getElementById('txnSearchInput')?.value || '').toLowerCase().trim();
    const typeVal = document.getElementById('txnTypeFilter')?.value || 'ALL';

    const filtered = this.state.recentTransactions.filter(t => {
      if (typeVal !== 'ALL' && t.type !== typeVal) return false;
      if (!searchVal) return true;

      return (
        (t.id && t.id.toLowerCase().includes(searchVal)) ||
        (t.itemName && t.itemName.toLowerCase().includes(searchVal)) ||
        (t.sku && t.sku.toLowerCase().includes(searchVal)) ||
        (t.reference && t.reference.toLowerCase().includes(searchVal)) ||
        (t.performedBy && t.performedBy.toLowerCase().includes(searchVal)) ||
        (t.notes && t.notes.toLowerCase().includes(searchVal))
      );
    });

    this.renderTransactionsTable(filtered);
  },

      const dateFormatted = t.timestamp ? new Date(t.timestamp).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '--';

      return `
        <tr class="hover:bg-surface-container-high transition border-b border-outline-variant/10 text-on-surface">
          <td class="py-3 px-4 font-mono text-[11px] text-outline">${t.id}</td>
          <td class="py-3 px-3 text-on-surface-variant font-data-tabular whitespace-nowrap text-xs">${dateFormatted}</td>

          <td class="py-3 px-4">
            <div class="font-bold text-on-surface text-xs">${t.itemName}</div>
            <div class="text-[10px] text-outline font-mono">${t.sku}</div>
          </td>
          <td class="py-3 px-3 text-center font-bold font-data-tabular text-on-surface">${t.quantity} ${t.unit || ''}</td>
          <td class="py-3 px-3 text-on-surface-variant text-xs">${t.sourceLocation || '--'}</td>
          <td class="py-3 px-3 text-on-surface-variant text-xs">${t.destLocation || '--'}</td>
          <td class="py-3 px-3 text-right font-data-tabular font-bold text-on-surface">${this.formatCurrency(t.totalCost)}</td>
          <td class="py-3 px-3 font-mono text-xs text-primary">${t.reference || '--'}</td>
          <td class="py-3 px-4 text-on-surface-variant text-xs">

  saveAppSettings: function() {
    const name = document.getElementById('settingHotelName').value.trim();
    const curr = document.getElementById('settingCurrencySymbol').value.trim();

    this.showLoading('Saving settings...', 'Updating system preferences');
    const newSettings = {
      HOTEL_NAME: name,
      CURRENCY_SYMBOL: curr
    };

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function() {
          app.hideLoading();
          app.state.settings.HOTEL_NAME = name;
          app.state.settings.CURRENCY_SYMBOL = curr;
          app.renderDashboard();
          app.filterCatalog();
          app.showToast('Settings saved successfully!');
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Error saving settings: ' + err.message, 'error');
        })
        .saveSettings(newSettings);
    } else {
      this.hideLoading();
      this.state.settings.HOTEL_NAME = name;
      this.state.settings.CURRENCY_SYMBOL = curr;
      this.renderDashboard();
      this.showToast('Settings updated (local test mode)');
    }
  },

    const val = (input ? input.value : '').trim();

    if (!val) {
      this.showToast('Please enter a valid Google Sheet URL or ID.', 'error');
      return;
    }

    this.showLoading('Connecting Google Sheet...', 'Validating permissions and initializing database tabs');

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(res) {
          app.hideLoading();
          if (res.success) {
            app.showToast(res.message);
            input.value = '';
            app.loadInitialData(true);
          } else {
            app.showToast(res.error || 'Failed to connect sheet', 'error');

          app.hideLoading();

      this.hideLoading();

  populateAllSelectDropdowns: function() {
    // Populate Category filter
    const catFilter = document.getElementById('catalogCategoryFilter');
    if (catFilter) {
      const cats = [...new Set(this.state.items.map(i => i.category).filter(Boolean))];
      catFilter.innerHTML = `<option value="ALL">All Categories (${cats.length})</option>` +
        cats.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // Populate Item selectors for Stock In, Out, Transfer, Adjustment
    const itemOptions = this.state.items.map(i => `<option value="${i.id}">${i.name} [${i.sku}] - Total: ${i.totalStock} ${i.unit}</option>`).join('');

    ['stockInItemId', 'stockOutItemId', 'transferItemId', 'adjItemId'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = itemOptions;
    });

    // Populate Suppliers in Item & Stock In forms (all 28 real vendors)
    const supOptions = `<option value="">-- None / Direct --</option>` +
      this.state.suppliers.map(s => `<option value="${s.name}">[${s.code || s.id}] ${s.name} (${s.category})</option>`).join('');

    ['itemSupplier', 'stockInSupplier'].forEach(id => {

  // ==============================================================
  // 0A. ADD NEW PRODUCT ITEM ENGINE (NO DUPLICATES, AUTO CODES)
  // ==============================================================
  addCategoryMode: 'existing',

  generateUniqueCategoryCode: function(categoryName) {
    const raw = String(categoryName || 'General').trim().replace(/[^a-zA-Z0-9]/g, '');
    let prefix = raw.slice(0, 3).toUpperCase();
    if (!prefix || prefix.length < 2) prefix = 'GEN';
    let baseCode = 'CAT_' + prefix;

    const items = this.state.items || [];
    const existingCodes = new Set();
    items.forEach(it => {
      if (it.categoryCode) existingCodes.add(String(it.categoryCode).trim().toUpperCase());
    });

    if (!existingCodes.has(baseCode)) return baseCode;

    let counter = 1;
    while (existingCodes.has(`${baseCode}_${String(counter).padStart(2, '0')}`)) {
      counter++;
    }
    return `${baseCode}_${String(counter).padStart(2, '0')}`;
  },

  generateUniqueProductCode: function(categoryCode) {
    const prefix = (categoryCode || 'CAT_GEN').replace(/^CAT_/, '').slice(0, 3) || 'GEN';
    const items = this.state.items || [];
    const existingCodes = new Set();
    items.forEach(it => {
      const code = String(it.code || it.sku || it.id || '').trim().toUpperCase();
      if (code) existingCodes.add(code);
    });

    let seq = items.length + 1;
    let candidate = `PRD_${prefix}_${String(seq).padStart(3, '0')}`;
    while (existingCodes.has(candidate)) {
      seq++;
      candidate = `PRD_${prefix}_${String(seq).padStart(3, '0')}`;
    }
    return candidate;
  },

    const existingItem = (this.state.items || []).find(it => it.category === firstCat);

    const catBadge = document.getElementById('addItemCategoryCodeBadge');

  handleAddItemSubmit: function(e) {
    e.preventDefault();
    const name = document.getElementById('addItemName').value.trim();
    if (!name) {
      this.showToast('Please enter a Product Name.', 'error');
      return;
    }

    const lower = name.toLowerCase();
    if ((this.state.items || []).some(it => String(it.name || it.description || '').trim().toLowerCase() === lower)) {
      this.showToast(`Product "${name}" already exists! Duplicates are not allowed.`, 'error');
      return;
    }

    let category = '';
    if (this.addCategoryMode === 'new') {
      category = document.getElementById('addItemCategoryNew').value.trim();
      if (!category) {
        this.showToast('Please enter a New Category name.', 'error');
        return;
      }
      if (this.getItemCategories().some(c => c.toLowerCase() === category.toLowerCase())) {
        this.showToast(`Category "${category}" already exists! Please select it from the list.`, 'error');
        return;
      }
    } else {
      category = document.getElementById('addItemCategorySelect').value;
    }

    const catCode = document.getElementById('addItemCategoryCodeBadge').innerText.trim();
    const prdCode = document.getElementById('addItemCodeBadge').innerText.trim();

    const uomSelect = document.getElementById('addItemUomSelect').value;
    const uom = uomSelect === 'CUSTOM' ? (document.getElementById('addItemCustomUom').value.trim() || 'Pcs') : uomSelect;

    const rate = parseFloat(document.getElementById('addItemRate').value) || 0;
    const taxSelect = document.getElementById('addItemTaxSelect').value;
    const taxPercent = taxSelect === 'CUSTOM' ? (parseFloat(document.getElementById('addItemCustomTax').value) || 0) : parseFloat(taxSelect);

    const centralStock = Number(document.getElementById('addItemCentralStock').value) || 0;
    const stockS001 = Number(document.getElementById('addItemStore1Stock').value) || 0;
    const stockS002 = Number(document.getElementById('addItemStore2Stock').value) || 0;

    const payload = {
      code: prdCode,
      sku: prdCode,
      id: prdCode,
      name: name,
      category: category,
      categoryCode: catCode,
      unit: uom,
      uom: uom,
      rate: rate,
      unitCost: rate,
      taxPercent: taxPercent,
      centralStock: centralStock,
      stockS001: stockS001,
      stockS002: stockS002,
      minStock: 10,
      status: 'Active'
    };

    this.showLoading('Saving New Product Item...', `Registering ${name} (${prdCode})`);

    if (this.isGasEnv()) {
      google.script.run
        .withSuccessHandler(function(res) {
          app.hideLoading();
          app.closeModal('addItemModal');
          app.showToast(`Product item "${name}" created successfully with code ${prdCode}!`);
          if (res && res.items) {
            app.state.items = res.items;
            app.filterCatalog();
            app.recomputeLocalMetrics();
          } else {
            app.loadInitialData(true);
          }
        })
        .withFailureHandler(function(err) {
          app.hideLoading();
          app.showToast('Error saving item: ' + err.message, 'error');
        })
        .saveItem(payload);
    } else {
      setTimeout(() => {
        app.hideLoading();
        app.closeModal('addItemModal');
        app.showToast(`Product "${name}" saved (local mode)!`);
      }, 500);
    }
  },

  currentEditingItemCode: null,

  openEditItemModal: function(defaultItemCode = null) {
    const items = this.state.items || [];
    if (items.length === 0) {
      this.showToast('No items in catalog to edit.', 'warning');
      return;
    }

    const categories = this.getItemCategories();
    const catSelect = document.getElementById('editItemCategorySelect');
    if (catSelect) {
      catSelect.innerHTML = `<option value="ALL">-- All Categories --</option>` +
        categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    const changeCatSelect = document.getElementById('editItemChangeCategory');
    if (changeCatSelect) {
      changeCatSelect.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    this.populateEditItemSelect('ALL', defaultItemCode);

    if (defaultItemCode) {
      const item = items.find(it => (it.code || it.id || it.sku) === defaultItemCode);
      if (item) {
        if (catSelect) catSelect.value = item.category || 'ALL';
        this.populateEditItemSelect(item.category || 'ALL', defaultItemCode);
        this.loadEditItemDetails(item);
      }
    } else {
      const firstItem = items[0];
      if (firstItem) {
        if (catSelect) catSelect.value = firstItem.category || 'ALL';
        this.loadEditItemDetails(firstItem);
      }
    }

    this.openModal('editItemModal');
  },

  editItem: function(itemId) {
    this.openEditItemModal(itemId);
  },

  populateEditItemSelect: function(categoryFilter, selectItemCode = null) {
    const itemSelect = document.getElementById('editItemSelect');
    if (!itemSelect) return;

    const items = this.state.items || [];
    const filtered = (categoryFilter && categoryFilter !== 'ALL')
      ? items.filter(it => it.category === categoryFilter)
      : items;

    if (filtered.length === 0) {
      itemSelect.innerHTML = `<option value="">-- No items in this category --</option>`;
      return;
    }

    itemSelect.innerHTML = filtered.map(it => {
      const code = it.code || it.id || it.sku;
      const isSelected = selectItemCode ? (code === selectItemCode) : false;
      const isDisc = String(it.status).toLowerCase() === 'discontinued';
      return `<option value="${code}" ${isSelected ? 'selected' : ''}>[${code}] ${it.name || it.description} ${isDisc ? '(Discontinued)' : ''}</option>`;
    }).join('');

    if (selectItemCode) {
      itemSelect.value = selectItemCode;
    }
  },

  onEditCategorySelectChange: function() {
    const catSelect = document.getElementById('editItemCategorySelect');
    const selectedCategory = catSelect ? catSelect.value : 'ALL';
    this.populateEditItemSelect(selectedCategory);

    const itemSelect = document.getElementById('editItemSelect');
    if (itemSelect && itemSelect.value) {
      this.onEditItemSelectChange();
    }
  },

  onEditItemSelectChange: function() {
    const itemSelect = document.getElementById('editItemSelect');
    if (!itemSelect) return;
    const itemCode = itemSelect.value;
    const item = (this.state.items || []).find(it => (it.code || it.id || it.sku) === itemCode);

    if (item) {
      const catSelect = document.getElementById('editItemCategorySelect');
      if (catSelect && item.category) {

      this.loadEditItemDetails(item);

    if (nameInput) nameInput.value = item.name || item.description || '';

    const changeCatSelect = document.getElementById('editItemChangeCategory');
    if (changeCatSelect && item.category) {
      changeCatSelect.value = item.category;
    }

    const codeInput = document.getElementById('editItemCode');
    if (codeInput) codeInput.value = this.currentEditingItemCode;

    const rateInput = document.getElementById('editItemRate');
    if (rateInput) rateInput.value = this.formatCurrency(item.rate || item.unitCost || 0) + ' (Locked 🔒)';

    const taxUomInput = document.getElementById('editItemTaxUom');
    if (taxUomInput) taxUomInput.value = `${item.taxPercent || 0}% GST / ${item.uom || item.unit || 'Pcs'}`;

    const s1Stock = document.getElementById('editItemStore1Stock');
    if (s1Stock) s1Stock.innerText = item.stockS001 || 0;

    const s2Stock = document.getElementById('editItemStore2Stock');
    if (s2Stock) s2Stock.innerText = item.stockS002 || 0;

    const totStock = document.getElementById('editItemTotalStock');
    if (totStock) totStock.innerText = `${item.totalStock || 0} ${item.uom || item.unit || 'Pcs'}`;

    const isDiscontinued = String(item.status || 'Active').toLowerCase() === 'discontinued';
    const statusBadge = document.getElementById('editItemStatusBadge');
    const discAlert = document.getElementById('editItemDiscontinuedAlert');
    const discBtn = document.getElementById('editItemDiscontinueBtn');

    if (isDiscontinued) {
      if (statusBadge) {
        statusBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30';
        statusBadge.innerText = 'Discontinued';
      }
      if (discAlert) discAlert.classList.remove('hidden');
      if (discBtn) {
        discBtn.className = 'px-4 py-2 bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-400 border border-emerald-500/30 rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer shadow-sm';
        discBtn.innerHTML = `<span class="material-symbols-outlined text-[16px]">check_circle</span><span>Reactivate Item</span>`;
      }
    } else {
      if (statusBadge) {
        statusBadge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
        statusBadge.innerText = 'Active';
      }
      if (discAlert) discAlert.classList.add('hidden');
      if (discBtn) {
        discBtn.className = 'px-4 py-2 bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer shadow-sm';
        discBtn.innerHTML = `<span class="material-symbols-outlined text-[16px]">block</span><span>Discontinue Item</span>`;
      }
